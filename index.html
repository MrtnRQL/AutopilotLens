            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M6.5 9.5l3-3M5 11l-1 1a2.1 2.1 0 01-3-3l2-2a2.1 2.1 0 013 0M11 5l1-1a2.1 2.1 0 013 3l-2 2a2.1 2.1 0 01-3 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            Copy link
          </button>
        </div>
        <div id="sim-export" style="display:flex;gap:8px;">${exportButtonsHtml()}</div>
      </div>

      <div id="sim-out">
        <div class="card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:280px;gap:10px;text-align:center;color:var(--text3);">
          <div style="font-size:32px;opacity:.25;">⊂</div>
          <div class="title">Run a simulation</div>
          <div class="desc">Fill in the device properties and click See what applies.</div>
        </div>
      </div>
    </div>

    <div id="device-picker" class="modal-bg">
      <div class="modal-box">
        <div class="modal-head"><div class="panel-title"><div class="eyebrow">Devices</div><div class="title">Browse Devices</div></div><button class="btn btn-ghost" onclick="closeModal('device-picker')">Close</button></div>
        <div style="padding:12px 16px;border-bottom:1px solid var(--border);"><input class="inp" id="device-search" placeholder="Search by device name or serial…" oninput="filterDevicePicker(this.value)" /></div>
        <div id="device-list" class="modal-list"></div>
      </div>
    </div>

    <div id="user-picker" class="modal-bg">
      <div class="modal-box">
        <div class="modal-head"><div class="panel-title"><div class="eyebrow">Users</div><div class="title">Browse Users</div></div><button class="btn btn-ghost" onclick="closeModal('user-picker')">Close</button></div>
        <div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:8px;"><input class="inp" id="user-search" placeholder="Search by name or UPN…" style="flex:1;" /><button class="btn btn-accent" onclick="searchUsers()">Search</button></div>
        <div id="user-list" class="modal-list"></div>
      </div>
    </div>`;
}

function closeModal(id) { el(id).style.display = 'none'; }

function openDevicePicker() { el('device-picker').style.display = 'flex'; renderDeviceList(DATA.managedDevices); }
function filterDevicePicker(q) {
  const query = (q || '').toLowerCase();
  const filtered = DATA.managedDevices.filter(d => !query || (d.deviceName || '').toLowerCase().includes(query) || (d.serialNumber || '').toLowerCase().includes(query));
  renderDeviceList(filtered);
}
function renderDeviceList(devices) {
  const mount = el('device-list');
  if (!mount) return;
  if (!devices.length) { mount.innerHTML = `<div class="card-sm" style="margin:12px;">No devices found</div>`; return; }
  mount.innerHTML = devices.slice(0, 100).map(d => `
    <div class="list-row" onclick='selectDevice(${JSON.stringify(d).replace(/'/g, '&#39;')})'>
      <div class="avatar">💻</div>
      <div style="flex:1;min-width:0;">
        <div class="cell-title" style="margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(d.deviceName || 'Unknown')}</div>
        <div class="cell-sub">${esc(d.serialNumber || '')}${d.groupTag ? ` · ${esc(d.groupTag)}` : ''}${d._source === 'autopilot-only' ? ` · <span style="color:var(--amber);">Autopilot only</span>` : ''}</div>
      </div>
      <div class="cell-sub">${esc(d.model || '')}</div>
    </div>`).join('');
}
function selectDevice(d) {
  SIM.deviceName = d.deviceName || '';
  SIM.serial = d.serialNumber || '';
  SIM.mfg = d.manufacturer || '';
  SIM.model = d.model || '';
  SIM.osVer = d.osVersion || '10.0.26100';
  SIM.groupTag = d.groupTag || '';
  SIM.deviceId = d.id || '';
  SIM.azureDeviceId = d.azureADDeviceId || '';
  // Auto-populate primary user if enrolled device has one
  if (d.userPrincipalName && !SIM.upn) SIM.upn = d.userPrincipalName;
  closeModal('device-picker');
  simToUrl();
  renderSimulate(el('content-area'));
}

function openUserPicker() {
  el('user-picker').style.display = 'flex';
  el('user-list').innerHTML = `<div class="card-sm" style="margin:12px;">Type a name and click Search</div>`;
}
async function searchUsers() {
  const q = el('user-search').value.trim();
  const mount = el('user-list');
  mount.innerHTML = `<div class="card-sm" style="margin:12px;display:flex;align-items:center;gap:8px;"><div class="spin"></div> Searching…</div>`;
  try {
    const url = q
      ? `https://graph.microsoft.com/v1.0/users?$search="displayName:${encodeURIComponent(q)}" OR "userPrincipalName:${encodeURIComponent(q)}"&$select=id,displayName,userPrincipalName,department,jobTitle&$top=25`
      : `https://graph.microsoft.com/v1.0/users?$select=id,displayName,userPrincipalName,department,jobTitle&$top=25&$orderby=displayName`;
    const token = await getAccessToken();
    const res = await fetch(url, { headers: { Authorization:`Bearer ${token}`, 'ConsistencyLevel':'eventual' } });
    const data = await res.json();
    const users = data.value || [];
    if (!users.length) { mount.innerHTML = `<div class="card-sm" style="margin:12px;">No users found</div>`; return; }
    mount.innerHTML = users.map(u => `
      <div class="list-row" onclick='selectUser(${JSON.stringify(u).replace(/'/g, '&#39;')})'>
        <div class="avatar">👤</div>
        <div style="flex:1;min-width:0;">
          <div class="cell-title" style="margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(u.displayName || '')}</div>
          <div class="cell-sub" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(u.userPrincipalName || '')}</div>
        </div>
        <div class="cell-sub">${esc(u.department || '')}</div>
      </div>`).join('');
  } catch (e) {
    mount.innerHTML = `<div class="card-sm" style="margin:12px;color:var(--red);">${esc(e.message)}</div>`;
  }
}
function selectUser(u) {
  SIM.upn = u.userPrincipalName || '';
  SIM.dept = u.department || '';
  SIM.jobTitle = u.jobTitle || '';
  SIM.displayName = u.displayName || '';
  SIM.userId = u.id || '';
  closeModal('user-picker');
  simToUrl();
  renderSimulate(el('content-area'));
}

async function runSim() {
  track('simulate-run', 'Simulation executed');
  const tag = SIM.groupTag;

  // Show loading state while we fetch memberOf
  el('sim-out').innerHTML = `<div class="card" style="display:flex;align-items:center;justify-content:center;min-height:200px;gap:12px;color:var(--text3);"><div class="spin"></div><span>Resolving group membership…</span></div>`;

  // ── Fetch actual memberOf from Graph ──
  let deviceGroupIds = new Set();
  let userGroupIds = new Set();
  const memberErrors = [];
  let membershipFromGraph = false;

  if (!demoMode && isAuthed && SIM.azureDeviceId) {
    try {
      const res = await graphGet(`https://graph.microsoft.com/v1.0/devices(deviceId='${SIM.azureDeviceId}')/memberOf?$select=id,displayName`);
      (res || []).forEach(g => { if (g.id) deviceGroupIds.add(g.id); });
      membershipFromGraph = true;
    } catch (e) { memberErrors.push('Device memberOf: ' + e.message); }
  }

  if (!demoMode && isAuthed && SIM.userId) {
    try {
      const res = await graphGet(`https://graph.microsoft.com/v1.0/users/${SIM.userId}/memberOf?$select=id,displayName`);
      (res || []).forEach(g => { if (g.id) userGroupIds.add(g.id); });
      membershipFromGraph = true;
    } catch (e) { memberErrors.push('User memberOf: ' + e.message); }
  }

  // Rule-based eval as fallback (for devices not enrolled / no azureDeviceId)
  const props = buildSimProps(SIM);
  const filterProps = buildFilterProps(SIM);   // assignment filters see Intune device properties

  // Union: actual membership + rule evaluation
  const ruleMatched = DATA.groups.filter(g => isDyn(g) && g.membershipRule && evalRule(g.membershipRule, props));
  const allMatchedIds = new Set([...deviceGroupIds, ...userGroupIds, ...ruleMatched.map(g => g.id)]);
  const mG = DATA.groups.filter(g => allMatchedIds.has(g.id));

  // Helper: does an assignment target hit any of our matched groups OR All Devices / All Users?
  // (User groups contribute only to "allUsers" broad match and explicit group matches)
  const hitsInclude = x => {
    if (x.kind === 'allDevices') return true;
    if (x.kind === 'allUsers') return !!SIM.upn || SIM.userId; // All Users hits if user context given
    if (x.group) return allMatchedIds.has(x.group.id);
    return false;
  };
  const hitsExclude = x => {
    if (x.kind === 'exclude' && x.group) return allMatchedIds.has(x.group.id);
    return false;
  };

  // Per-item match: which include assignment drove it, and which exclude (if any) blocks it.
  // Returns null when no include hits, so the item is skipped entirely.
  const isBroad = x => x.kind === 'allDevices' || x.kind === 'allUsers';
  // First hit wins, but a group beats broad scope (more specific reason)
  const pickVia = list => list.find(x => !isBroad(x)) || list[0] || null;
  function matchItem(item, isApp = false) {
    const asn = resolveAssignmentsRaw(item);
    const hit = asn.filter(x => x.kind !== 'exclude' && hitsInclude(x));
    if (!hit.length) return null;
    // Assignment filters: an include counts only if its filter allows this device. Filtered-out includes are
    // skipped, so another include can still win; if none is allowed, the item is 'depends' or 'filtered'.
    hit.forEach(x => { x.fv = filterVerdict(x.raw.target || x.raw, filterProps); });
    const allowed = hit.filter(x => x.fv.allowed === true), unsure = hit.filter(x => x.fv.allowed === null);
    const incl = allowed.length ? allowed : unsure.length ? unsure : hit;
    const filterStatus = allowed.length ? null : unsure.length ? 'depends' : 'filtered';
    let via = pickVia(incl), status = 'applies', conflictWith = null, partialExcl = [];
    let exclVia = isApp ? null : (asn.find(hitsExclude) || null);
    if (isApp) {
      // Exclusions apply per intent; an exclude without intent applies to all intents
      const excls = asn.filter(hitsExclude);
      const anyIntent = excls.find(x => !x.intent) || null;
      const exclByIntent = {};
      excls.forEach(x => { if (x.intent && !exclByIntent[x.intent]) exclByIntent[x.intent] = x; });
      const dropped = {};
      const live = incl.filter(x => {
        const e = anyIntent || (x.intent && exclByIntent[x.intent]) || null;
        if (e && !dropped[x.intent]) dropped[x.intent] = e;
        return !e;
      });
      if (!live.length) {
        exclVia = dropped.required || dropped.available || dropped.uninstall || Object.values(dropped)[0];
      } else {
        // Only intents whose exclusion actually dropped an include
        partialExcl = Object.entries(dropped).map(([intent, e]) => ({ intent, label: e.label }));
        // App intent resolution: required > available+uninstall (conflict) > uninstall > available
        via = pickVia(live);
        const ofIntent = i => pickVia(live.filter(x => x.intent === i));
        const req = ofIntent('required'), avail = ofIntent('available'), uninst = ofIntent('uninstall');
        if (req) via = req;
        else if (avail && uninst) { via = avail; conflictWith = uninst; status = 'conflict'; }
        else if (uninst) { via = uninst; status = 'uninstall'; }
        else if (avail) via = avail;
      }
    }
    const fv = via.fv;
    return {
      item,
      status: exclVia ? 'excluded' : filterStatus || status,   // exclusion wins over everything
      via, exclVia, conflictWith, partialExcl,
      scope: isBroad(via) ? 'Broad' : 'Targeted',
      filterId: fv.id || null,
      filterType: fv.id ? fv.type : null,
      filterName: fv.filter ? fv.filter.displayName : null,
      filterRule: fv.filter ? fv.filter.rule : null,
      filterMatches: fv.id ? fv.matches : null,
      filterAllowed: fv.allowed,
      filterReason: fv.reason || '',
      filterAmbiguous: !!fv.ambiguous,
      intent: via.intent,
    };
  }
  const matchAll = list => list.map(x => matchItem(x)).filter(Boolean);
  const applies = m => m.status === 'applies';
  const profM = matchAll(DATA.autopilotProfiles);
  const espM  = matchAll(DATA.enrollmentStatusPages);
  const polM  = matchAll(allPolicies());
  const appM  = DATA.apps.map(a => matchItem(a, true)).filter(Boolean);

  const mP = profM.filter(applies).map(m => m.item);
  const mE = espM.filter(applies).map(m => m.item);
  const mPol = polM.filter(applies).map(m => m.item);
  const mA = appM.filter(applies).map(m => m.item);

  const byType = {};
  mPol.forEach(p => { if (!byType[p._t]) byType[p._t] = []; byType[p._t].push(p); });

  // Filter + scope info per applied item, taken from its match (no index lookup)
  function describeApplied(m) {
    return { scope: m.scope, filterId: m.filterId, filterType: m.filterType, filterName: m.filterName, filterAllowed: m.filterAllowed };
  }

  // Enrich matched items with their filter + scope info
  const mPolEnriched = polM.filter(applies).map(m => ({ ...m.item, ...describeApplied(m) }));
  const mAEnriched = appM.filter(applies).map(m => ({ ...m.item, ...describeApplied(m) }));

  const NW = 170, NH = 42, PX = 70, PY = 10;
  const col0 = 20;
  const col1 = col0 + NW + PX;  // AP Profile / ESP
  const col2 = col1 + NW + PX;  // Groups
  const col3 = col2 + NW + PX;  // Configs & Apps
  const col4 = col3 + NW + PX;  // Filters
  const col5 = col4 + 130 + PX; // Scope
  const FW = 130, SW = 100;     // filter + scope column widths
  const svgW = col5 + SW + 20;

  const allOut = [...mPolEnriched, ...mAEnriched];
  // For each AP Profile / ESP, find which matched group OR broad scope drives its assignment
  function linkedScopeForItem(item) {
    const resolved = resolveAssignments(item);
    for (const r of resolved) {
      if (r.kind === 'exclude') continue;
      if (r.kind === 'allDevices') return { type: 'broad', label: 'All Devices' };
      if (r.kind === 'allUsers')   return { type: 'broad', label: 'All Users' };
      if (r.group && mG.some(g => g.id === r.group.id)) return { type: 'group', group: r.group };
    }
    return null;
  }

  const midNodes = [
    ...mP.map(p => {
      const link = linkedScopeForItem(p);
      // Sub stays as deploymentMode — broad scope is now shown in its own pseudo-group node
      return { label:p.displayName, sub: p.deploymentMode || '', stroke:'#2a5d8a', fill:'rgba(42,93,138,.07)', kind:'profile', linkedScope: link };
    }),
    ...mE.map(e => {
      const link = linkedScopeForItem(e);
      return { label:e.displayName, sub: 'ESP', stroke:'#8a5f0c', fill:'rgba(138,95,12,.07)', kind:'esp', linkedScope: link };
    }),
  ];

  // Detect which broad-scope pseudo-groups are needed (only render if at least one item targets them)
  const needAllDevices = [...midNodes, ...allOut].some(it => {
    const link = it.linkedScope ?? linkedScopeForItem(it);
    return link?.type === 'broad' && link.label === 'All Devices';
  });
  const needAllUsers = [...midNodes, ...allOut].some(it => {
    const link = it.linkedScope ?? linkedScopeForItem(it);
    return link?.type === 'broad' && link.label === 'All Users';
  });

  // Build the full ordered list of group-column nodes: broad scopes first (highlighted), then real groups
  const groupColumnNodes = [
    ...(needAllDevices ? [{ id: '__allDevices__', displayName: 'All Devices', kind: 'broad', stroke: '#8a5f0c', fill: 'rgba(138,95,12,.10)' }] : []),
    ...(needAllUsers ? [{ id: '__allUsers__', displayName: 'All Users', kind: 'broad', stroke: '#8a5f0c', fill: 'rgba(138,95,12,.10)' }] : []),
    ...mG.map(g => ({ id: g.id, displayName: g.displayName, kind: 'group', stroke: '#5e4a8a', fill: 'rgba(94,74,138,.07)', isDynamic: isDyn(g) })),
  ];

  const rows = Math.max(groupColumnNodes.length, midNodes.length, allOut.length, 1);
  const svgH = rows * (NH + PY) + 86;
  const sY = i => 54 + i * (NH + PY);

  function curve(x1, y1, x2, y2, col, dash='', width=1.4, opacity=0.55) {
    const mx = (x1 + x2) / 2;
    return `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${col}" stroke-width="${width}" opacity="${opacity}" ${dash}/>`;
  }
  function node(x, y, w, label, sub, fill, stroke) {
    const maxChars = Math.floor(w / 9);
    const l = String(label || '').length > maxChars ? String(label).slice(0, maxChars - 1) + '…' : String(label || '');
    const s = sub && String(sub).length > maxChars + 2 ? String(sub).slice(0, maxChars + 1) + '…' : String(sub || '');
    return `<rect x="${x}" y="${y}" width="${w}" height="${NH}" rx="6" fill="${fill}" stroke="${stroke}" stroke-width="1.2"/><text x="${x+12}" y="${y+(s ? 17 : 26)}" font-size="11" font-weight="500" fill="${stroke}" style="font-family:var(--font-sans)">${esc(l)}</text>${s ? `<text x="${x+12}" y="${y+31}" font-size="9" fill="${stroke}" opacity=".7" style="font-family:var(--font-sans)">${esc(s)}</text>` : ''}`;
  }
  // Small text label near the SOURCE end of a curve — shows group name between AP Profile and Group
  // posPct = where along the curve (0..1), yOffset = vertical pixel offset to break ties
  function edgeLabel(x1, y1, x2, y2, text, color, posPct = 0.3, yOffset = 0) {
    const t = String(text || '');
    const short = t.length > 16 ? t.slice(0, 15) + '…' : t;
    const w = short.length * 6 + 20;
    const lx = x1 + (x2 - x1) * posPct;
    const ly = y1 + (y2 - y1) * posPct + yOffset;
    return `<g><rect x="${lx - w/2}" y="${ly - 9}" width="${w}" height="18" rx="4" fill="var(--bg2)" stroke="${color}" stroke-width="1" opacity=".98"/><text x="${lx}" y="${ly + 4}" font-size="9.5" font-weight="500" fill="${color}" text-anchor="middle" style="font-family:var(--font-sans)">via ${esc(short)}</text></g>`;
  }

  // Color based on item type (per your existing per-subcategory palette)
  function colorFor(p) {
    if (p._t === 'Compliance') return '#8a5f0c';
    if (p._t === 'EP Security') return '#a33a32';
    if (p._t === 'App Protection') return '#5e4a8a';
    if (p._t === 'Script' || p._t === 'Remediation') return '#2a5d8a';   // = --blue (hex: the SVG appends alpha)
    if (/ Update$/.test(p._t || '')) return '#5e4a8a';                     // = --purple
    if (p._t) return '#2e7550';          // other policy types
    return '#2a5d8a';                     // apps (have no _t)
  }

  const deviceY = sY(Math.max(0, (mG.length - 1) / 2));
  let svgNodes = '', svgEdges = '', svgLabels = '';

  // Column 0: Device
  svgNodes += node(col0, deviceY, NW, SIM.model || 'Device', tag || 'No group tag', 'rgba(35,34,31,.03)', '#23221f');

  // Column 1: AP Profile / ESP — remember Y positions for linking to groups
  const midNodeYs = [];
  midNodes.forEach((n, i) => {
    const ny = sY(i);
    midNodeYs.push({ y: ny, linkedScope: n.linkedScope, stroke: n.stroke });
    svgEdges += curve(col0 + NW, deviceY + NH / 2, col1, ny + NH / 2, n.stroke);
    svgNodes += node(col1, ny, NW, n.label, n.sub, n.fill, n.stroke);
  });

  // Column 2: Groups — render broad pseudo-groups + real groups, remember Y for linking
  const groupYs = {};
  groupColumnNodes.forEach((g, i) => {
    const gy = sY(i);
    groupYs[g.id] = gy;
    const sub = g.kind === 'broad' ? 'Broad scope' : (g.isDynamic ? 'Dynamic group' : 'Static group');
    svgNodes += node(col2, gy, NW, g.displayName, sub, g.fill, g.stroke);
  });

  // Helper: map a linkedScope object to a Y-position in the Groups column
  function groupColumnYFor(link) {
    if (!link) return null;
    if (link.type === 'broad') {
      const id = link.label === 'All Devices' ? '__allDevices__' : '__allUsers__';
      return groupYs[id] !== undefined ? groupYs[id] : null;
    }
    if (link.type === 'group') {
      return groupYs[link.group.id] !== undefined ? groupYs[link.group.id] : null;
    }
    return null;
  }

  // Thick, solid "via" edges from AP Profile → linked Group/scope (visual continuity)
  midNodeYs.forEach(({ y, linkedScope, stroke }, idx) => {
    if (!linkedScope) return;
    const gy = groupColumnYFor(linkedScope);
    if (gy === null) return;
    const label = linkedScope.type === 'broad' ? linkedScope.label : linkedScope.group.displayName;
    // Thick solid edge with the profile's color, linking AP Profile to its driving source
    svgEdges += curve(col1 + NW, y + NH / 2, col2, gy + NH / 2, stroke, '', 2.2, 0.75);
    // Stagger labels: alternate horizontal position AND vertical offset so they never overlap
    const posPct = 0.30 + (idx % 3) * 0.16;       // 0.30, 0.46, 0.62
    const yOffset = (idx % 2 === 0 ? -1 : 1) * 12; // -12px, +12px alternating
    svgLabels += edgeLabel(col1 + NW, y + NH / 2, col2, gy + NH / 2, label, stroke, posPct, yOffset);
  });

  // Column 3-5: Configs/Apps → Filter → Scope (per row)
  // Each row's edge starts from its actual driving source in the Groups column
  allOut.forEach((p, i) => {
    const py = sY(i);
    const stroke = colorFor(p);
    const fill = stroke + '14';

    // Find which matched group OR broad scope drives this item's assignment
    const link = linkedScopeForItem(p);
    const gy = groupColumnYFor(link);

    let srcX, srcY;
    if (gy !== null) {
      // Edge starts from the appropriate node in Groups column (real group or pseudo "All …")
      srcX = col2 + NW;
      srcY = gy + NH / 2;
    } else {
      // No source resolved — fall back to device
      srcX = col0 + NW;
      srcY = deviceY + NH / 2;
    }

    // Edge from source → Config/App
    svgEdges += curve(srcX, srcY, col3, py + NH / 2, stroke, 'stroke-dasharray="5 4"');

    svgNodes += node(col3, py, NW, p.name || p.displayName || '', p._t || 'App', fill, stroke);

    // Filter node (if any)
    // green = filter allows the device, gray = filtered out, amber = can't evaluate (hex: the SVG appends alpha)
    const filterStroke = p.filterAllowed === true ? '#2e7550' : p.filterAllowed === false ? '#66635c' : '#8a5f0c';
    const filterFill = filterStroke + '14';
    if (p.filterId) {
      svgEdges += curve(col3 + NW, py + NH / 2, col4, py + NH / 2, filterStroke);
      svgNodes += node(col4, py, FW, p.filterName || p.filterId.slice(0, 8) + '…', `${p.filterType || 'filter'}${p.filterName ? '' : ' · not found'}`, filterFill, filterStroke);
    } else {
      // Dim placeholder for "no filter"
      svgNodes += `<rect x="${col4}" y="${py}" width="${FW}" height="${NH}" rx="6" fill="none" stroke="rgba(35,34,31,.15)" stroke-width="1" stroke-dasharray="3 3"/><text x="${col4+12}" y="${py+26}" font-size="11" fill="var(--text3)" style="font-family:var(--font-sans)" opacity=".5">No filter</text>`;
      svgEdges += curve(col3 + NW, py + NH / 2, col4, py + NH / 2, '#23221f', 'stroke-dasharray="2 4"', 1, 0.2);
    }

    // Scope node
    const scopeStroke = p.scope === 'Broad' ? '#8a5f0c' : p.scope === 'Targeted' ? '#2e7550' : '#a33a32';
    const scopeFill = scopeStroke + '20';
    svgEdges += curve(col4 + FW, py + NH / 2, col5, py + NH / 2, scopeStroke);
    svgNodes += node(col5, py, SW, p.scope, '', scopeFill, scopeStroke);
  });

  const hdr = (x, label, col) => `<text x="${x}" y="34" font-size="10" font-weight="500" fill="${col}" opacity=".8" style="font-family:var(--font-sans)" letter-spacing="1">${label}</text>`;
  // Order: edges first (background), then labels over edges, then nodes on top
  const svg = `<svg width="${svgW}" height="${svgH}" style="min-width:${svgW}px;">${hdr(col0,'DEVICE','#23221f')}${hdr(col1,'AP PROFILE / ESP','#2a5d8a')}${hdr(col2,'GROUPS','#5e4a8a')}${hdr(col3,'CONFIGS & APPS','#2e7550')}${hdr(col4,'FILTERS','#8a5f0c')}${hdr(col5,'SCOPE','#23221f')}${svgEdges}${svgLabels}${svgNodes}</svg>`;

  // Info banner showing where group membership came from
  const actualCount = deviceGroupIds.size + userGroupIds.size;
  const infoBanner = `
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;">
      ${!demoMode && SIM.azureDeviceId ? `<span class="tag tag-targeted tag-plain">Device memberships: ${deviceGroupIds.size}</span>` : `<span class="tag tag-gray tag-plain">Device: no Entra ID (using rules)</span>`}
      ${!demoMode && SIM.userId ? `<span class="tag tag-targeted tag-plain">User memberships: ${userGroupIds.size}</span>` : `<span class="tag tag-gray tag-plain">User: not selected</span>`}
      ${ruleMatched.length ? `<span class="tag tag-purple tag-plain">Rule-matched: ${ruleMatched.length}</span>` : ''}
      ${memberErrors.length ? `<span class="tag tag-unassigned tag-plain">${esc(memberErrors[0])}</span>` : ''}
    </div>`;

  // ── Trace view: one row per matched item, with the reason it applies ──
  const attr = s => esc(s).replace(/"/g, '&quot;');
  const viaLabel = x => x.kind === 'allDevices' ? 'All devices' : x.kind === 'allUsers' ? 'All users' : x.label;
  function trRow(name, sub, m) {
    const ex = m.status === 'excluded';
    const [pc, pl] = ex ? ['red', 'Excluded']
                   : m.status === 'uninstall' ? ['red', 'Uninstall']
                   : m.status === 'conflict' ? ['amber', 'Conflict']
                   : m.status === 'filtered' ? ['gray', 'Filtered']
                   : m.status === 'depends' ? ['amber', 'Depends on filter']
                   : m.scope === 'Broad' ? ['amber', 'Broad'] : ['green', 'Targeted'];
    let s = sub || '';
    (m.partialExcl || []).forEach(p => { s += ` · excluded from ${p.intent} via ${p.label}`; });
    const parts = [s.replace(/^ · /, '') && esc(s.replace(/^ · /, '')), filterHtml(m)].filter(Boolean);
    const subHtml = ex
      ? `<div class="tr-sub tr-sub-red">Excluded via ${esc(m.exclVia.label)}</div>`
      : m.status === 'conflict' ? `<div class="tr-sub">Available + Uninstall — result depends on user vs device targeting</div>`
      : parts.length ? `<div class="tr-sub">${parts.join(' · ')}</div>` : '';
    return `<div class="tr-row${ex ? ' tr-excluded' : ''}">
      <div class="tr-main"><div class="tr-name" title="${attr(name)}">${esc(name)}</div>${subHtml}</div>
      <div class="tr-pill-col"><span class="tr-pill tr-pill-${pc}">${pl}</span></div>
      <div class="tr-via ${isBroad(m.via) ? 'tr-via-broad' : 'tr-via-group'}">via ${esc(viaLabel(m.via))}</div>
    </div>`;
  }
  function trSection(title, color, count, body) {
    return `<div class="card tr-section">
      <div class="tr-head"><span class="tr-sq" style="background:${color};"></span><span class="tr-title">${esc(title)}</span><span class="tr-count">${count}</span></div>
      ${body}
    </div>`;
  }

  const groupRows = mG.map(g => {
    const source = deviceGroupIds.has(g.id) ? 'Device membership'
                 : userGroupIds.has(g.id) ? 'User membership'
                 : 'Rule match';
    const sourceColor = source === 'Rule match' ? 'var(--purple)' : 'var(--green)';
    const rule = isDyn(g) && g.membershipRule;
    const sub = rule
      ? `<div class="tr-sub tr-mono" title="${attr(rule)}">${esc(rule)}</div>`
      : `<div class="tr-sub">${isDyn(g) ? 'Dynamic group' : 'Static group'}</div>`;
    return `<div class="tr-row">
      <div class="tr-main"><div class="tr-name" title="${attr(g.displayName)}">${esc(g.displayName)}</div>${sub}</div>
      <div class="tr-pill-col"></div>
      <div class="tr-via" style="color:${sourceColor};">${source}</div>
    </div>`;
  }).join('');

  // Filtered / depends rows go after the applying rows of their section (stable sort)
  const later = m => m.status === 'filtered' || m.status === 'depends' ? 1 : 0;
  const ordered = list => [...list].sort((a, b) => later(a) - later(b));
  const enrollRows = [
    ...ordered(profM).map(m => trRow(m.item.displayName, (m.item.deploymentMode || '') + (m.item.preprovisioningAllowed ? ' · pre-provisioning' : ''), m)),
    ...ordered(espM).map(m => trRow(m.item.displayName, 'Enrollment Status Page', m)),
  ];

  const polByType = {};
  ordered(polM).forEach(m => { (polByType[m.item._t] = polByType[m.item._t] || []).push(m); });
  const configBody = Object.entries(polByType).map(([t, ms]) =>
    `<div class="tr-subhead">${esc(t)} (${ms.length})</div>${ms.map(m => trRow(m.item.name || m.item.displayName || '', '', m)).join('')}`
  ).join('');

  const appRows = ordered(appM).map(m => {
    const type = (m.item['@odata.type'] || '').replace('#microsoft.graph.', '');
    return trRow(m.item.displayName, [type, m.intent].filter(Boolean).join(' · '), m);
  });

  const nBroad = [...polM, ...appM].filter(m => applies(m) && m.scope === 'Broad').length;
  const nConflict = appM.filter(m => m.status === 'conflict').length;
  const nBlocked = [...polM, ...appM].filter(m => m.status === 'excluded' || m.status === 'uninstall').length;
  const trStat = (n, label, color, hint = '') => `<div class="tr-stat"><div class="tr-stat-n" style="color:${color};">${n}</div><div class="tr-stat-l">${label}</div>${hint ? `<div class="tr-stat-hint">${hint}</div>` : ''}</div>`;
  const dependsHint = list => { const d = list.filter(m => m.status === 'depends').length; return d ? `+${d} depends on filter` : ''; };   // not added to the number

  const traceHtml = `
    <div class="tr-stats">
      ${trStat(mPol.length, 'Policies apply', 'var(--accent)', dependsHint(polM))}
      ${trStat(mA.length, 'Apps targeted', 'var(--accent)', dependsHint(appM))}
      ${trStat(nBroad, 'Via broad scope', 'var(--amber)')}
      ${trStat(nBlocked, 'Excluded', 'var(--red)')}
    </div>
    ${trSection('Groups this device is in', 'var(--purple)', mG.length,
      groupRows || `<div class="tr-empty empty-note">No matching groups found.${SIM.azureDeviceId || SIM.userId ? '' : ' Select a device or user to resolve actual membership.'}</div>`)}
    ${enrollRows.length ? trSection('Enrollment', 'var(--blue)', enrollRows.length, enrollRows.join('')) : ''}
    ${polM.length ? trSection('Configuration, compliance and scripts', 'var(--accent)', polM.length, configBody) : ''}
    ${appRows.length ? trSection('Apps', 'var(--accent)', appRows.length + (nConflict ? ` · ${nConflict} conflict${nConflict > 1 ? 's' : ''}` : ''), appRows.join('')) : ''}`;

  const graphHtml = `
      <div class="card" style="overflow-x:auto;">${svg}</div>
      <div class="card">
        <div class="panel-head"><div class="panel-title"><div class="eyebrow">Groups</div><div class="title">Matched Groups (${mG.length})</div></div></div>
        ${mG.length ? mG.map(g => {
          const source = deviceGroupIds.has(g.id) ? 'Device membership'
                       : userGroupIds.has(g.id) ? 'User membership'
                       : 'Rule match';
          const sourceColor = source === 'Rule match' ? 'var(--purple)' : 'var(--green)';
          return `<div class="card-sm" style="margin-bottom:10px;"><div class="title-row"><div class="title-block"><div class="title">${esc(g.displayName)}</div><div class="desc" style="color:${sourceColor};">${source}${isDyn(g) ? ' · Dynamic group' : ' · Static group'}</div></div></div>${g.membershipRule ? `<div class="mono">${esc(g.membershipRule)}</div>` : ''}</div>`;
        }).join('') : `<div class="empty-note">No matching groups found.${SIM.azureDeviceId || SIM.userId ? '' : ' Select a device or user to resolve actual membership.'}</div>`}
      </div>
      <div class="card">
        <div class="panel-head"><div class="panel-title"><div class="eyebrow">Policies</div><div class="title">Applied Policies (${mPol.length})</div></div></div>
        ${Object.entries(byType).length ? Object.entries(byType).map(([t, pols]) => `<div style="margin-bottom:12px;"><div class="eyebrow">${esc(t)} (${pols.length})</div><div class="meta-row" style="margin-top:8px;">${pols.map(p => `<span class="tag tag-plain">${esc(p.name || p.displayName || '')}</span>`).join('')}</div></div>`).join('') : `<div class="empty-note">No policies apply.</div>`}
      </div>
      <div class="card">
        <div class="panel-head"><div class="panel-title"><div class="eyebrow">Apps</div><div class="title">Targeted Apps (${mA.length})</div></div></div>
        ${mA.length ? `<div class="meta-row" style="margin-top:0;">${mA.map(a => `<span class="tag tag-plain">${esc(a.displayName)}</span>`).join('')}</div>` : `<div class="empty-note">No apps targeted.</div>`}
      </div>`;

  // Raw results for export — reuses the match objects above, tagged with a display type
  profM.forEach(m => { m.type = 'Autopilot profile'; });
  espM.forEach(m => { m.type = 'Enrollment Status Page'; });
  polM.forEach(m => { m.type = m.item._t; });
  appM.forEach(m => { m.type = (m.item['@odata.type'] || '').replace('#microsoft.graph.', '') || 'App'; });
  const model = {
    sim: { ...SIM },
    env: { tenant: TENANT_NAME, demo: demoMode, generatedBy: currentAccount?.username || '' },
    groups: mG.map(g => ({ group: g, source: deviceGroupIds.has(g.id) ? 'Device membership' : userGroupIds.has(g.id) ? 'User membership' : 'Rule match' })),
    enrollment: [...profM, ...espM],
    policies: polM,
    apps: appM,
    counts: { policies: mPol.length, apps: mA.length, broad: nBroad, excluded: nBlocked, conflicts: nConflict },
    membershipMode: membershipFromGraph ? 'actual' : 'rules-only',
  };

  LAST_SIM = { traceHtml, graphHtml, model };
  el('sim-out').innerHTML = `
    <div class="fade" style="display:flex;flex-direction:column;gap:14px;">
      ${infoBanner}
      <div class="tr-toolbar">
        <div class="tr-seg" role="group" aria-label="Simulation view">
          <button type="button" data-sim-view="trace" onclick="setSimView('trace')">Trace</button>
          <button type="button" data-sim-view="graph" onclick="setSimView('graph')">Graph</button>
        </div>
      </div>
      <div id="sim-view" style="display:flex;flex-direction:column;gap:14px;"></div>
    </div>`;
  renderSimView();
  const exportRow = el('sim-export');
  if (exportRow) exportRow.innerHTML = exportButtonsHtml();
}

// Export buttons for the sim form: disabled until a simulation has produced a model
function exportButtonsHtml() {
  const ready = !!LAST_SIM?.model;
  const tip = ready ? 'Contains tenant configuration data. Generated locally, nothing is uploaded.' : 'Run a simulation first';
  const attrs = ready ? '' : ' disabled aria-disabled="true"';
  return `<button type="button" class="btn btn-ghost sim-export-btn" style="flex:1;" onclick="exportSimMarkdown()" title="${tip}"${attrs}>Export .md</button>
    <button type="button" class="btn btn-ghost sim-export-btn" style="flex:1;" onclick="exportSimPdf()" title="${tip}"${attrs}>Export PDF</button>
    <button type="button" class="btn btn-ghost sim-export-btn" style="flex:1;" onclick="copySimMarkdown()" title="${tip}"${attrs}>Copy Markdown</button>`;
}

// Swap Trace ↔ Graph from the cached render — no Graph calls, no re-run
function renderSimView() {
  const host = el('sim-view');
  if (!host || !LAST_SIM) return;
  host.innerHTML = simView === 'graph' ? LAST_SIM.graphHtml : LAST_SIM.traceHtml;
  document.querySelectorAll('[data-sim-view]').forEach(b => {
    const on = b.dataset.simView === simView;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on);
  });
}

function setSimView(view) {
  simView = view === 'graph' ? 'graph' : 'trace';
  track('sim-view-' + simView, 'Simulation view: ' + simView);
  renderSimView();
  simToUrl();
}

// ── Report export: Markdown + Mermaid, generated locally (no DOM in the builders, no network) ──
const ciCmp = (a, b) => { const x = String(a || '').toLowerCase(), y = String(b || '').toLowerCase(); return x < y ? -1 : x > y ? 1 : 0; };
const byTypeName = (a, b) => ciCmp(a.type, b.type) || ciCmp(a.name, b.name);
const viaText = x => !x ? '' : x.kind === 'allDevices' ? 'All devices' : x.kind === 'allUsers' ? 'All users' : x.label;
const matchName = m => m.item.name || m.item.displayName || '';

function reportRow(m) {
  const notes = [];
  if (m.status === 'excluded') notes.push(`Excluded via ${m.exclVia.label}`);
  if (m.status === 'conflict') notes.push(`Available + Uninstall (uninstall via ${viaText(m.conflictWith)})`);
  if (m.intent) notes.push(`intent: ${m.intent}`);
  if (m.item.deploymentMode) notes.push(m.item.deploymentMode + (m.item.preprovisioningAllowed ? ', pre-provisioning' : ''));
  if (m.filterId) notes.push(filterText(m));
  (m.partialExcl || []).forEach(p => notes.push(`excluded from ${p.intent} via ${p.label}`));
  return {
    name: matchName(m),
    type: m.type || '',
    scope: m.status === 'excluded' ? 'Excluded' : m.status === 'uninstall' ? 'Uninstall' : m.status === 'conflict' ? 'Conflict'
      : m.status === 'filtered' ? 'Filtered' : m.status === 'depends' ? 'Depends on filter' : m.scope,
    status: m.status,
    via: viaText(m.via),
    viaKind: m.via.kind === 'allDevices' || m.via.kind === 'allUsers' ? 'broad' : 'group',
    exclVia: m.exclVia ? m.exclVia.label : null,
    note: notes.join('; '),
  };
}

function buildReport(model, now = new Date()) {
  const s = model.sim, env = model.env || {}, c = model.counts;
  const device = {
    name: s.deviceName || s.serial || s.model || 'device', serial: s.serial || '', groupTag: s.groupTag || '',
    manufacturer: s.mfg || '', model: s.model || '', osVersion: s.osVer || '', primaryUser: s.upn || '',
  };
  const meta = {
    title: `Simulation report — ${device.name}`, tenant: env.tenant || '', generatedAt: now.toISOString(),
    generatedBy: env.generatedBy || '', source: env.demo ? 'Demo data' : 'Live · Graph', appVersion: APP_VERSION,
  };
  const kpis = [
    { label: 'policies apply', value: c.policies, tone: 'accent' },
    { label: 'apps', value: c.apps, tone: 'accent' },
    { label: 'via broad scope', value: c.broad, tone: 'amber' },
    { label: 'excluded', value: c.excluded, tone: 'red' },
  ];

  const sortM = list => [...list].sort((a, b) => ciCmp(matchName(a), matchName(b)));
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const pa = [...model.policies, ...model.apps];
  const findings = [];
  const excl = sortM(pa.filter(m => m.status === 'excluded'));
  if (excl.length > 3) {
    findings.push({ severity: 'red', title: `${excl.length} policies and apps excluded`, detail: excl.map(m => `${matchName(m)} (via ${m.exclVia.label})`).join('; ') });
  } else {
    excl.forEach(m => findings.push({ severity: 'red', title: `${matchName(m)} excluded via ${m.exclVia.label}`, detail: `${m.type}. Would otherwise apply via ${viaText(m.via)}.` }));
  }
  sortM(model.apps.filter(m => m.status === 'conflict')).forEach(m => findings.push({
    severity: 'red', title: `Intent conflict: ${matchName(m)}`,
    detail: `Available via ${viaText(m.via)} + Uninstall via ${viaText(m.conflictWith)}. Result depends on user vs device targeting.`,
  }));
  const profiles = sortM(model.enrollment.filter(m => m.type === 'Autopilot profile' && m.status === 'applies'));
  if (!profiles.length) findings.push({ severity: 'red', title: 'No Autopilot profile matched', detail: 'This device would not receive an Autopilot deployment profile.' });
  if (profiles.length > 1) findings.push({ severity: 'amber', title: `${profiles.length} Autopilot profiles matched: ${profiles.map(matchName).join(', ')}`, detail: 'Intune uses the oldest assignment. Verify which one wins.' });
  const broad = sortM(pa.filter(m => m.status === 'applies' && m.scope === 'Broad' && !m.filterId));
  if (broad.length) findings.push({
    severity: 'amber', title: `${plural(broad.length, 'assignment', 'assignments')} via All devices / All users without a filter`,
    detail: broad.slice(0, 5).map(matchName).join(', ') + (broad.length > 5 ? `, and ${broad.length - 5} more` : '') + '.',
  });
  const depends = sortM([...model.enrollment, ...pa].filter(m => m.status === 'depends'));
  if (depends.length) findings.push({ severity: 'info', title: `${plural(depends.length, 'item depends', 'items depend')} on filters that can't be evaluated`,
    detail: depends.map(m => `${matchName(m)} (${m.filterName || m.filterId?.slice(0, 8) + '…'})`).join(', ') + '.' });
  if (model.membershipMode === 'rules-only') findings.push({ severity: 'info', title: 'Rules-only membership', detail: 'Group membership predicted from dynamic rules. Select an enrolled device for actual membership.' });
  if (profiles.length === 1) findings.push({ severity: 'info', title: 'Autopilot profile resolved', detail: `${matchName(profiles[0])} (${profiles[0].item.deploymentMode || 'unknown mode'})` });

  const rowsOf = list => list.map(reportRow).sort(byTypeName);
  const groupRows = model.groups.map(({ group, source }) => ({
    name: group.displayName || group.id, type: isDyn(group) ? 'Dynamic' : 'Static', scope: '', status: 'member',
    via: source, viaKind: 'group', exclVia: null, note: group.membershipRule || '',
  })).sort(byTypeName);
  const sections = [
    { id: 'groups', title: 'Groups this device is in', rows: groupRows },
    { id: 'enrollment', title: 'Enrollment', rows: rowsOf(model.enrollment) },
    { id: 'configuration', title: 'Configuration, compliance and scripts', rows: rowsOf(model.policies) },
    { id: 'apps', title: 'Apps', rows: rowsOf(model.apps) },
  ].map(sec => ({ ...sec, count: sec.rows.length }));

  return { meta, device, kpis, findings, sections };
}

const mdCell = s => String(s ?? '').replace(/\r\n|\r|\n/g, ' ').replace(/\|/g, '\\|').trim();
const mdCode = s => { const t = mdCell(s); return !t ? '' : t.includes('`') ? '`` ' + t + ' ``' : '`' + t + '`'; };
const FINDING_ICON = { red: '🔴', amber: '🟠', info: 'ℹ️' };
// UTC ISO → local "YYYY-MM-DD HH:mm (UTC±hh:mm)" for display
function localStamp(iso) {
  const d = new Date(iso), p = v => String(v).padStart(2, '0');
  const off = -d.getTimezoneOffset(), a = Math.abs(off);
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())} (UTC${off < 0 ? '-' : '+'}${p(Math.floor(a / 60))}:${p(a % 60)})`;
}

function toMarkdown(r) {
  const L = [];
  L.push(`# Simulation report — ${mdCell(r.device.name)}`, '');
  L.push('| Tenant | Generated | Group tag | Primary user | Source |', '|---|---|---|---|---|');
  L.push('| ' + [r.meta.tenant, localStamp(r.meta.generatedAt), r.device.groupTag, r.device.primaryUser, r.meta.source].map(v => mdCell(v) || '—').join(' | ') + ' |', '');
  L.push(r.kpis.map(k => `**${k.value}** ${k.label}`).join(' · '), '');
  L.push('## Findings', '');
  if (r.findings.length) r.findings.forEach(f => L.push(`- ${FINDING_ICON[f.severity]} **${mdCell(f.title)}** — ${mdCell(f.detail)}`));
  else L.push('_No findings._');
  L.push('', '## Assignment flow', '', '```mermaid', toMermaid(r), '```', '');
  r.sections.filter(sec => sec.rows.length).forEach(sec => {
    L.push(`## ${mdCell(sec.title)} (${sec.count})`, '');
    if (sec.id === 'groups') {
      L.push('| Group | Type | Source | Rule |', '|---|---|---|---|');
      sec.rows.forEach(g => L.push(`| ${mdCell(g.name)} | ${mdCell(g.type)} | ${mdCell(g.via)} | ${mdCode(g.note)} |`));
    } else {
      L.push('| Name | Type | Scope | Via | Note |', '|---|---|---|---|---|');
      sec.rows.forEach(x => {
        const ex = x.status === 'excluded';
        L.push(`| ${ex ? `~~${mdCell(x.name)}~~` : mdCell(x.name)} | ${mdCell(x.type)} | ${ex ? '**Excluded**' : mdCell(x.scope)} | ${mdCell(x.via)} | ${mdCell(x.note)} |`);
      });
    }
    L.push('');
  });
  L.push(`_Generated locally by Autopilotlens ${r.meta.appVersion}. Contains tenant configuration data._`, '');
  return L.join('\n');
}

function toMermaid(r) {
  const MAX_NODES = 50, PER_GROUP = 6;
  const label = s => {
    let t = String(s ?? '').replace(/\s+/g, ' ').trim();
    if (t.length > 40) t = t.slice(0, 39) + '…';
    return '"' + t.replace(/"/g, '#quot;') + '"';
  };
  const groups = r.sections.find(sec => sec.id === 'groups').rows;
  const cats = r.sections.filter(sec => sec.id !== 'groups' && sec.rows.length);

  // Shrink items per subgraph until the whole chart fits under the node cap
  const broadUsed = rows => ['All devices', 'All users'].filter(b => rows.some(x => x.viaKind === 'broad' && x.via === b && x.status !== 'excluded'));
  const shownFor = k => cats.map(sec => sec.rows.slice(0, k));
  const total = k => {
    const shown = shownFor(k);
    return 1 + groups.length + broadUsed(shown.flat()).length
      + cats.reduce((n, sec, i) => n + shown[i].length + (sec.rows.length > k ? 1 : 0), 0);
  };
  let k = PER_GROUP;
  while (k > 0 && total(k) > MAX_NODES) k--;
  const shown = shownFor(k);

  const L = ['flowchart LR'];
  const cls = { group: [], broad: [], ok: [], excl: [] };
  L.push(`  d0[${label(r.device.name)}]`);
  const gid = new Map();
  groups.forEach((g, i) => {
    if (!gid.has(g.name)) gid.set(g.name, 'g' + i);
    L.push(`  g${i}[${label(g.name)}]`);
    cls.group.push('g' + i);
  });
  const bid = new Map();
  broadUsed(shown.flat()).forEach((b, i) => {
    bid.set(b, 'b' + i);
    L.push(`  b${i}([${label(b)}])`);
    cls.broad.push('b' + i);
  });

  const edges = [];
  groups.forEach((g, i) => edges.push(`  d0 --> g${i}`));
  bid.forEach(id => edges.push(`  d0 --> ${id}`));
  let n = 0, more = 0;
  cats.forEach((sec, si) => {
    L.push(`  subgraph s${si}[${label(sec.title)}]`);
    shown[si].forEach(x => {
      const id = 'i' + n++;
      L.push(`    ${id}[${label(x.name)}]`);
      if (x.status === 'excluded') {
        edges.push(`  ${gid.get(x.exclVia) || 'd0'} -.->|excluded| ${id}`);
        cls.excl.push(id);
      } else {
        edges.push(`  ${(x.viaKind === 'broad' ? bid.get(x.via) : gid.get(x.via)) || 'd0'} --> ${id}`);
        if (x.status !== 'filtered') (x.status === 'uninstall' ? cls.excl : x.status === 'conflict' || x.status === 'depends' ? cls.broad : cls.ok).push(id);
      }
    });
    if (sec.rows.length > shown[si].length) L.push(`    m${more++}[${label(`+${sec.rows.length - shown[si].length} more`)}]`);
    L.push('  end');
  });

  L.push(...edges);
  L.push('  classDef broad fill:#f3ebdc,stroke:#8a5f0c');
  L.push('  classDef excl fill:#f4e3e1,stroke:#a33a32,color:#a33a32');
  L.push('  classDef group fill:#ebe7f2,stroke:#5e4a8a');
  L.push('  classDef ok fill:#e4eee7,stroke:#2e7550');
  Object.entries(cls).forEach(([c, ids]) => { if (ids.length) L.push(`  class ${ids.join(',')} ${c}`); });
  return L.join('\n');
}

function simReportMarkdown() {

// "autopilotlens-<device>-<YYYYMMDD-HHmm>": the .md file name and the PDF's suggested name
// Local "YYYYMMDD-HHmm" for export file names
function fileStamp() {
  const d = new Date(), p = v => String(v).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
function reportFileBase(model) {
  const stamp = fileStamp();
  const sim = model.sim;
  const slug = String(sim.deviceName || sim.serial || sim.model || 'device').toLowerCase().replace(/[^a-z0-9-]/g, '-');
  return `autopilotlens-${slug}-${stamp}`;
}

function exportSimMarkdown() {
  if (!LAST_SIM?.model) return;
  const md = simReportMarkdown();

  a.download = `${reportFileBase(LAST_SIM.model)}.md`;

// ── PDF export: a print view of the report model; the browser's "Save as PDF" renders it ──
// Assignment flow for print: Device → groups (+ All devices / All users) → one box per category per group.
// Hex colors (the SVG may be read outside this page); fonts via the page's stack.
function toReportSvg(r) {
  const W = 680, ROW = 44, NH = 34, TOP = 30, MAX_GROUPS = 10;
  const C = {
    device: { stroke: '#23221f', fill: '#fbfbf9' }, group: { stroke: '#5e4a8a', fill: '#ebe7f2' },
    broad: { stroke: '#8a5f0c', fill: '#f3ebdc' }, ok: { stroke: '#2e7550', fill: '#e4eee7' }, excl: { stroke: '#a33a32', fill: '#f4e3e1' },
  };
  const cut = (t, n) => { t = String(t ?? ''); return t.length > n ? t.slice(0, n - 1) + '…' : t; };
  const font = 'style="font-family:var(--font-sans)"';
  const groupsSec = r.sections.find(s => s.id === 'groups');
  const cats = r.sections.filter(s => s.id !== 'groups' && s.rows.length)
    .map(s => ({ ...s, label: { enrollment: 'Enrollment', configuration: 'Configuration', apps: 'Apps' }[s.id] || s.title }));
  const rows = cats.flatMap(c => c.rows.map(x => ({ ...x, cat: c.label })));

  // Middle column: broad targets that items use, then groups (capped)
  const broadUsed = ['All devices', 'All users'].filter(b => rows.some(x => x.viaKind === 'broad' && x.via === b && x.status !== 'excluded'));
  const groupNames = groupsSec.rows.map(g => g.name);
  const shownGroups = groupNames.slice(0, MAX_GROUPS);
  const mid = [
    ...broadUsed.map(b => ({ key: 'b:' + b, label: b, sub: 'Built-in target', ...C.broad })),
    ...shownGroups.map(g => ({ key: 'g:' + g, label: g, sub: 'Group', ...C.group })),
    ...(groupNames.length > MAX_GROUPS ? [{ key: 'more', label: `+${groupNames.length - MAX_GROUPS} more groups`, sub: '', ...C.group }] : []),
  ];
  const midKey = (kind, name) => kind === 'broad' ? 'b:' + name
    : shownGroups.includes(name) ? 'g:' + name : groupNames.includes(name) ? 'more' : null;

  // Right column: one box per (category, via node); excluded items in their own red box per (category, excluding group)
  const boxes = new Map();
  rows.forEach(x => {
    const excluded = x.status === 'excluded';
    const from = excluded ? midKey('group', x.exclVia) : midKey(x.viaKind, x.via);
    const key = `${x.cat}|${excluded ? 'x' : 'i'}|${from || 'device'}`;
    if (!boxes.has(key)) boxes.set(key, { from, excluded, cat: x.cat, names: [], tone: excluded ? C.excl : x.status === 'uninstall' ? C.excl : C.ok });
    boxes.get(key).names.push(x.name);
  });
  const right = [...boxes.values()];

  const nRows = Math.max(mid.length, right.length, 1);
  const H = TOP + nRows * ROW + 10;
  const y = i => TOP + i * ROW;
  const X = { dev: 10, mid: 245, right: 490 }, BW = { dev: 150, mid: 180, right: 180 };
  const devY = TOP + ((nRows - 1) * ROW) / 2;
  const node = (x, yy, w, n, label, sub) => `<rect x="${x}" y="${yy}" width="${w}" height="${NH}" rx="5" fill="${n.fill}" stroke="${n.stroke}" stroke-width="1"/>`
    + `<text x="${x + 9}" y="${yy + (sub ? 14 : 21)}" font-size="10.5" font-weight="600" fill="${n.stroke}" ${font}>${esc(cut(label, 30))}</text>`
    + (sub ? `<text x="${x + 9}" y="${yy + 27}" font-size="9" fill="${n.stroke}" opacity=".8" ${font}>${esc(cut(sub, 34))}</text>` : '');
  const edge = (x1, y1, x2, y2, color, dashed) => { const m = (x1 + x2) / 2;
    return `<path d="M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}" fill="none" stroke="${color}" stroke-width="1.2" opacity=".7"${dashed ? ' stroke-dasharray="4 3"' : ''}/>`; };

  let edges = '', nodes = '';
  const hdr = (x, t) => `<text x="${x}" y="16" font-size="9" font-weight="600" letter-spacing="1" fill="#66635c" ${font}>${t}</text>`;
  nodes += hdr(X.dev, 'DEVICE') + hdr(X.mid, 'GROUPS AND TARGETS') + hdr(X.right, 'WHAT APPLIES');
  nodes += node(X.dev, devY, BW.dev, C.device, r.device.name, r.device.groupTag ? 'Group tag ' + r.device.groupTag : '');
  const midY = {};
  mid.forEach((m, i) => {
    midY[m.key] = y(i);
    edges += edge(X.dev + BW.dev, devY + NH / 2, X.mid, y(i) + NH / 2, m.stroke, false);
    nodes += node(X.mid, y(i), BW.mid, m, m.label, m.sub);
  });
  right.forEach((b, i) => {
    const more = b.names.length - 1, prefix = b.excluded ? 'Excluded: ' : '', suffix = more ? ` +${more} more` : '';
    const label = prefix + cut(b.names[0], 30 - prefix.length - suffix.length) + suffix;   // fits the node's 30-char cut
    const fromY = b.from && midY[b.from] !== undefined ? midY[b.from] + NH / 2 : devY + NH / 2;
    const fromX = b.from && midY[b.from] !== undefined ? X.mid + BW.mid : X.dev + BW.dev;
    edges += edge(fromX, fromY, X.right, y(i) + NH / 2, b.tone.stroke, b.excluded);
    nodes += node(X.right, y(i), BW.right, b.tone, label, `${b.cat} · ${b.names.length}`);
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Assignment flow">${edges}${nodes}</svg>`;
}

// The device/user properties the rule evaluator can see for a simulated device, named as in Entra ID rules.
// Only properties we have a real value for; anything else stays "property not simulated".

  const tag = sim.groupTag;

    device: {

      deviceModel: sim.model,
      deviceManufacturer: sim.mfg,
      deviceOSVersion: sim.osVer,
      deviceOSType: 'Windows',
      displayName: sim.deviceName,
      deviceOwnership: 'Company',        // Autopilot-registered devices are always corporate
      accountEnabled: 'true',
      enrollmentProfileName: sim.enrollmentProfileName,

    user: { userPrincipalName: sim.upn, department: sim.dept, jobTitle: sim.jobTitle },

}
// Property paths the evaluator knows ('device.deviceModel', 'user.department', …), derived from buildSimProps
const RULE_PROPS = new Set(Object.entries(buildSimProps({ groupTag: 'x', deviceName: 'x', mfg: 'x', model: 'x', osVer: 'x', enrollmentProfileName: 'x', upn: 'x', dept: 'x', jobTitle: 'x' }))

function evalCond(c, p) {

  let m = c.match(/^([\w.]+)\s+-any\s+\(\s*_\s+(-\w+)\s+"([^"]*)"\s*\)/i);
  if (m) { const a = getPV(p, m[1]); if (!Array.isArray(a)) return false; return a.some(i => applyOp(String(i), m[2], m[3])); }

  m = c.match(/^([\w.]+)\s+-any\s+_\s+(-\w+)\s+"([^"]*)"/i);
  if (m) { const a = getPV(p, m[1]); if (!Array.isArray(a)) return false; return a.some(i => applyOp(String(i), m[2], m[3])); }

  m = c.match(/^([\w.]+)\s+(-\w+)\s+"([^"]*)"/i); if (m) return applyOp(String(getPV(p, m[1]) || ''), m[2], m[3]);
  m = c.match(/^([\w.]+)\s+(-\w+)\s+(\S+)/i); if (m) return applyOp(String(getPV(p, m[1]) || ''), m[2], m[3]);

    if (not) { const r = ev(not[1]); return r === null ? null : !r; }
    const m = e.match(/^([\w.]+)\s+(-\w+)\s+(.+)$/s);
    if (!m) { unsupported.push({ leaf: e, reason: 'syntax' }); return null; }
    const [, path, opRaw, valRaw] = m, op = opRaw.toLowerCase();
    if (!FILTER_OPS[op]) { unsupported.push({ leaf: e, reason: 'operator' }); return null; }
    if (!FILTER_PROPS.has(path.toLowerCase())) { unsupported.push({ leaf: e, reason: 'property' }); return null; }
    const v = valRaw.trim();
    const values = v.startsWith('[') ? [...v.matchAll(/"([^"]*)"/g)].map(x => x[1].toLowerCase())
      : [v.replace(/^"([\s\S]*)"$/, '$1').toLowerCase()];
    const actual = lookup(path).toLowerCase();
    return op === '-in' || op === '-notin' ? FILTER_OPS[op](actual, values) : FILTER_OPS[op](actual, values[0]);
  };
  const result = rule && rule.trim() ? ev(rule) : null;
  return { result, unsupported, ambiguous };
}
// Filter by id; the map follows DATA.assignmentFilters
let FILTER_BY_ID = new Map(), FILTER_SRC = null;
function filterById(id) {
  if (FILTER_SRC !== DATA.assignmentFilters) { FILTER_SRC = DATA.assignmentFilters; FILTER_BY_ID = new Map((FILTER_SRC || []).map(f => [f.id, f])); }
  return id ? FILTER_BY_ID.get(id) || null : null;
}
// What an assignment's filter means for one device: allowed true/false/null (null = can't decide)
function filterVerdict(target, filterProps) {
  const id = target.deviceAndAppManagementAssignmentFilterId, type = target.deviceAndAppManagementAssignmentFilterType || 'include';
  if (!id || type === 'none') return { allowed: true, id: null };
  const f = filterById(id);
  if (!f) return { allowed: null, id, type, filter: null, matches: null, reason: 'not found' };
  if (f.assignmentFilterManagementType === 'apps') return { allowed: null, id, type, filter: f, matches: null, reason: 'app filter' };
  const r = evalFilter(f.rule, filterProps);
  const reason = r.unsupported.length ? r.unsupported.map(u => u.reason === 'property' ? (u.leaf.match(/^[\w.]+/) || [u.leaf])[0] : `${u.reason} in "${u.leaf}"`).join(', ') : '';
  return { allowed: r.result === null ? null : type === 'exclude' ? !r.result : r.result, id, type, filter: f, matches: r.result, reason, ambiguous: r.ambiguous };
}
// "filter: Corp-only (include) ✓ matches" — plain text (report) and HTML with the rule as tooltip (Trace)
function filterText(m) {
  if (!m.filterId) return '';
  if (!m.filterName) return `filter: ${m.filterId.slice(0, 8)}… (not found)`;
  const verdict = m.filterMatches === true ? '✓ matches' : m.filterMatches === false ? '✗ doesn\'t match' : `? can't evaluate: ${m.filterReason}`;
  return `filter: ${m.filterName} (${m.filterType}) ${verdict}`;
}
function filterHtml(m) {
  if (!m.filterId) return '';
  if (!m.filterName) return `filter: ${esc(m.filterId.slice(0, 8))}… (not found)`;
  return `filter: <span class="tr-filter" title="${esc(m.filterRule).replace(/"/g, '&quot;')}">${esc(m.filterName)}</span> (${esc(m.filterType)}) ${esc(filterText(m).replace(/^filter: .*? \((include|exclude)\) /, ''))}${m.filterAmbiguous ? ' · <span class="gp-muted">mixed and/or without parentheses</span>' : ''}`;
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => { restoreFromUrl(); initMsal(); renderCurrentTab(); });
else { restoreFromUrl(); initMsal(); renderCurrentTab(); }
</script>

<script>
// ── Tweaks ──
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#0f766e",
  "density": "default",
  "fontScale": 1
}/*EDITMODE-END*/;
let tweaks = { ...TWEAK_DEFAULTS };

function applyTweaks() {
  const root = document.documentElement;
  root.style.setProperty('--accent', tweaks.accent);
  const dense = tweaks.density === 'compact';
  root.style.setProperty('--radius', dense ? '5px' : '8px');
  root.style.setProperty('--radius-sm', dense ? '3px' : '5px');
  document.body.style.fontSize = tweaks.fontScale === 1 ? '' : (tweaks.fontScale * 100) + '%';
}
applyTweaks();

(function() {
  const panel = document.createElement('div');
  panel.id = 'tweaks-panel';
  panel.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:800;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:16px;width:220px;box-shadow:var(--shadow-md);display:none;flex-direction:column;gap:14px;font-family:var(--font-sans);';
  panel.innerHTML = `
    <div style="font-size:12px;font-weight:600;color:var(--text);letter-spacing:-0.01em;">Tweaks</div>
    <div>
      <div class="lbl">Accent color</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        ${[['#0f766e','Deep teal'],['#1f6f78','Petrol'],['#1b5e8c','Ocean'],['#2f5bb7','Cobalt'],['#2d4a7a','Ink']].map(([c,n]) =>
          `<div onclick="setTweak('accent','${c}')" title="${n}" data-swatch="${c}" style="width:22px;height:22px;border-radius:5px;background:${c};cursor:pointer;border:2px solid transparent;transition:border-color .15s;"></div>`
        ).join('')}
      </div>
    </div>
    <div>
      <div class="lbl">Density</div>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-ghost" id="tw-dd" style="flex:1;font-size:11px;" onclick="setTweak('density','default')">Default</button>
        <button class="btn btn-ghost" id="tw-dc" style="flex:1;font-size:11px;" onclick="setTweak('density','compact')">Compact</button>
      </div>
    </div>
    <div>
      <div class="lbl">Text scale <span id="tw-sv">${Math.round(tweaks.fontScale*100)}%</span></div>
      <input type="range" min="0.85" max="1.15" step="0.05" value="${tweaks.fontScale}"
        oninput="setTweak('fontScale',parseFloat(this.value));document.getElementById('tw-sv').textContent=Math.round(parseFloat(this.value)*100)+'%'"
        style="width:100%;accent-color:var(--accent);" />
    </div>
  `;
  document.body.appendChild(panel);

  function updateSwatches() {
    panel.querySelectorAll('[data-swatch]').forEach(s => {
      s.style.borderColor = s.dataset.swatch === tweaks.accent ? 'var(--text)' : 'transparent';
    });
    const c = tweaks.density === 'compact';
    const dd = document.getElementById('tw-dd'); const dc = document.getElementById('tw-dc');
    if(dd){dd.style.background=!c?'var(--text)':'';dd.style.color=!c?'var(--bg4)':'';}
    if(dc){dc.style.background=c?'var(--text)':'';dc.style.color=c?'var(--bg4)':'';}
  }

  window.setTweak = function(k,v) {
    tweaks[k]=v; applyTweaks(); updateSwatches();
    window.parent.postMessage({type:'__edit_mode_set_keys',edits:tweaks},'*');
  };

  window.addEventListener('message', e => {
    if(e.data?.type==='__activate_edit_mode'){panel.style.display='flex';updateSwatches();}
    if(e.data?.type==='__deactivate_edit_mode')panel.style.display='none';
  });
  window.parent.postMessage({type:'__edit_mode_available'},'*');
})();
</script>
