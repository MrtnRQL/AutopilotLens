// Effective member count: the loaded member list wins when it is at least as large as the $count
function memberCountOf(id) {
  if (id === '__allDevices__') return DATA.managedDevices.length;
  const c = MEMBER_COUNTS[id];
  const cache = MEMBERS_CACHE[id];
  const loaded = cache?.status === 'ok' ? cache.rows.length : null;
  if (typeof c === 'number') return loaded !== null && loaded >= c ? loaded : c;
  return loaded !== null ? loaded : c;   // undefined while pending, or { error }
}
function countCellHtml(id) {
  if (id === '__allDevices__') return `<span title="Intune-managed and Autopilot-registered devices known to Autopilotlens">${DATA.managedDevices.length}</span>`;
  if (id === '__allUsers__' && demoMode) return '<span title="Not available in the demo">—</span>';
  if (id === '__allUsers__' && typeof memberCountOf(id) === 'number') {
    const title = ALL_USERS_LICENSED ? "Licensed users (Intune 'All users')"
      : "All users in the tenant (licensed-user count unavailable). Intune's All users means licensed users only.";
    return `<span title="${htmlAttr(title)}">${memberCountOf(id)}</span>`;
  }
  const c = memberCountOf(id);
  if (typeof c === 'number') return String(c);
  if (c && c.error) return `<span title="${htmlAttr(c.error)}">—</span>`;
  return '<span title="Loading member count">…</span>';
}
// Update just the count cells + findings (no full re-render: keeps search focus and scroll)
function updateCountCells(id) {
  document.querySelectorAll(`[data-count-for="${CSS.escape(id)}"]`).forEach(c => { c.innerHTML = countCellHtml(id); });
  if (BUILTIN_TARGETS[id] && GROUPS.selected === id) refreshMembers(id);   // count lives in the built-in detail too
  scheduleFindingsRefresh();
}
// Findings depend on member counts, so recompute (at most once per 250 ms) and patch only the findings UI
let findingsTimer = 0;
function scheduleFindingsRefresh() {
  if (findingsTimer) return;
  findingsTimer = setTimeout(() => { findingsTimer = 0; refreshFindingsUI(); }, 250);
}
function refreshFindingsUI() {
  if (!isAuthed || DATA.loading || !DATA.loaded) { updateNavBadge([]); closeFindingsDrawer(false); return; }
  const findings = buildFindings();
  updateNavBadge(findings);
  if (currentTab === 'overview' && el('ov-findings')) el('ov-findings').innerHTML = findingsStripHtml(findings);
  if (currentTab === 'groups' && el('gp-findings')) el('gp-findings').innerHTML = groupFindingsHtml(findings);
  if (FD.open) renderFindingsDrawer(findings);
  if (FD.pendingOpen) { FD.pendingOpen = false; openFindingsDrawer('url'); }   // ?findings=open, once data is there
}
function updateNavBadge(findings) {
  const b = el('nav-badge-overview');
  if (!b) return;
  const red = findings.filter(f => f.severity === 'red').length, n = red + findings.filter(f => f.severity === 'amber').length;
  b.hidden = !n;
  b.textContent = n;
  b.className = 'nav-badge ' + (red ? 'nav-badge-red' : 'nav-badge-amber');
  b.title = `${n} ${n === 1 ? 'finding' : 'findings'} to look at: ${red} red, ${n - red} amber`;
  // Screen readers get the count on the link itself (the badge is decorative text inside it)
  el('tab-overview')?.setAttribute('aria-label', n ? `Overview, ${n} ${n === 1 ? 'finding' : 'findings'} to look at` : 'Overview');
}

const parseCount = body => {
  const n = typeof body === 'number' ? body : parseInt(String(body ?? '').trim(), 10);
  return Number.isFinite(n) && n >= 0 ? n : null;
};

// Request $count for every listed group (dynamic + static in use) that has none yet; results fill in cell by cell
function ensureMemberCounts() {
  if (!DATA.loaded || DATA.loading) return;
  ensureAllUsersCount();
  const dyn = DATA.groups.filter(g => isListedGroup(g, GROUP_USAGE));
  if (demoMode) {   // demo: counts from the sample members, no Graph calls
    dyn.forEach(g => { if (!(g.id in MEMBER_COUNTS)) { MEMBER_COUNTS[g.id] = (DEMO_MEMBERS[g.id] || []).length; updateCountCells(g.id); } });
    return;
  }
  if (!isAuthed) return;
  const todo = dyn.filter(g => !(g.id in MEMBER_COUNTS) && !COUNTS_PENDING.has(g.id));
  if (!todo.length) return;
  todo.forEach(g => COUNTS_PENDING.add(g.id));
  const gen = COUNTS_GEN;
  const signal = COUNTS_ABORT.signal;
  const finish = (gid, value) => {
    if (gen !== COUNTS_GEN || !COUNTS_PENDING.has(gid)) return;
    if (signal.aborted) { COUNTS_PENDING.delete(gid); return; }   // cancelled: no value, no error shown
    COUNTS_PENDING.delete(gid);
    MEMBER_COUNTS[gid] = value;
    updateCountCells(gid);
  };
  const requests = todo.map((g, i) => ({ id: String(i), url: `/groups/${encodeURIComponent(g.id)}/members/$count`, headers: { ConsistencyLevel: 'eventual' } }));
  graphBatch(requests, (id, r) => {
    const gid = todo[Number(id)]?.id;
    if (!gid) return;
    const n = r.status === 200 ? parseCount(r.body) : null;
    finish(gid, n !== null ? n : { error: r.status === 200 ? 'Unexpected $count response' : `${r.status || 'No response'} ${r.body?.error?.message || ''}`.trim() });
  }, signal)
    .catch(e => todo.forEach(g => finish(g.id, { error: e.message })))
    .finally(() => todo.forEach(g => finish(g.id, { error: 'No response' })));
}

// All users: Intune's "All users" means licensed users, so count those. Not a group, so not part of the
// $batch; abortable like the batch counts. If the licence filter is rejected (400), count every user instead.
let ALL_USERS_LICENSED = true;   // false when the count fell back to every user in the tenant
function ensureAllUsersCount() {
  const id = '__allUsers__';
  if (demoMode || !isAuthed || !(GROUP_USAGE[id] || []).length || id in MEMBER_COUNTS || COUNTS_PENDING.has(id)) return;
  COUNTS_PENDING.add(id);
  const gen = COUNTS_GEN, signal = COUNTS_ABORT.signal;
  const usersCount = filter => graphGet(`https://graph.microsoft.com/v1.0/users/$count${filter ? '?$filter=' + encodeURIComponent(filter) : ''}`,
    { headers: { ConsistencyLevel: 'eventual' }, signal });
  let licensed = true;
  usersCount('assignedLicenses/$count ne 0')
    .catch(e => {
      if (signal.aborted || !/^400\b/.test(e.message)) throw e;
      licensed = false;
      return usersCount(null);
    })
    .then(body => { const n = parseCount(body); return n !== null ? n : { error: 'Unexpected $count response' }; }, e => ({ error: e.message }))
    .then(value => {
      if (gen !== COUNTS_GEN || !COUNTS_PENDING.has(id)) return;
      COUNTS_PENDING.delete(id);
      if (signal.aborted) return;   // cancelled: no value, no error shown
      MEMBER_COUNTS[id] = value;
      ALL_USERS_LICENSED = licensed;
      updateCountCells(id);
    });
}

// ── Group findings: pure, same shape as report findings ──
const ORDER_TAG_RE = /\[OrderID\]:([^"'\s)]+)/gi;
// Tags a rule tests with -contains "[OrderID]:X" (a substring match)
const orderContainsTags = rule => [...(rule || '').matchAll(/-contains\s+"\[OrderID\]:([^"]+)"/gi)].map(m => m[1]);

function groupFindings({ groups, usage, countOf, devices }) {
  const listed = groups.filter(g => isListedGroup(g, usage)).sort((a, b) => ciCmp(a.displayName, b.displayName));
  const red = [], amber = [], info = [];
  const deviceTags = new Set(devices.map(d => (d.groupTag || '').toLowerCase()).filter(Boolean));
  const unassigned = [], partial = [], tagIssues = [];   // tagIssues: { tag, group }
  const deviceTagList = [...new Map(devices.filter(d => d.groupTag).map(d => [d.groupTag.toLowerCase(), d.groupTag])).values()].sort(ciCmp);
  listed.forEach(g => {
    const u = usage[g.id] || [];
    const incl = u.filter(x => x.mode === 'include');
    const n = countOf(g.id);
    if (n === 0 && incl.length) {
      red.push({ severity: 'red', key: 'empty:' + g.id, title: `${incl.length} item${incl.length === 1 ? '' : 's'} assigned to an empty group`,
        detail: `${g.displayName}: ${incl.map(x => x.name).sort(ciCmp).join(', ')}`, groupId: g.id });
    }
    if (!isDyn(g)) return;   // the checks below are about rules; unassigned static groups are normal
    if (groupState(g) === 'Paused') {
      amber.push({ severity: 'amber', key: 'paused:' + g.id, title: `Rule paused: ${g.displayName}`, detail: 'Membership is not updated while rule processing is paused.', groupId: g.id });
    }
    if (deviceTags.size) {   // without any device data every tag would look unused
      const tags = [...new Set([...(g.membershipRule || '').matchAll(ORDER_TAG_RE)].map(m => m[1]))];
      tags.filter(t => !deviceTags.has(t.toLowerCase())).forEach(t => tagIssues.push({ tag: t, group: g }));
    }
    // -contains "[OrderID]:X" is a substring match: tag X also catches X2, XLAB, …
    const containsTags = orderContainsTags(g.membershipRule);
    if (containsTags.length && deviceTagList.length) {
      const own = new Set(containsTags.map(t => t.toLowerCase()));
      const extra = deviceTagList.filter(t => !own.has(t.toLowerCase())
        && evalRule(g.membershipRule, buildSimProps({ ...SIM_DEFAULTS, groupTag: t })));
      if (extra.length) {
        const x = containsTags[0];
        amber.push({ severity: 'amber', key: 'contains-wide:' + g.id, groupId: g.id, title: `Rule matches more group tags than intended: ${g.displayName}`,
          detail: `Rule uses -contains, so '${containsTags.join("', '")}' also matches: ${extra.join(', ')}. Use -eq or -any (_ -eq "[OrderID]:${x}") for an exact match.` });
      }
    }
    if (!u.length) unassigned.push(g);
    if (!ruleSupport(g.membershipRule).supported) partial.push(g);
  });
  const distinctTags = [...new Set(tagIssues.map(x => x.tag.toLowerCase()))];
  if (distinctTags.length > 3) {
    amber.push({ severity: 'amber', key: 'unused-tags', title: `${distinctTags.length} group tags that no device has`,
      detail: tagIssues.map(x => `${x.tag} (${x.group.displayName})`).join(', '),
      items: tagIssues.map(x => ({ label: `${x.tag} (${x.group.displayName})`, groupId: x.group.id })) });
  } else {
    tagIssues.forEach(({ tag: t, group: g }) => amber.push({
      severity: 'amber', key: `unused-tag:${t.toLowerCase()}:${g.id}`, title: `No device has group tag "${t}"`,
      detail: `${g.displayName} matches [OrderID]:${t}, but no device in Intune or Autopilot has that tag.`, groupId: g.id }));
  }
  Object.values(BUILTIN_TARGETS).forEach(b => {
    // A reference to a filter that no longer exists counts as no filter (when the filter list is available)
    const filtered = x => x.filterId && (!DATA.assignmentFilters.length || filterById(x.filterId));
    const names = (usage[b.id] || []).filter(x => x.mode === 'include' && !filtered(x)).map(x => x.name).sort(ciCmp);
    if (!names.length) return;
    amber.push({ severity: 'amber', key: 'nofilter:' + b.id, title: `${names.length} item${names.length === 1 ? '' : 's'} target ${b.displayName} without a filter`,
      detail: names.slice(0, 5).join(', ') + (names.length > 5 ? `, and ${names.length - 5} more` : ''), groupId: b.id });
  });
  if (unassigned.length > 3) {
    amber.push({ severity: 'amber', key: 'unassigned-groups', title: `${unassigned.length} dynamic groups not assigned to anything`, detail: unassigned.map(g => g.displayName).join(', '),
      items: unassigned.map(g => ({ label: g.displayName, groupId: g.id })) });
  } else {
    unassigned.forEach(g => amber.push({ severity: 'amber', key: 'unassigned-group:' + g.id, title: `Not assigned: ${g.displayName}`, detail: 'No profile, policy or app targets this dynamic group.', groupId: g.id }));
  }
  if (partial.length) {
    info.push({ severity: 'info', key: 'partial-rules', title: `${partial.length} group rule${partial.length === 1 ? '' : 's'} can't be fully simulated`,
      detail: partial.map(g => g.displayName).join(', '), ...(partial.length === 1 ? { groupId: partial[0].id } : {}),
      items: partial.length > 1 ? partial.map(g => ({ label: g.displayName, groupId: g.id })) : [] });
  }
  return [...red, ...amber, ...info];
}

// ── Tenant-wide findings: one model for the Overview card, the Groups tab and the nav badge ──
const FINDING_CATEGORIES = ['Autopilot', 'ESP', 'Assignments', 'Groups', 'Broad scope', 'Filters', 'Devices', 'Data quality'];
const FINDING_SEVERITY = { red: 0, amber: 1, info: 2 };
const SIM_DEFAULTS = { deviceName: '', enrollmentProfileName: '', groupTag: '', serial: '', mfg: '', model: '', osVer: '10.0.26100', upn: '', dept: '', jobTitle: '' };

// Finding: { id, severity, category, title, detail, items: [{ label, link }], link }
// link: { tab, group?, search?, table?, sim? }. Reads DATA, MEMBER_COUNTS (via memberCountOf) and buildGroupUsage(); no DOM.
function buildFindings() {
  const failed = new Set(DATA.errors.map(e => String(e).split(':')[0].trim()));   // refreshData source labels
  const loaded = deps => deps.every(d => !failed.has(d));
  const usage = buildGroupUsage();
  const groupIds = new Set(DATA.groups.map(g => g.id));
  const groupName = id => BUILTIN_TARGETS[id]?.displayName || DATA.groups.find(g => g.id === id)?.displayName || id;
  const out = [];
  const add = f => out.push({ items: [], link: null, ...f });
  const plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;
  const MAX = 3;   // more than 3 similar → one aggregated finding

  // Everything that can be assigned, with a link to where it can be looked at
  const assignable = [
    ...DATA.autopilotProfiles.map(p => ({ item: p, name: p.displayName, kind: 'Autopilot profile', link: null })),
    ...DATA.enrollmentStatusPages.map(e => ({ item: e, name: e.displayName, kind: 'ESP', link: null })),
    ...allPolicies().map(p => ({ item: p, name: p.name || p.displayName || '', kind: p._t, link: { tab: 'matrix', table: 'policies', search: p.name || p.displayName || '' } })),
    ...DATA.apps.map(a => ({ item: a, name: a.displayName || '', kind: 'App', link: { tab: 'matrix', table: 'apps', search: a.displayName || '' } })),
  ];
  const itemRef = x => ({ label: `${x.name} (${x.kind})`, link: x.link });

  // ── Autopilot: per group tag (evaluated per tag, not per device) ──
  if (loaded(['AP Profiles', 'Groups', 'Devices', 'APDevices'])) {
    const tags = new Map();   // lowercase → { tag, devices }
    DATA.managedDevices.forEach(d => {
      if (!d.groupTag) return;
      const k = d.groupTag.toLowerCase();
      if (!tags.has(k)) tags.set(k, { tag: d.groupTag, devices: 0 });
      tags.get(k).devices++;
    });
    const dynGroups = DATA.groups.filter(g => isDyn(g) && g.membershipRule);
    const uncertain = DATA.autopilotProfiles.some(p => resolveAssignmentsRaw(p).some(x => x.kind === 'include' && x.group && !isDyn(x.group)));
    const none = [], many = [];
    [...tags.values()].sort((a, b) => ciCmp(a.tag, b.tag)).forEach(t => {
      const props = buildSimProps({ ...SIM_DEFAULTS, groupTag: t.tag });
      const matched = new Set(dynGroups.filter(g => evalRule(g.membershipRule, props)).map(g => g.id));
      const profiles = DATA.autopilotProfiles.filter(p => {
        const asn = resolveAssignmentsRaw(p);
        const hit = asn.some(x => x.kind === 'allDevices' || (x.kind === 'include' && x.group && matched.has(x.group.id)));
        const excluded = asn.some(x => x.kind === 'exclude' && x.group && matched.has(x.group.id));
        return hit && !excluded;
      });
      const simLink = { tab: 'simulate', sim: { groupTag: t.tag } };
      if (!profiles.length) none.push({ ...t, simLink });
      else if (profiles.length > 1) many.push({ ...t, simLink, profiles: profiles.map(p => p.displayName).sort(ciCmp) });
    });
    const staticNote = uncertain ? ' Some profiles target static groups, which can\'t be evaluated per tag.' : '';
    if (none.length > MAX) {
      add({ id: 'tag-no-profile:many', severity: 'red', category: 'Autopilot', title: `${none.length} group tags have no Autopilot profile`,
        detail: `Devices with these tags get no deployment profile.${staticNote}`,
        items: none.map(t => ({ label: `${t.tag} (${plural(t.devices, 'device')})`, link: t.simLink })) });
    } else {
      none.forEach(t => add({ id: 'tag-no-profile:' + t.tag.toLowerCase(), severity: 'red', category: 'Autopilot', title: `${t.tag} has no Autopilot profile`,
        detail: `${plural(t.devices, 'device')} with group tag ${t.tag} would get no deployment profile.${staticNote}`, link: t.simLink }));
    }
    const manyDetail = 'Intune uses the oldest assignment. Verify which profile these devices get. (Evaluated per group tag, not per device.)';
    if (many.length > MAX) {
      add({ id: 'tag-many-profiles:many', severity: 'amber', category: 'Autopilot', title: `${many.length} group tags match more than one Autopilot profile`,
        detail: manyDetail, items: many.map(t => ({ label: `${t.tag}: ${t.profiles.join(', ')}`, link: t.simLink })) });
    } else {
      many.forEach(t => add({ id: 'tag-many-profiles:' + t.tag.toLowerCase(), severity: 'amber', category: 'Autopilot',
        title: `${t.tag} matches ${t.profiles.length} Autopilot profiles`, detail: `${t.profiles.join(', ')}. ${manyDetail}`, link: t.simLink }));
    }
  }
  // deploymentProfileAssignmentStatus may only be returned by the beta endpoint; skip silently when absent
  if (loaded(['APDevices']) && DATA.autopilotIdentities.some(a => a.deploymentProfileAssignmentStatus !== undefined)) {
    const bad = DATA.autopilotIdentities.filter(a => /^(notAssigned|failed)/i.test(a.deploymentProfileAssignmentStatus || ''))
      .sort((a, b) => ciCmp(a.serialNumber, b.serialNumber));
    if (bad.length) add({ id: 'profile-status', severity: 'amber', category: 'Autopilot', title: `${plural(bad.length, 'Autopilot device')} without an assigned profile`,
      detail: 'Profile assignment status is "not assigned" or failed.',
      items: bad.map(a => ({ label: `${a.serialNumber || a.id} (${a.deploymentProfileAssignmentStatus}${a.groupTag ? ', tag ' + a.groupTag : ''})`,
        link: a.groupTag ? { tab: 'simulate', sim: { groupTag: a.groupTag, serial: a.serialNumber || '' } } : null })) });
  }

  // ── ESP: blocking apps ──
  if (loaded(['ESP', 'Apps'])) {
    const apps = new Map(DATA.apps.map(a => [a.id, a]));
    const missing = [], notRequired = [], uncovered = [];
    [...DATA.enrollmentStatusPages].sort((a, b) => ciCmp(a.displayName, b.displayName)).forEach(esp => {
      const espTargets = resolveAssignmentsRaw(esp).filter(x => x.kind !== 'exclude')
        .map(x => x.kind === 'allDevices' ? '__allDevices__' : x.kind === 'allUsers' ? '__allUsers__' : (x.raw.target || x.raw).groupId).filter(Boolean);
      (esp.selectedMobileAppIds || []).forEach(appId => {
        const app = apps.get(appId);
        if (!app) { missing.push({ esp, appId }); return; }
        const req = resolveAssignmentsRaw(app).filter(x => x.kind !== 'exclude' && x.intent === 'required');
        if (!req.length) { notRequired.push({ esp, app }); return; }
        if (req.some(x => x.kind === 'allDevices' || x.kind === 'allUsers')) return;
        const reqIds = new Set(req.map(x => (x.raw.target || x.raw).groupId));
        const gaps = espTargets.filter(t => !reqIds.has(t));
        if (gaps.length) uncovered.push({ esp, app, gaps });
      });
    });
    const appLink = app => ({ tab: 'matrix', table: 'apps', search: app.displayName || '' });
    if (missing.length > MAX) {
      add({ id: 'esp-missing-app:many', severity: 'red', category: 'ESP', title: `${missing.length} ESP blocking apps don't exist`,
        detail: 'The ESP waits for apps that are no longer in Intune.', items: missing.map(m => ({ label: `${m.appId} (${m.esp.displayName})`, link: null })) });
    } else {
      missing.forEach(m => add({ id: `esp-missing-app:${m.esp.id}:${m.appId}`, severity: 'red', category: 'ESP',
        title: `${m.esp.displayName} blocks on an app that doesn't exist`, detail: `App id ${m.appId} is not in Intune. The ESP may wait until it times out.` }));
    }
    const nrDetail = 'ESP only tracks apps that are assigned as Required. This app won\'t actually block setup.';
    if (notRequired.length > MAX) {
      add({ id: 'esp-not-required:many', severity: 'amber', category: 'ESP', title: `${notRequired.length} ESP blocking apps aren't assigned as Required`,
        detail: nrDetail, items: notRequired.map(m => ({ label: `${m.app.displayName} (${m.esp.displayName})`, link: appLink(m.app) })) });
    } else {
      notRequired.forEach(m => add({ id: `esp-not-required:${m.esp.id}:${m.app.id}`, severity: 'amber', category: 'ESP',
        title: `${m.app.displayName} is an ESP blocking app but not Required`, detail: `${m.esp.displayName}. ${nrDetail}`, link: appLink(m.app) }));
    }
    if (uncovered.length > MAX) {
      add({ id: 'esp-coverage:many', severity: 'info', category: 'ESP', title: `${uncovered.length} ESP blocking apps don't cover all ESP targets`,
        detail: 'These apps are Required only to some of the groups the ESP targets.',
        items: uncovered.map(m => ({ label: `${m.app.displayName}: not ${m.gaps.map(groupName).join(', ')}`, link: appLink(m.app) })) });
    } else {
      uncovered.forEach(m => add({ id: `esp-coverage:${m.esp.id}:${m.app.id}`, severity: 'info', category: 'ESP',
        title: `${m.app.displayName} is Required only to part of what ${m.esp.displayName} targets`,
        detail: `Not covered: ${m.gaps.map(groupName).join(', ')}.`, link: appLink(m.app) }));
    }
  }

  // ── Assignments ──
  const both = [];
  assignable.forEach(x => {
    const asn = resolveAssignmentsRaw(x.item);
    const inc = new Set(asn.filter(a => a.kind === 'include' && a.group).map(a => a.group.id));
    const clash = [...new Set(asn.filter(a => a.kind === 'exclude' && a.group && inc.has(a.group.id)).map(a => a.group.id))];
    if (clash.length) both.push({ ...x, clash });
  });
  both.sort((a, b) => ciCmp(a.kind, b.kind) || ciCmp(a.name, b.name));
  if (both.length > MAX) {
    add({ id: 'include-exclude:many', severity: 'red', category: 'Assignments', title: `${both.length} items include and exclude the same group`,
      detail: 'Exclusion wins, so these groups get nothing from the item.', items: both.map(x => ({ label: `${x.name} (${x.clash.map(groupName).join(', ')})`, link: x.link })) });
  } else {
    both.forEach(x => add({ id: `include-exclude:${x.kind}:${x.item.id}`, severity: 'red', category: 'Assignments',
      title: `${x.name} includes and excludes the same group`, detail: `${x.kind}. ${x.clash.map(groupName).join(', ')}: exclusion wins, so the group gets nothing.`, link: x.link }));
  }
  if (loaded(['Groups'])) {   // without the group list every group would look deleted
    const missing = new Map();   // groupId → [assignable]
    assignable.forEach(x => {
      const ids = new Set(resolveAssignmentsRaw(x.item).map(a => (a.raw.target || a.raw).groupId).filter(id => id && !groupIds.has(id)));
      ids.forEach(id => { if (!missing.has(id)) missing.set(id, []); missing.get(id).push(x); });
    });
    const ids = [...missing.keys()].sort();
    if (ids.length > MAX) {
      add({ id: 'deleted-group:many', severity: 'amber', category: 'Assignments', title: `Assignments to ${ids.length} groups that no longer exist`,
        detail: 'These assignments do nothing. Remove them or reassign to an existing group.',
        items: ids.flatMap(id => missing.get(id).map(x => ({ label: `${id}: ${x.name} (${x.kind})`, link: x.link }))) });
    } else {
      ids.forEach(id => add({ id: 'deleted-group:' + id, severity: 'amber', category: 'Assignments', title: `Assigned to a group that no longer exists`,
        detail: `Group id ${id}. These assignments do nothing.`, items: missing.get(id).map(itemRef) }));
    }
  }
  if (loaded(['Filters'])) {   // assignment filters: missing references, unused filters, rules the simulation can't evaluate
    const refs = new Map();      // filterId → [assignable]
    assignable.forEach(x => resolveAssignmentsRaw(x.item).forEach(a => {
      const t = a.raw.target || a.raw, id = t.deviceAndAppManagementAssignmentFilterId;
      if (!id || t.deviceAndAppManagementAssignmentFilterType === 'none') return;
      if (!refs.has(id)) refs.set(id, []);
      if (!refs.get(id).includes(x)) refs.get(id).push(x);
    }));
    const missingF = [...refs.keys()].filter(id => !filterById(id)).sort();
    if (missingF.length > MAX) {
      add({ id: 'missing-filter:many', severity: 'red', category: 'Assignments', title: `Assignments use ${missingF.length} filters that don't exist`,
        detail: 'Intune can\'t evaluate these assignments as intended. Pick an existing filter or remove it.',
        items: missingF.flatMap(id => refs.get(id).map(x => ({ label: `${id}: ${x.name} (${x.kind})`, link: x.link }))) });
    } else {
      missingF.forEach(id => add({ id: 'missing-filter:' + id, severity: 'red', category: 'Assignments', title: 'Assignment uses a filter that doesn\'t exist',
        detail: `Filter id ${id}. Pick an existing filter or remove it.`, items: refs.get(id).map(itemRef) }));
    }
    const filters = [...DATA.assignmentFilters].sort((a, b) => ciCmp(a.displayName, b.displayName));
    const unused = filters.filter(f => !refs.has(f.id));
    if (unused.length) add({ id: 'unused-filters', severity: 'info', category: 'Assignments', title: `${plural(unused.length, 'filter')} not used by any assignment`,
      detail: 'Not referenced by any profile, policy or app assignment.', items: unused.map(f => ({ label: f.displayName, link: null })) });
    const blind = filters.filter(f => f.assignmentFilterManagementType !== 'apps')
      .map(f => ({ f, u: evalFilter(f.rule, buildFilterProps(SIM_DEFAULTS)).unsupported })).filter(x => x.u.length);
    const mixed = filters.filter(f => evalFilter(f.rule, buildFilterProps(SIM_DEFAULTS)).ambiguous);
    if (mixed.length) add({ id: 'filters-ambiguous', severity: 'info', category: 'Filters',
      title: `${mixed.length} ${mixed.length === 1 ? 'filter mixes' : 'filters mix'} and/or without parentheses`,
      detail: 'Intune\'s precedence isn\'t verified here. Add parentheses to make the intent explicit.',
      items: mixed.map(f => ({ label: `${f.displayName}: ${f.rule}`, link: null })) });
    if (blind.length) add({ id: 'filters-unevaluable', severity: 'info', category: 'Filters', title: `${plural(blind.length, 'filter')} can't be evaluated in the simulation`,
      detail: 'Their rules use properties or operators the simulation doesn\'t have, so items behind them show as "Depends on filter".',
      items: blind.map(x => ({ label: `${x.f.displayName}: ${x.u.map(u => u.reason === 'property' ? (u.leaf.match(/^[\w.]+/) || [u.leaf])[0] + ' (property)' : `${u.reason} in ${u.leaf}`).join(', ')}`, link: null })) });
  }
  const unassignedByKind = new Map();
  assignable.forEach(x => { if (!(x.item.assignments || []).length) { if (!unassignedByKind.has(x.kind)) unassignedByKind.set(x.kind, []); unassignedByKind.get(x.kind).push(x); } });
  unassignedByKind.forEach((list, kind) => add({ id: 'unassigned:' + kind, severity: 'info', category: 'Assignments',
    title: `${plural(list.length, kind + ' item')} not assigned`, detail: 'Not assigned to any group, All devices or All users.',
    items: list.sort((a, b) => ciCmp(a.name, b.name)).map(x => ({ label: x.name, link: x.link })) }));

  // ── Groups + Broad scope (groupFindings, unchanged). No group list → only the broad-scope part runs ──
  groupFindings({ groups: loaded(['Groups']) ? DATA.groups : [], usage, countOf: memberCountOf,
    devices: loaded(['Devices', 'APDevices']) ? DATA.managedDevices : [] }).forEach(f => {
    const broad = !!BUILTIN_TARGETS[f.groupId];
    add({ id: (broad ? 'broad:' : 'groups:') + (f.key || f.groupId || f.title), severity: f.severity, category: broad ? 'Broad scope' : 'Groups',
      title: f.title, detail: f.detail, link: f.groupId ? { tab: 'groups', group: f.groupId } : null,
      items: (f.items || []).map(i => ({ label: i.label, link: i.groupId ? { tab: 'groups', group: i.groupId } : null })) });
  });

  // ── Devices ──
  const devs = [...DATA.managedDevices].sort((a, b) => ciCmp(a.deviceName, b.deviceName));
  const devRef = d => ({ label: `${d.deviceName || d.serialNumber} (${d.serialNumber || 'no serial'})`, link: { tab: 'devices', device: d.id } });
  if (loaded(['Devices', 'APDevices'])) {
    const ref = devRef;
    const noTag = devs.filter(d => d._source !== 'enrolled' && !d.groupTag);   // has an Autopilot identity, but no tag
    if (noTag.length) add({ id: 'devices:no-tag', severity: 'info', category: 'Devices', title: `${plural(noTag.length, 'Autopilot device')} ${noTag.length === 1 ? 'has' : 'have'} no group tag`,
      detail: 'Rules on [OrderID] won\'t match them.', link: { tab: 'devices', filters: { tag: '__none__' } }, items: noTag.map(ref) });
    const stale = devs.filter(deviceIsStale);
    if (stale.length) add({ id: 'devices:stale', severity: 'info', category: 'Devices', title: `${plural(stale.length, 'device')} ${stale.length === 1 ? 'hasn\'t' : 'haven\'t'} synced in 30+ days`,
      detail: 'Last sync is more than 30 days ago.', link: { tab: 'devices', filters: { stale: true } }, items: stale.map(ref) });
  }
  if (loaded(['Devices'])) {
    const nonc = devs.filter(d => d.complianceState === 'noncompliant');
    if (nonc.length) add({ id: 'devices:noncompliant', severity: 'amber', category: 'Devices', title: `${plural(nonc.length, 'device')} ${nonc.length === 1 ? 'is' : 'are'} noncompliant`,
      detail: 'Intune reports these devices as not compliant.', link: { tab: 'devices', filters: { comp: ['noncompliant'] } }, items: nonc.map(devRef) });
  }

  // ── Data quality: one per failed source ──
  [...failed].sort(ciCmp).forEach(src => add({ id: 'source:' + src, severity: 'info', category: 'Data quality',
    title: `${errorSource(src + ':')} couldn't be loaded. Related checks were skipped.`,
    detail: DATA.errors.filter(e => String(e).split(':')[0].trim() === src).join(' ') }));

  return out.sort((a, b) => FINDING_SEVERITY[a.severity] - FINDING_SEVERITY[b.severity]
    || FINDING_CATEGORIES.indexOf(a.category) - FINDING_CATEGORIES.indexOf(b.category)
    || ciCmp(a.title, b.title) || ciCmp(a.id, b.id));
}

// ── Findings: compact strip (Overview, Groups) + right-side drawer ──
const FD = { open: false, cats: new Set(), showInfo: false, expanded: new Set(), openerSel: '', pendingOpen: false, prevOverflow: '', list: [] };
const FD_GROUP_CATS = ['Groups', 'Broad scope'];
const FD_SEV_COLOR = { red: 'var(--red)', amber: 'var(--amber)', info: 'var(--blue)' };
const fdPlural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;

// Counts and wording shared by the strips, the drawer header and the nav badge.
// "To look at" = red + amber (the badge count); info is mentioned but never counted as an issue.
function findingsSummary(findings, scope = 'all') {
  const r = findings.filter(f => f.severity === 'red').length, a = findings.filter(f => f.severity === 'amber').length, i = findings.length - r - a;
  const n = r + a;
  const parts = [r && `${r} ${r === 1 ? 'needs' : 'need'} attention`, a && `${a} to review`, i && `${i} info`].filter(Boolean);
  if (DATA.errors.length) parts.push('some data couldn\'t be loaded');
  const noun = scope === 'groups' ? 'group finding' : 'finding';
  const title = n ? `${fdPlural(n, noun)} to look at`
    : i ? 'No issues found'
    : scope === 'groups' ? 'No group findings' : 'No findings in your deployment';
  return { r, a, i, n, title, sub: parts.join(' · '), worst: r ? 'red' : a ? 'amber' : i ? 'info' : 'none' };
}

// One-line strip; scope 'groups' shows only Groups + Broad scope and opens the drawer filtered to them
function findingsStripHtml(findings, scope = 'all') {
  const list = scope === 'groups' ? findings.filter(f => FD_GROUP_CATS.includes(f.category)) : findings;
  const s = findingsSummary(list, scope);
  const tone = s.worst === 'red' || s.worst === 'amber' ? s.worst : 'none';
  const title = s.title;
  const icon = tone !== 'none' ? '!' : list.length ? 'i'
    : '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  return `<button type="button" class="fd-strip fd-strip-${tone}" data-fd-opener="${scope}" aria-haspopup="dialog" onclick="openFindingsDrawer('${scope}')">
    <span class="fd-icon" aria-hidden="true">${icon}</span>
    <span class="fd-text"><span class="fd-stitle">${esc(title)}</span>${s.sub ? `<span class="fd-ssub">${esc(s.sub)}</span>` : ''}</span>
    <span class="fd-view">View ›</span>
  </button>`;
}

// The finding row (title, detail, expandable items, "View →"); index i points into FD.list
function findingRowHtml(f, i) {
  const open = FD.expanded.has(f.id), key = htmlAttr(f.id);
  return `<div class="ov-frow">
      <span class="tr-sq" style="background:${FD_SEV_COLOR[f.severity]};" role="img" aria-label="${f.severity}"></span>
      <div class="ov-fmain">
        <div class="ov-ftitle">${esc(f.title)}</div>
        ${f.detail ? `<div class="ov-fdetail">${esc(f.detail)}</div>` : ''}
        ${f.items.length ? `<button type="button" class="ov-itoggle" data-fd-key="items:${key}" aria-expanded="${open}" onclick="toggleFindingItems(${i})">${fdPlural(f.items.length, 'item')} ${open ? '▾' : '▸'}</button>` : ''}
        ${open ? `<ul class="ov-items">${f.items.map((it, j) => `<li><span>${esc(it.label)}</span>${it.link ? `<button type="button" class="ov-link" data-fd-key="item:${key}:${j}" onclick="fdOpenLink(${i}, ${j})">View →</button>` : ''}</li>`).join('')}</ul>` : ''}
      </div>
      ${f.link ? `<button type="button" class="ov-link" data-fd-key="view:${key}" onclick="fdOpenLink(${i})">View →</button>` : '<span></span>'}
    </div>`;
}

// (Re)render the drawer content; keeps scroll position, expanded items and keyboard focus
function renderFindingsDrawer(findings = buildFindings()) {
  const d = el('findings-drawer');
  if (!d) return;
  const scroll = d.querySelector('.fd-body')?.scrollTop || 0;
  const focusKey = d.contains(document.activeElement) ? document.activeElement.dataset.fdKey : null;
  FD.list = findings;
  const s = findingsSummary(findings);
  const cats = FINDING_CATEGORIES.filter(c => findings.some(f => f.category === c));
  const filtered = findings.filter(f => !FD.cats.size || FD.cats.has(f.category));
  const group = (sev, label) => {
    const rows = filtered.filter(f => f.severity === sev);
    if (!rows.length) return '';
    const head = sev === 'info'
      ? `<button type="button" class="fd-ghead fd-ghead-btn" data-fd-key="info" aria-expanded="${FD.showInfo}" onclick="FD.showInfo=!FD.showInfo;renderFindingsDrawer()"><span class="tr-sq" style="background:${FD_SEV_COLOR[sev]};"></span>${label} · ${rows.length}<span class="fd-caret">${FD.showInfo ? '▾' : '▸'}</span></button>`
      : `<div class="fd-ghead"><span class="tr-sq" style="background:${FD_SEV_COLOR[sev]};"></span>${label} · ${rows.length}</div>`;
    return `<section class="fd-group">${head}${sev !== 'info' || FD.showInfo ? rows.map(f => findingRowHtml(f, findings.indexOf(f))).join('') : ''}</section>`;
  };
  d.innerHTML = `
    <div class="fd-head">
      <div class="fd-htext"><h2 id="fd-title">Findings</h2>
        <div class="fd-sub">${esc(s.title + (s.sub ? ' · ' + s.sub : ''))}</div></div>
      <button type="button" class="fd-close" id="fd-close" data-fd-key="close" aria-label="Close findings" onclick="closeFindingsDrawer()">×</button>
    </div>
    ${cats.length ? `<div class="gp-chiprow fd-chips">${filterChip(`onclick="setFindingsCats([])" data-fd-key="cat:All" aria-pressed="${!FD.cats.size}"`, 'All', !FD.cats.size)}${cats.map(c =>

// Esc closes; Tab / Shift+Tab stay inside the drawer
function fdKeydown(e) {
  if (!FD.open) return;
  if (e.key === 'Escape') { e.preventDefault(); closeFindingsDrawer(); return; }
  if (e.key !== 'Tab') return;
  const d = el('findings-drawer');
  const items = [...d.querySelectorAll('button, a[href], input, select, textarea, [tabindex]:not([tabindex="-1"])')].filter(x => !x.disabled && x.getClientRects().length);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (!d.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

async function loadGroupMembers(g) {
  if (g.builtin === 'user') return;   // All users: count only, never listed
  if (g.builtin === 'device' && !MEMBERS_CACHE[g.id]) {   // All devices: the devices we already have, no Graph call
    MEMBERS_CACHE[g.id] = { status: 'ok', rows: DATA.managedDevices.map(d => ({ id: 'md:' + d.id, deviceId: d.azureADDeviceId || '', displayName: d.deviceName,
      operatingSystemVersion: d.osVersion || '', '@odata.type': '#microsoft.graph.device', _managed: d })) };
    refreshMembers(g.id);
    return;
  }
  if (MEMBERS_CACHE[g.id]) return;   // cached, or a fetch is already in flight
  if (demoMode) { MEMBERS_CACHE[g.id] = { status: 'ok', rows: DEMO_MEMBERS[g.id] || [] }; refreshMembers(g.id); updateCountCells(g.id); return; }
  MEMBERS_CACHE[g.id] = { status: 'loading' };
  refreshMembers(g.id);
  const G = 'https://graph.microsoft.com/v1.0/groups/' + encodeURIComponent(g.id);
  const type = groupRuleType(g);
  const url = type === 'User' ? `${G}/members/microsoft.graph.user?$select=id,displayName,userPrincipalName,department&$top=999`
            : type === 'Device' ? `${G}/members/microsoft.graph.device?$select=id,deviceId,displayName,operatingSystem,operatingSystemVersion&$top=999`
            : `${G}/members?$select=id,displayName,deviceId,userPrincipalName&$top=999`;   // unknown: classify per row
  try {
    MEMBERS_CACHE[g.id] = { status: 'ok', rows: (await graphGet(url)) || [] };
  } catch (e) {
    MEMBERS_CACHE[g.id] = { status: 'error', error: e.message, forbidden: /\b403\b/.test(e.message) };
  }
  refreshMembers(g.id);
  updateCountCells(g.id);
}

// ── Devices (Inventory): read-only list, filters, detail, CSV ──
const DEVICE_PLATFORMS = ['Windows', 'iOS', 'Android', 'macOS', 'Other'];
const DEVICE_SOURCES = { enrolled: 'Enrolled', 'autopilot-only': 'Autopilot only', 'enrolled+autopilot': 'Enrolled + Autopilot', demo: 'Enrolled' };
const DEVICE_COMPLIANCE = [['compliant', 'Compliant'], ['noncompliant', 'Noncompliant'], ['inGracePeriod', 'In grace period'], ['other', 'Unknown']];
const STALE_MS = 30 * 864e5;

function devicePlatform(d) {
  if (d.platform) return d.platform;
  const os = (d.operatingSystem || '').toLowerCase();
  if (os.includes('windows')) return 'Windows';
  if (os.includes('ios') || os.includes('ipados')) return 'iOS';
  if (os.includes('android')) return 'Android';
  if (os.includes('mac')) return 'macOS';
  return d._source === 'autopilot-only' || !os ? 'Windows' : 'Other';
}
// Last sync (enrolled) or last contact (Autopilot); '' for missing or placeholder dates like 0001-01-01
function deviceLastSync(d) {
  const iso = d.lastSyncDateTime || d.lastContactedDateTime || '';
  const t = Date.parse(iso);
  return Number.isFinite(t) && new Date(t).getUTCFullYear() > 2000 ? iso : '';
}
const deviceIsStale = d => { const iso = deviceLastSync(d); return !!iso && Date.now() - Date.parse(iso) > STALE_MS; };
const deviceComplianceKey = d => d._source === 'autopilot-only' ? 'none'
  : ['compliant', 'noncompliant', 'inGracePeriod'].includes(d.complianceState) ? d.complianceState : 'other';
function fmtAgo(iso) {
  const ms = Date.now() - Date.parse(iso);
  if (ms < 36e5) return `${Math.max(1, Math.round(ms / 6e4))} min ago`;
  if (ms < 864e5) return `${Math.round(ms / 36e5)} h ago`;
  return `${Math.round(ms / 864e5)} d ago`;
}
// The simulator's view of a device (same fields selectDevice fills)
const simFromDevice = d => ({ ...SIM_DEFAULTS, deviceName: d.deviceName || '', serial: d.serialNumber || '', mfg: d.manufacturer || '', model: d.model || '',
  osVer: d.osVersion || '10.0.26100', groupTag: d.groupTag || '', upn: d.userPrincipalName || '' });

// URL: only non-default values
function devicesToParams(params) {
  const D = DEVICES;
  if (D.q) params.set('dq', D.q);
  if (D.plat.size) params.set('dplat', [...D.plat].join(','));
  if (D.src.size) params.set('dsrc', [...D.src].join(','));
  if (D.comp.size) params.set('dcomp', [...D.comp].join(','));
  if (D.tag) params.set('dtag', D.tag);
  if (D.stale) params.set('dstale', '1');
  if (D.sort !== 'name' || D.dir !== 'asc') params.set('dsort', `${D.sort}:${D.dir}`);
  if (D.page > 1) params.set('dpage', String(D.page));
  if (D.selected) params.set('device', D.selected);
}
function devicesFromParams(params) {
  const list = k => new Set((params.get(k) || '').split(',').filter(Boolean));
  const [sort, dir] = (params.get('dsort') || 'name:asc').split(':');
  DEVICES = { ...DEVICES_DEFAULT(), q: params.get('dq') || '', plat: list('dplat'), src: list('dsrc'), comp: list('dcomp'), tag: params.get('dtag') || '',
    stale: params.get('dstale') === '1', sort: sort || 'name', dir: dir === 'desc' ? 'desc' : 'asc', page: Math.max(1, parseInt(params.get('dpage'), 10) || 1), selected: params.get('device') || '' };
}

// Rows with everything the list sorts/filters/exports on
function deviceRows() {
  return DATA.managedDevices.map(d => ({
    d, id: d.id, name: d.deviceName || '', serial: d.serialNumber || '', tag: d.groupTag || '', model: d.model || '', mfg: d.manufacturer || '',
    os: [d.operatingSystem || (d._source === 'autopilot-only' ? '' : ''), d.osVersion].filter(Boolean).join(' '), platform: devicePlatform(d),
    upn: d.userPrincipalName || '', comp: deviceComplianceKey(d), compState: d.complianceState || '', lastSync: deviceLastSync(d), stale: deviceIsStale(d),
    source: DEVICE_SOURCES[d._source] || 'Enrolled', srcKey: d._source === 'demo' ? 'enrolled' : d._source,
  }));
}
function filteredDevices(rows = deviceRows()) {
  const D = DEVICES, q = D.q.trim().toLowerCase();
  const list = rows.filter(r => {
    if (q && ![r.name, r.serial, r.upn, r.model, r.mfg, r.tag].join(' ').toLowerCase().includes(q)) return false;
    if (D.plat.size && !D.plat.has(r.platform)) return false;
    if (D.src.size && !D.src.has(r.srcKey)) return false;
    if (D.comp.size && !D.comp.has(r.comp)) return false;
    if (D.tag === '__none__' ? r.tag : D.tag && r.tag.toLowerCase() !== D.tag.toLowerCase()) return false;
    if (D.stale && !r.stale) return false;
    return true;
  });
  const key = { name: r => r.name, tag: r => r.tag, model: r => r.model, os: r => r.os, upn: r => r.upn, comp: r => r.comp, lastSync: r => r.lastSync, source: r => r.source }[D.sort] || (r => r.name);
  const dir = D.dir === 'desc' ? -1 : 1;
  return list.sort((a, b) => (ciCmp(key(a), key(b)) || ciCmp(a.name, b.name) || ciCmp(a.id, b.id)) * dir);
}

function renderDevices(mount) {
  const rows = deviceRows();
  const list = filteredDevices(rows);
  const PAGE = 100, pages = Math.max(1, Math.ceil(list.length / PAGE));
  if (DEVICES.page > pages) DEVICES.page = pages;
  const start = (DEVICES.page - 1) * PAGE, shown = list.slice(start, start + PAGE);
  const fmt = n => n.toLocaleString('en-US');
  const enrolled = rows.filter(r => r.srcKey !== 'autopilot-only').length, apOnly = rows.length - enrolled;
  const D = DEVICES;
  const chips = (field, values) => values.map(([v, label]) => filterChip(`onclick="toggleDevicesFilter('${field}','${v}')" aria-pressed="${D[field].has(v)}"`, label, D[field].has(v))).join('');
  const platforms = DEVICE_PLATFORMS.filter(pl => rows.some(r => r.platform === pl));
  const tagCounts = {};

// Group membership for one device: actual (Entra memberOf, live) or predicted (demo / not in Entra yet)
function deviceGroupsState(d) {
  if (!demoMode && d.azureADDeviceId) return DEVICE_GROUPS_CACHE[d.id] || { status: 'loading' };
  const props = buildSimProps(simFromDevice(d));
  const found = new Map();
  if (demoMode && d.azureADDeviceId) {   // demo: reverse lookup in the sample members
    Object.entries(DEMO_MEMBERS).forEach(([gid, ms]) => {
      if (ms.some(m => (m.deviceId || '').toLowerCase() === d.azureADDeviceId.toLowerCase())) { const g = DATA.groups.find(x => x.id === gid); if (g) found.set(g.id, { ...g, how: 'Member' }); }
    });
  }
  DATA.groups.filter(g => isDyn(g) && g.membershipRule && evalRule(g.membershipRule, props))
    .forEach(g => { if (!found.has(g.id)) found.set(g.id, { ...g, how: 'Rule match' }); });
  return { status: 'ok', predicted: !d.azureADDeviceId, groups: [...found.values()] };
}
async function loadDeviceGroups(d) {
  if (demoMode || !d.azureADDeviceId || DEVICE_GROUPS_CACHE[d.id] || !isAuthed) return;
  const gen = COUNTS_GEN, signal = COUNTS_ABORT.signal;   // same abort/generation guards as the member counts
  DEVICE_GROUPS_CACHE[d.id] = { status: 'loading' };
  let next;
  try {
    const rows = await graphGet(`https://graph.microsoft.com/v1.0/devices(deviceId='${encodeURIComponent(d.azureADDeviceId)}')/memberOf?$select=id,displayName,groupTypes,membershipRule`, { signal });
    next = { status: 'ok', groups: (rows || []).filter(g => !g['@odata.type'] || g['@odata.type'] === '#microsoft.graph.group').map(g => ({ ...g, how: 'Member' })) };
  } catch (e) {
    if (signal.aborted) { if (gen === COUNTS_GEN) delete DEVICE_GROUPS_CACHE[d.id]; return; }
    next = { status: 'error', error: e.message };
  }
  if (gen !== COUNTS_GEN || signal.aborted) return;
  DEVICE_GROUPS_CACHE[d.id] = next;
  if (currentTab === 'devices' && DEVICES.selected === d.id && el('dv-detail')) el('dv-detail').innerHTML = deviceDetailHtml();
  if (el('gt-dialog')?.style.display === 'flex') renderTagDialogBody();   // tag preview waits on this for its profile result
}
// Autopilot profile(s) this device would get, from its groups + All devices (exclusions and filters respected)
function deviceProfiles(d, groupIds) {
  const fp = buildFilterProps(simFromDevice(d));
  return DATA.autopilotProfiles.filter(p => {
    const asn = resolveAssignmentsRaw(p);
    if (asn.some(x => x.kind === 'exclude' && x.group && groupIds.has(x.group.id))) return false;
    return asn.some(x => (x.kind === 'allDevices' || (x.kind === 'include' && x.group && groupIds.has(x.group.id)))
      && filterVerdict(x.raw.target || x.raw, fp).allowed !== false);
  });
}

const GE_BASE = 'https://developer.microsoft.com/graph/graph-explorer';
const GE_MAX_URL = 7500, GE_MAX_BATCH = 20;
const TAG_JOB_KEY = 'apl-tag-job';   // sessionStorage only: survives a reload, gone when the tab closes
let TAG_UI = { tag: '', shown: new Set(), ackAt: '', showNotice: false };   // shown: batch numbers with "Show request" open; ackAt: notice acknowledged before the job exists
let TAG_VERIFYING = false;

// Graph Explorer share links carry requestBody as base64 of a JSON *string literal* holding the body text (what its own
// Share produces). The body text is ASCII (non-ASCII escaped as \uXXXX) so atob() gets it back exactly.
const jsonAscii = obj => JSON.stringify(obj).replace(/[\u007f-\uffff]/g, c => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0'));
// '+' and '/' are percent-encoded, nothing else: a raw '+' would become a space in URLSearchParams
const geRequestBody = bodyText => btoa(JSON.stringify(bodyText)).replace(/[+/]/g, c => encodeURIComponent(c));
function tagBatchBody(items, tag) {
  return { requests: items.map((it, i) => ({ id: String(i + 1), method: 'POST',
    url: `/deviceManagement/windowsAutopilotDeviceIdentities/${encodeURIComponent(it.autopilotId)}/updateDeviceProperties`,
    headers: { 'Content-Type': 'application/json' }, body: { groupTag: tag } })) };
}
function geBatchLink(items, tag) {
  return `${GE_BASE}?request=${encodeURIComponent('$batch')}&method=POST&version=v1.0&GraphUrl=https://graph.microsoft.com`
    + `&requestBody=${geRequestBody(jsonAscii(tagBatchBody(items, tag)))}`;
}
// Up to 20 per batch; smaller when the link would pass GE_MAX_URL characters
function planTagBatches(items, tag) {
  const batches = [];
  for (let i = 0; i < items.length;) {
    let size = Math.min(GE_MAX_BATCH, items.length - i), url = geBatchLink(items.slice(i, i + size), tag);
    while (url.length > GE_MAX_URL && size > 1) { size--; url = geBatchLink(items.slice(i, i + size), tag); }
    if (url.length > GE_MAX_URL) return null;   // even one device doesn't fit: the tag is too long
    batches.push({ n: batches.length + 1, size, url, status: 'pending' });
    items.slice(i, i + size).forEach(it => { it.batch = batches.length; });
    i += size;
  }
  return batches;
}

function loadTagJob() { try { return JSON.parse(sessionStorage.getItem(TAG_JOB_KEY) || 'null'); } catch { return null; } }
function saveTagJob(job) { try { sessionStorage.setItem(TAG_JOB_KEY, JSON.stringify(job)); } catch { /* the job just won't survive a reload */ } }
function clearTagJob() { TAG_UI.ackAt = ''; TAG_UI.showNotice = false; try { sessionStorage.removeItem(TAG_JOB_KEY); } catch { /* nothing stored */ } }
const tagJobScope = () => demoMode ? 'demo' : (currentAccount?.tenantId || '');
// The stored job, only when it belongs to this tenant (or to the demo)
function activeTagJob() { const j = loadTagJob(); return j && j.scope === tagJobScope() ? j : null; }

// What the selection would do with this tag
function tagDraft(tag) {
  const devs = [...DEVICE_SEL].map(id => DATA.managedDevices.find(d => d.id === id));
  const notAp = devs.filter(d => !d?.autopilotId).length;
  const ap = devs.filter(d => d?.autopilotId);
  const same = ap.filter(d => (d.groupTag || '') === tag);
  const change = ap.filter(d => (d.groupTag || '') !== tag)
    .map(d => ({ autopilotId: d.autopilotId, deviceId: d.id, serial: d.serialNumber || '', deviceName: d.deviceName || '', oldTag: d.groupTag || '', batch: 0, status: 'pending', verifiedAt: '', attempts: 0, lastOpenedAt: '' }));
  return { change, same: same.length, notAp };
}
// Groups a device would be in with a given tag: dynamic rule matches + known static memberships
function tagGroupIds(d, tag) {
  const props = buildSimProps(simFromDevice({ ...d, groupTag: tag }));
  const ids = new Set(DATA.groups.filter(g => isDyn(g) && g.membershipRule && evalRule(g.membershipRule, props)).map(g => g.id));
  const known = deviceGroupsState(d);
  if (known.status === 'ok') known.groups.filter(g => !isDyn(g)).forEach(g => ids.add(g.id));
  return ids;
}
function tagPreviewHtml(items, newTag) {
  const byOld = new Map();
  items.forEach(it => { const l = byOld.get(it.oldTag) || []; l.push(it); byOld.set(it.oldTag, l); });
  const gName = id => DATA.groups.find(g => g.id === id)?.displayName || id;
  const profLabel = ps => !ps.length ? '<span class="tr-pill tr-pill-red">No profile</span>'
    : ps.length > 1 ? `<span class="tr-pill tr-pill-amber" title="${htmlAttr(ps.map(p => p.displayName).join(', '))}">Multiple profiles</span>`
    : `<span class="tr-pill tr-pill-gray">${esc(ps[0].displayName)}</span>`;
  const counted = (map, n) => [...map.entries()].sort((a, b) => ciCmp(gName(a[0]), gName(b[0])))
    .map(([id, c]) => `${esc(gName(id))}${c < n ? ` <span class="gp-muted">(${c} of ${n})</span>` : ''}`).join(', ');
  const newL = newTag.toLowerCase();
  const collisions = DATA.groups.filter(g => isDyn(g) && g.membershipRule) .filter(g => {
    const tags = orderContainsTags(g.membershipRule);
    return tags.length && !tags.some(t => t.toLowerCase() === newL) && evalRule(g.membershipRule, buildSimProps({ ...SIM_DEFAULTS, groupTag: newTag }));
  });
  const blocks = [...byOld.entries()].sort((a, b) => ciCmp(a[0], b[0])).map(([oldTag, list]) => {
    const transitions = new Map(), joined = new Map(), left = new Map();
    const devOf = it => DATA.managedDevices.find(x => x.id === it.deviceId) || { deviceName: it.deviceName, serialNumber: it.serial, groupTag: oldTag };
    // One representative live device per group: its actual memberOf (static groups) backs the profile result
    const rep = demoMode ? null : list.map(devOf).find(d => d.azureADDeviceId);
    if (rep) loadDeviceGroups(rep);
    const repState = rep ? (DEVICE_GROUPS_CACHE[rep.id]?.status || 'loading') : 'none';
    const rulesOnly = repState !== 'ok' && repState !== 'loading';   // autopilot-only, error or demo
    const label = ps => rulesOnly && !ps.length ? '<span class="tr-pill tr-pill-amber">No profile</span>' : profLabel(ps);
    list.forEach(it => {
      const d = devOf(it);
      const before = tagGroupIds(d, oldTag), after = tagGroupIds(d, newTag);
      const key = label(deviceProfiles({ ...d, groupTag: oldTag }, before)) + ' → ' + label(deviceProfiles({ ...d, groupTag: newTag }, after));
      transitions.set(key, (transitions.get(key) || 0) + 1);
      after.forEach(id => { if (!before.has(id)) joined.set(id, (joined.get(id) || 0) + 1); });
      before.forEach(id => { if (!after.has(id)) left.set(id, (left.get(id) || 0) + 1); });
    });
    const n = list.length;
    return `<div class="gt-block">
      <div class="gt-btitle">${oldTag ? `<span class="tr-pill tr-pill-accent">${esc(oldTag)}</span>` : '<span class="gp-muted">No tag</span>'} → <span class="tr-pill tr-pill-accent">${esc(newTag)}</span> <span class="gp-muted">${n} ${n === 1 ? 'device' : 'devices'}</span></div>
      <dl class="dv-props">
        <dt>Autopilot profile</dt><dd>${repState === 'loading' ? '<span class="gp-muted">Checking…</span>'
          : [...transitions.entries()].map(([k, c]) => `<div>${k}${c < n ? ` <span class="gp-muted">(${c})</span>` : ''}</div>`).join('')
            + (rulesOnly ? '<div class="gp-muted">(based on rules; static group memberships not included)</div>' : '')
            + (repState === 'ok' ? `<div class="gp-muted">Based on ${esc(rep.deviceName || rep.serialNumber)} as sample. Devices with different static group memberships may differ.</div>` : '')}</dd>
        <dt>Joins</dt><dd>${joined.size ? counted(joined, n) : '<span class="gp-muted">—</span>'}</dd>
        <dt>Leaves</dt><dd>${left.size ? counted(left, n) : '<span class="gp-muted">—</span>'}</dd>

  }).join('');

// Read-only check: GET each identity's groupTag ($batch of GETs) and compare with the new tag (case-sensitive)
async function verifyTagJob() {
  const job = activeTagJob();
  if (!job || TAG_VERIFYING) return;
  const todo = job.items.filter(it => it.status !== 'verified');
  const now = new Date().toISOString();
  const apply = (it, status) => {
    it.status = status;
    if (status !== 'verified') return;
    it.verifiedAt = now;
    const d = DATA.managedDevices.find(x => x.id === it.deviceId);
    if (d) { d.groupTag = job.newTag; d._tagPending = true; }
  };
  if (job.scope === 'demo') {
    // Demo: no network. Opened batches take effect, except DEMO-KIOSK-001 on its first attempt ("not changed"; a retry fixes it)
    todo.forEach(it => apply(it, job.batches.find(b => b.n === it.batch)?.status === 'opened' && (it.autopilotId !== 'apid-002' || it.attempts > 1) ? 'verified' : 'not changed'));
  } else {
    TAG_VERIFYING = true;
    const btn = el('gt-verify');
    if (btn) { btn.disabled = true; btn.textContent = 'Verifying…'; }
    const gen = COUNTS_GEN, signal = COUNTS_ABORT.signal;
    try {
      const results = await graphBatch(todo.map((it, i) => ({ id: String(i), url: `/deviceManagement/windowsAutopilotDeviceIdentities/${encodeURIComponent(it.autopilotId)}?$select=id,groupTag` })), () => {}, signal);
      if (gen !== COUNTS_GEN || signal.aborted) return;
      todo.forEach((it, i) => {
        const r = results.get(String(i));
        apply(it, !r ? 'error' : r.status === 200 ? (r.body?.groupTag === job.newTag ? 'verified' : 'not changed') : r.status === 404 ? 'not found' : 'error');
      });
    } catch (e) {
      if (!signal.aborted) showToast(`Verify failed: ${e.message}`, 'error');
      return;
    } finally {
      TAG_VERIFYING = false;
      const b2 = el('gt-verify');
      if (b2) { b2.disabled = false; b2.textContent = 'Verify'; }
    }
  }
  saveTagJob(job);
  const count = st => job.items.filter(it => it.status === st).length;
  track('grouptagger-verify', `${count('verified')} verified, ${count('not changed')} not changed, ${count('not found')} not found, ${count('error')} errors`);
  renderTagDialogBody();
  if (currentTab === 'devices') rerenderDevices();
}
