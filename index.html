}

// ── Findings: "Run checks" = step 1 scope check + step 2 configuration hygiene ──
// The scope check compares each assignment's target kind (users or devices) with the scope the item is built for.
// Runs only on "Run checks" (never on Refresh). Results live in memory only; refreshData marks them stale.
const STRICT_USER_ON_DEVICE = false;   // true: a user-scoped setting on a device target counts as a mismatch
// Result groups, in display order. Issues are counted in the sidebar badge.
const FX_GROUPS = [
  { id: 'issues', icon: '✕', title: 'Issues', cls: 'sc-n-red', label: n => n === 1 ? 'issue' : 'issues' },
  { id: 'review', icon: '!', title: 'Review', cls: 'sc-n-amber', label: () => 'to review' },
  { id: 'correct', icon: '✓', title: 'Correct', cls: 'sc-n-green', label: () => 'correct' },
  { id: 'nc', icon: '–', title: 'Not checkable', cls: 'sc-n-muted', label: () => 'not checkable' },
];
// Expanded sections and "Show N minor" lists: in memory only, reset on each run
const FX_UI_DEFAULT = () => ({ open: { issues: true, review: true, correct: false, nc: false }, minor: new Set() });
const SCOPE_DEFAULT = () => ({ result: null, running: false, phase: 0, step: '', stale: false, panelKey: '', panelOpener: null, prevOverflow: '', ui: FX_UI_DEFAULT() });
let SCOPE = SCOPE_DEFAULT();
let SCOPE_GEN = 0;          // bumped on reset/refresh so a run still in flight drops its result
let SCOPE_ABORT = new AbortController();
const SC_TEXT = {
  setting: 'Applies only after user sign-in. Skipped during ESP device phase and on devices without a user.',
  settingStrict: 'User-scoped setting on a device target. Applies only to users who sign in on those devices.',
  app: 'User-context install on a device target. Installs only when a user is signed in.',
  script: 'User-context script on a device target. Runs only when a user is signed in.',
  mix: 'Intune doesn\'t support mixing user and device groups across include and exclude.',
  mam: 'App protection policies target users. A device target doesn\'t deliver the policy.',
  autopilot: 'Autopilot deployment profiles target devices. A user target doesn\'t assign the profile.',
  filter: 'The assignment filter narrows which devices, but does not change the scope.',
};
const scPl = (n, noun, plural = noun + 's') => `${n} ${n === 1 ? noun : plural}`;
const scCap = k => ({ device: 'Device', user: 'User', mixed: 'Users + devices', empty: 'Empty', unresolved: 'Unknown' })[k] || k;
const scHHMM = d => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;

function resetScopeCheck() {
  SCOPE_ABORT.abort(); SCOPE_ABORT = new AbortController(); SCOPE_GEN++;
  closeScopePanel(false);
  SCOPE = SCOPE_DEFAULT();
  updateScopeBadge();
}
// refreshData: stop a run in flight and flag existing results as outdated
function markScopeCheckStale() {
  if (SCOPE.running) { SCOPE_ABORT.abort(); SCOPE_ABORT = new AbortController(); SCOPE_GEN++; SCOPE.running = false; SCOPE.step = ''; }
  if (SCOPE.result) SCOPE.stale = true;
}
function setScopeStep(text) {
  SCOPE.step = text;
  const p = el('sc-progress-text');
  if (p) p.textContent = text;
}
function setScopePhase(n, text) {
  SCOPE.phase = n;
  SCOPE.step = text;
  const p = el('sc-progress');
  if (p) p.outerHTML = scProgressHtml();
}

// Key shared by the Findings results and the Assignments matrix rows (allPolicies()._t, or 'App')
const scopeKey = item => `${item._t}|${item.id}`;
const scopeStatus = item => SCOPE.result?.byKey.get(scopeKey(item))?.status || '';

const scIsEndpointSecurity = p => /^endpointSecurity/i.test(p.templateReference?.templateFamily || '');
function scAppModel(a) {
  const t = (a['@odata.type'] || '').replace('#microsoft.graph.', '');
  if (!['win32LobApp', 'winGetApp', 'win32CatalogApp'].includes(t)) return null;   // no install context to compare
  return { type: 'runAs', field: 'installExperience.runAsAccount', value: a.installExperience?.runAsAccount, what: 'app' };
}
// Every item the check covers: { key, item, group, typeLabel, model }
function scCollectItems() {
  const out = [];
  const add = (src, arr, group, typeLabel, model) => (arr || []).forEach(it => {
    const m = model(it);
    if (m) out.push({ key: `${src}|${it.id}`, item: it, group, typeLabel: typeof typeLabel === 'function' ? typeLabel(it) : typeLabel, model: m });
  });
  const legacy = why => () => ({ type: 'legacy', why });
  const runAs = s => ({ type: 'runAs', field: 'runAsAccount', value: s.runAsAccount, what: 'script' });
  add('Settings Cat', DATA.settingsCatalog, 'Policies', p => scIsEndpointSecurity(p) ? 'Endpoint Security' : 'Settings Catalog', () => ({ type: 'settings' }));
  add('EP Security', DATA.endpointSecurity, 'Policies', 'Endpoint Security (legacy)', legacy('Legacy Endpoint Security policy: setting scope isn\'t exposed via Graph'));
  add('Device Config', DATA.deviceConfigs, 'Policies', 'Device configuration', legacy('Legacy configuration profile: setting scope isn\'t exposed via Graph'));
  add('Compliance', DATA.compliancePolicies, 'Policies', 'Compliance', legacy('Compliance policy: scope isn\'t exposed via Graph'));
  add('App Protection', DATA.appProtection, 'Policies', 'App protection', () => ({ type: 'user' }));
  add('AP Profile', DATA.autopilotProfiles, 'Profiles', 'Autopilot profile', () => ({ type: 'device' }));
  add('App', DATA.apps, 'Apps', a => (a['@odata.type'] || '').includes('winGet') ? 'WinGet app' : 'Win32 app', scAppModel);
  add('Script', DATA.scripts, 'Scripts', 'Platform script', runAs);       // beta: /deviceManagement/deviceManagementScripts?$expand=assignments (loaded by refreshData)
  add('Remediation', DATA.remediations, 'Scripts', 'Remediation', runAs);  // beta: /deviceManagement/deviceHealthScripts?$expand=assignments (loaded by refreshData)
  return out;
}

// Per setting, from the root definition. Only Windows definitions are evaluated.
// baseUri "./User…" → user, any other "./…" → device (the OMA-URI default scope, e.g. "./Vendor/MSFT/Defender").
// Without a baseUri the id prefix decides: user_ → user, device_ / vendor_ → device.
// noScope: neither a baseUri nor a recognised id prefix (reported as a note).
// No applicability in the response: an OMA-URI baseUri ("./…") is taken as Windows, anything else isn't checkable
const scIsWindowsDef = d => !d.applicability ? /^\.\//.test(d.baseUri || '')
  : /WindowsSettingApplicability$/i.test(d.applicability['@odata.type'] || '') || /windows10/i.test(d.applicability.platform || '');
function scSettingScopes(settings) {
  return settings.map(s => {
    const defs = s.settingDefinitions || [];
    const rootId = s.settingInstance?.settingDefinitionId || '';
    const d = defs.find(x => x.id === rootId) || defs[0] || { id: rootId };
    const base = d.baseUri || '';
    const id = String(d.id || rootId).toLowerCase();
    const windows = scIsWindowsDef(d);
    let scope = '', noScope = false;
    if (windows) {
      if (base) scope = /^\.\/user(\/|$)/i.test(base) ? 'user' : base.startsWith('./') ? 'device' : '';
      else scope = id.startsWith('user_') ? 'user' : /^(device|vendor)_/.test(id) ? 'device' : '';
      noScope = !base && !scope;
    }
    // offsetUri may start with "/": join without doubling it
    const path = base ? base.replace(/\/+$/, '') + (d.offsetUri ? '/' + d.offsetUri.replace(/^\/+/, '') : '') : '';
    return { name: d.displayName || d.name || d.id || rootId, path, scope, windows, noScope };
  });
}
const scStatusMsg = r => r?.status ? `HTTP ${r.status}${r.body?.error?.code ? ' ' + r.body.error.code : ''}` : 'no response';
const scCountNote = counts => Object.entries(counts).map(([m, n]) => `${m} ×${n}`).join(', ');

// Settings Catalog + new Endpoint Security: settings with definitions, per policy
async function scLoadSettings(pols, notes, signal) {
  const out = new Map();   // policy id → { settings } | { error }
  if (!pols.length) return out;
  if (demoMode) {   // demo: local sample data, no Graph calls
    pols.forEach(p => out.set(p.id, DEMO_SETTINGS[p.id] ? { settings: DEMO_SETTINGS[p.id] } : { error: 'no setting data in the demo' }));
    setScopeStep(`Loading setting definitions… ${pols.length}/${pols.length}`);
    return out;
  }
  let done = 0;
  setScopeStep(`Loading setting definitions… 0/${pols.length}`);
  let res;
  try {
    // beta: GET /deviceManagement/configurationPolicies/{id}/settings?$expand=settingDefinitions (no v1.0 equivalent)
    res = await graphBatch(pols.map((p, i) => ({ id: String(i), url: `/deviceManagement/configurationPolicies/${encodeURIComponent(p.id)}/settings?$expand=settingDefinitions` })),
      () => setScopeStep(`Loading setting definitions… ${++done}/${pols.length}`), signal, 'beta');
  } catch (e) {
    if (!isAuthed || e.name === 'AbortError') throw e;
    notes.push(`Settings Catalog and Endpoint Security: setting definitions couldn't be loaded (${e.message.replace(/\.$/, '')}). These policies are listed as not checkable.`);
    pols.forEach(p => out.set(p.id, { error: e.message }));
    return out;
  }
  const failed = {};
  await Promise.all(pols.map(async (p, i) => {
    const r = res.get(String(i));
    if (r?.status !== 200) { const m = scStatusMsg(r); failed[m] = (failed[m] || 0) + 1; out.set(p.id, { error: m }); return; }
    let settings = r.body?.value || [];
    const next = r.body?.['@odata.nextLink'];
    if (next) {   // more pages for this policy: graphGet follows the rest
      try { settings = settings.concat(await graphGet(next, { signal })); }
      catch (e) { if (!isAuthed || e.name === 'AbortError') throw e; failed[e.message] = (failed[e.message] || 0) + 1; out.set(p.id, { error: e.message }); return; }
    }
    out.set(p.id, { settings });
  }));
  const nFailed = Object.values(failed).reduce((a, b) => a + b, 0);
  if (nFailed) notes.push(`Setting definitions couldn't be loaded for ${nFailed} of ${scPl(pols.length, 'policy', 'policies')} (${scCountNote(failed)}). Those are listed as not checkable.`);
  return out;
}

const scKindFromCounts = (d, u) => d && u ? { kind: 'mixed', why: 'Group contains both users and devices' }
  : d ? { kind: 'device' } : u ? { kind: 'user' } : { kind: 'empty', why: 'Group has no user or device members' };

// Group step, one $batch for groups referenced by an assignment:
// - kindIds (static groups in scope-checked assignments): do they (transitively) hold devices, users, both or neither?
// - countIds: member count for the empty-group check. Written to MEMBER_COUNTS, so the Groups tab reuses it.
async function scResolveGroups(kindIds, countIds, notes, signal) {
  const kinds = new Map();   // group id → { kind, why }
  const ids = [...new Set([...kindIds, ...countIds])];
  if (!ids.length) return kinds;
  const kindSet = new Set(kindIds), countSet = new Set(countIds);
  if (demoMode) {   // demo: derive from DEMO_MEMBERS, no Graph calls
    const isUser = x => /\.user$/.test(x['@odata.type'] || '');
    kindIds.forEach(id => { const m = DEMO_MEMBERS[id] || []; kinds.set(id, scKindFromCounts(m.some(x => !isUser(x)), m.some(isUser))); });
    countIds.forEach(id => { MEMBER_COUNTS[id] = (DEMO_MEMBERS[id] || []).length; });
    setScopeStep(`Resolving groups… ${ids.length}/${ids.length}`);
    return kinds;
  }
  let done = 0;
  setScopeStep(`Resolving groups… 0/${ids.length}`);
  const h = { ConsistencyLevel: 'eventual' };   // required for $count on directory objects
  const reqs = [];
  ids.forEach((id, i) => {
    const g = encodeURIComponent(id);
    if (kindSet.has(id)) {
      reqs.push({ id: `${i}d`, url: `/groups/${g}/transitiveMembers/microsoft.graph.device?$count=true&$top=1&$select=id`, headers: h });
      reqs.push({ id: `${i}u`, url: `/groups/${g}/transitiveMembers/microsoft.graph.user?$count=true&$top=1&$select=id`, headers: h });
    }
    if (countSet.has(id)) reqs.push({ id: `${i}c`, url: `/groups/${g}/members/$count`, headers: h });
  });
  const parts = new Map();
  const expected = i => (kindSet.has(ids[i]) ? 2 : 0) + (countSet.has(ids[i]) ? 1 : 0);
  let res;
  try {
    res = await graphBatch(reqs, rid => {   // v1.0; per-response 429s are retried inside graphBatch
      const i = rid.slice(0, -1);
      parts.set(i, (parts.get(i) || 0) + 1);
      if (parts.get(i) === expected(Number(i))) setScopeStep(`Resolving groups… ${++done}/${ids.length}`);
    }, signal);
  } catch (e) {
    if (!isAuthed || e.name === 'AbortError') throw e;
    notes.push(`Groups couldn't be resolved (${e.message.replace(/\.$/, '')}). Assignments to static groups are listed as not checkable, and empty groups aren't detected.`);
    kindIds.forEach(id => kinds.set(id, { kind: 'unresolved', why: `Group type couldn't be resolved (${e.message})` }));
    return kinds;
  }
  if (signal.aborted) throw new DOMException('Aborted', 'AbortError');   // refreshed meanwhile: don't write old counts
  const failed = {}, failedCounts = {};
  const count = r => { const n = r.body?.['@odata.count']; return typeof n === 'number' ? n : (r.body?.value || []).length; };
  ids.forEach((id, i) => {
    if (countSet.has(id)) {
      const c = res.get(`${i}c`);
      const n = c?.status === 200 ? parseCount(c.body) : null;
      if (n !== null) MEMBER_COUNTS[id] = n;
      else {
        const m = c?.status === 200 ? 'Unexpected $count response' : scStatusMsg(c);
        failedCounts[m] = (failedCounts[m] || 0) + 1;
        MEMBER_COUNTS[id] = { error: m };
      }
    }
    if (!kindSet.has(id)) return;
    const d = res.get(`${i}d`), u = res.get(`${i}u`);
    if (d?.status !== 200 || u?.status !== 200) {
      const m = scStatusMsg(d?.status !== 200 ? d : u);
      failed[m] = (failed[m] || 0) + 1;
      kinds.set(id, { kind: 'unresolved', why: `Group type couldn't be resolved (${m})` });
      return;
    }
    kinds.set(id, scKindFromCounts(count(d) > 0, count(u) > 0));
  });
  const nFailed = Object.values(failed).reduce((a, b) => a + b, 0);
  if (nFailed) notes.push(`Group type couldn't be resolved for ${nFailed} of ${scPl(kindIds.length, 'static group')} (${scCountNote(failed)}). Assignments to those groups are not checkable.`);
  const nCounts = Object.values(failedCounts).reduce((a, b) => a + b, 0);
  if (nCounts) notes.push(`Member count couldn't be loaded for ${nCounts} of ${scPl(countIds.length, 'group')} (${scCountNote(failedCounts)}). Those groups aren't checked for being empty.`);
  return kinds;
}

function scTargetKind(a, groupKinds) {
  if (a.kind === 'allDevices') return { kind: 'device' };
  if (a.kind === 'allUsers') return { kind: 'user' };
  const t = a.raw.target || a.raw;
  const g = a.group;
  if (!g) return { kind: 'unresolved', why: `Group ${t.groupId || ''} not found (deleted?)` };
  if (isDyn(g)) {
    const rule = g.membershipRule || '';
    const d = /\bdevice\./i.test(rule), u = /\buser\./i.test(rule);
    return d && u ? { kind: 'mixed', why: 'Dynamic rule uses both user. and device. properties' }
      : d ? { kind: 'device' } : u ? { kind: 'user' } : { kind: 'unresolved', why: 'Dynamic rule has no user. or device. property' };
  }
  return groupKinds.get(g.id) || { kind: 'unresolved', why: 'Group type not resolved' };
}

// One result per assigned item. status: 'mismatch' if any assignment mismatches, else 'correct' if any
// assignment could be checked, else 'nc' (not checkable).
function scEvalItem(x, ctx) {
  const { item, model } = x;
  const asg = resolveAssignmentsRaw(item).map(a => {
    const t = a.raw.target || a.raw;
    const k = scTargetKind(a, ctx.groupKinds);
    const fid = t.deviceAndAppManagementAssignmentFilterId;
    return { mode: a.kind === 'exclude' ? 'exclude' : 'include', label: a.kind === 'allDevices' ? 'All devices' : a.kind === 'allUsers' ? 'All users' : a.label,
      viaGroup: !!t.groupId, kind: k.kind, why: k.why || '',
      filter: fid ? (DATA.assignmentFilters.find(f => f.id === fid)?.displayName || fid) : '', filterType: fid ? (t.deviceAndAppManagementAssignmentFilterType || 'include') : '' };
  });
  const inc = asg.filter(a => a.mode === 'include');
  if (!inc.length) return null;   // unassigned or exclude-only: nothing is delivered, nothing to check
  const r = { key: x.key, id: item.id, name: item.name || item.displayName || item.id, typeLabel: x.typeLabel, group: x.group,
    assignments: asg, reasons: [], ncReasons: [], scopeLabel: '', settings: null, okSettings: 0, status: 'nc', ncReason: '' };
  let itemNc = model.type === 'legacy' ? model.why : '';
  let known = [];
  if (model.type === 'settings') {
    const sc = ctx.settings.get(item.id);
    if (!sc || sc.error) itemNc = `Setting definitions couldn't be loaded${sc?.error ? ` (${sc.error})` : ''}`;
    else {
      r.settings = scSettingScopes(sc.settings);
      known = r.settings.filter(s => s.scope);
      ctx.missingBaseUri += r.settings.filter(s => s.noScope).length;
      if (!known.length) itemNc = !r.settings.length ? 'Policy has no settings'
        : !r.settings.some(s => s.windows) ? 'Not a Windows policy: setting scope is only evaluated for Windows definitions'
        : 'No setting scope in the definitions (no baseUri or recognised id prefix)';
      const scopes = new Set(known.map(s => s.scope));
      r.scopeLabel = scopes.size === 2 ? 'Device + User' : scCap([...scopes][0] || '');
    }
  } else if (model.type === 'runAs') {
    if (model.value !== 'user' && model.value !== 'system') {
      itemNc = `${model.field} ${model.value ? `has an unexpected value (${model.value})` : 'is missing in the Graph response'}`;
      ctx.missingRunAs[model.what] = (ctx.missingRunAs[model.what] || 0) + 1;
    }
    r.scopeLabel = model.value === 'system' ? 'System' : 'User';
  } else if (model.type === 'user') r.scopeLabel = 'User';
  else if (model.type === 'device') r.scopeLabel = 'Device';

  let checked = 0;
  const badSettings = new Map();   // setting path/name → row
  const rows = { runAs: [], user: [], device: [] };
  inc.forEach(a => {
    if (itemNc) return;
    if (a.kind !== 'device' && a.kind !== 'user') { r.ncReasons.push(`${a.label}: ${a.why}`); return; }
    checked++;
    const row = { assigned: scCap(a.kind), via: a.label, viaGroup: a.viaGroup, filter: a.filter };
    if (model.type === 'settings') {
      known.filter(s => a.kind === 'user' ? s.scope === 'device' : STRICT_USER_ON_DEVICE && s.scope === 'user').forEach(s => {
        const k = s.path || s.name;
        const prev = badSettings.get(k);
        if (prev) { if (!prev.vias.includes(a.label)) prev.vias.push(a.label); prev.filter = prev.filter || a.filter; }
        else badSettings.set(k, { ...row, setting: s.name, path: s.path, expected: scCap(s.scope), vias: [a.label], strict: a.kind === 'device' });
      });
    } else if (model.type === 'runAs' && model.value === 'user' && a.kind === 'device') rows.runAs.push({ ...row, setting: model.what === 'app' ? 'Install context' : 'Run as account', expected: 'User' });
    else if (model.type === 'user' && a.kind === 'device') rows.user.push({ ...row, setting: 'Policy target', expected: 'User' });
    else if (model.type === 'device' && a.kind === 'user') rows.device.push({ ...row, setting: 'Profile target', expected: 'Device' });
  });

  if (badSettings.size) {
    const list = [...badSettings.values()].map(b => ({ ...b, via: b.vias.join(', ') }));
    const strictOnly = list.every(b => b.strict);
    r.reasons.push({ rows: list, explain: strictOnly ? SC_TEXT.settingStrict : SC_TEXT.setting,
      short: strictOnly ? 'Needs user' : 'Needs device', shortSub: `assigned: ${strictOnly ? 'device' : 'user'} · ${scPl(list.length, 'setting')}` });
  }
  r.okSettings = known.length - badSettings.size;
  if (rows.runAs.length) r.reasons.push({ rows: rows.runAs, mono: `${model.field} = user`, explain: model.what === 'app' ? SC_TEXT.app : SC_TEXT.script, short: 'Needs user', shortSub: 'assigned: device' });
  if (rows.user.length) r.reasons.push({ rows: rows.user, explain: SC_TEXT.mam, short: 'Needs user', shortSub: 'assigned: device' });
  if (rows.device.length) r.reasons.push({ rows: rows.device, explain: SC_TEXT.autopilot, short: 'Needs device', shortSub: 'assigned: user' });

  // Include and exclude must target the same kind (every item type, legacy included)
  const kindsOf = mode => [...new Set(asg.filter(a => a.mode === mode && (a.kind === 'device' || a.kind === 'user')).map(a => a.kind))];
  const incK = kindsOf('include'), excK = kindsOf('exclude');
  if (incK.some(k => excK.some(e => e !== k))) {
    r.reasons.push({ rows: [{ setting: 'Include / exclude', expected: 'One kind', assigned: `${incK.map(scCap).join(' + ')} / ${excK.map(scCap).join(' + ')}`,
        via: asg.filter(a => a.kind === 'device' || a.kind === 'user').map(a => `${a.mode === 'exclude' ? 'excl' : 'incl'}: ${a.label}`).join(' · '), viaGroup: true, filter: '' }],
      mono: `include: ${incK.join(' + ')} · exclude: ${excK.join(' + ')}`, explain: SC_TEXT.mix, short: 'Mixed groups', shortSub: 'user + device across include/exclude' });
  }

  if (r.reasons.length) r.status = 'mismatch';
  else if (checked) r.status = 'correct';
  else r.ncReason = itemNc || r.ncReasons[0] || 'Nothing to check';
  return r;
}

// "Run checks": step 1 scope check (setting definitions, then one group step), step 2 configuration hygiene
async function runChecks() {
  if (SCOPE.running || !isAuthed || DATA.loading || !DATA.loaded) return;
  track('findings-run', 'Findings checks executed');
  SCOPE_ABORT.abort(); SCOPE_ABORT = new AbortController();
  const gen = ++SCOPE_GEN, signal = SCOPE_ABORT.signal;
  SCOPE.running = true;
  SCOPE.phase = 1;
  SCOPE.step = 'Preparing…';
  if (currentTab === 'findings') renderCurrentTab();
  const notes = [];
  try {
    // Data quality: one note per source that failed to load in refreshData (related checks skip it)
    const failed = [...new Set(DATA.errors.map(e => String(e).split(':')[0].trim()))].sort(ciCmp);
    failed.forEach(src => notes.push(`${errorSource(src + ':')} couldn't be loaded. Related checks were skipped (${DATA.errors.filter(e => String(e).split(':')[0].trim() === src)
      .map(e => String(e).split(':').slice(1).join(':').trim().replace(/\.$/, '')).join('; ')}).`));
    const items = scCollectItems();
    const hasInclude = it => resolveAssignments(it).some(a => a.kind !== 'exclude');
    const settings = await scLoadSettings(items.filter(x => x.model.type === 'settings' && hasInclude(x.item)).map(x => x.item), notes, signal);
    if (gen !== SCOPE_GEN) return;
    const staticIds = [...new Set(items.flatMap(x => resolveAssignments(x.item).filter(a => a.group && !isDyn(a.group)).map(a => a.group.id)))];
    // Member counts for every existing group an assignment references, unless the Groups tab already has one
    const groupIds = new Set(DATA.groups.map(g => g.id));
    const countIds = Object.keys(buildGroupUsage()).filter(id => groupIds.has(id) && typeof MEMBER_COUNTS[id] !== 'number');
    const groupKinds = await scResolveGroups(staticIds, countIds, notes, signal);
    if (gen !== SCOPE_GEN) return;
    const ctx = { settings, groupKinds, missingBaseUri: 0, missingRunAs: {} };
    const results = items.map(x => scEvalItem(x, ctx)).filter(Boolean);
    // Report fields that were missing in the responses instead of guessing
    if (ctx.missingRunAs.app) notes.push(`installExperience.runAsAccount was missing on ${scPl(ctx.missingRunAs.app, 'Win32/WinGet app')} in the Graph response. Those apps are listed as not checkable.`);
    if (ctx.missingRunAs.script) notes.push(`runAsAccount was missing on ${scPl(ctx.missingRunAs.script, 'script')} in the Graph response. Those scripts are listed as not checkable.`);
    if (ctx.missingBaseUri) notes.push(`${scPl(ctx.missingBaseUri, 'Windows setting definition')} had neither a baseUri nor a recognised id prefix (user_, device_, vendor_). Those settings are not checked.`);

    setScopePhase(2, 'Checking profiles, ESP, assignments, groups, filters and devices…');
    await new Promise(r => setTimeout(r, 0));   // let step 2 render before the synchronous work
    if (gen !== SCOPE_GEN) return;
    const hygiene = buildHygiene();
    SCOPE.result = { at: new Date(), items: results, notes, byKey: new Map(results.map(r => [r.key, r])), groups: fxGroups(results, hygiene) };
    SCOPE.ui = FX_UI_DEFAULT();
    SCOPE.stale = false;
  } catch (e) {
    if (gen !== SCOPE_GEN || e.name === 'AbortError') return;
    console.warn('[AAV] Checks failed:', e.message);
    showToast(`Checks failed: ${e.message}`, 'error');
  } finally {
    if (gen === SCOPE_GEN) {
      SCOPE.running = false;
      SCOPE.phase = 0;
      SCOPE.step = '';
      updateScopeBadge();
      if (['findings', 'groups', 'matrix'].includes(currentTab)) renderCurrentTab();
    }
  }
}

// Rows for the four result groups: one row per item per group. An item's findings of the same severity share a row,
// so an item can be in Issues and Review at once. Correct and Not checkable come from the scope check only.
function fxGroups(scopeItems, hygiene) {
  const issues = new Map(), review = new Map();
  const row = (map, e) => {
    if (!map.has(e.key)) map.set(e.key, { key: e.key, type: e.type, name: e.name, kind: e.kind, scope: null, checks: [] });
    return map.get(e.key);
  };
  scopeItems.filter(r => r.status === 'mismatch').forEach(r => { row(issues, { key: r.key, type: r.group, name: r.name, kind: r.typeLabel }).scope = r; });
  hygiene.forEach(h => row(h.sev === 'issue' ? issues : review, h).checks.push(h));
  const order = list => list.sort((a, b) => FX_TYPES.indexOf(a.type) - FX_TYPES.indexOf(b.type) || ciCmp(a.name, b.name));
  const compact = st => order(scopeItems.filter(r => r.status === st)
    .map(r => ({ key: r.key, type: r.group, name: r.name, kind: r.typeLabel, detail: st === 'correct' ? r.scopeLabel : r.ncReason, scopeKey: r.key, checks: [] })));
  return {
    issues: order([...issues.values()]),
    review: order([...review.values()].map(x => ({ ...x, minor: x.checks.every(c => c.minor) }))),
    correct: compact('correct'),
    nc: compact('nc'),
  };
}

function updateScopeBadge() {
  const b = el('nav-badge-findings');
  if (!b) return;
  const n = SCOPE.result ? SCOPE.result.groups.issues.length : 0;
  b.hidden = !n;
  b.textContent = n;
  b.title = n ? scPl(n, 'issue') : '';
  el('tab-findings')?.setAttribute('aria-label', n ? `Findings, ${scPl(n, 'issue')}` : 'Findings');
}

// Groups tab: one line after a run (hidden before the first run)
function groupFindingsLineHtml() {
  const r = SCOPE.result;
  if (!r) return '';
  const n = new Set([...r.groups.issues, ...r.groups.review].filter(x => x.type === 'Groups').map(x => x.key)).size;
  return `<div class="fx-gline"><span>${scPl(n, 'group finding')}${SCOPE.stale ? ' (outdated)' : ''}</span>
    <button type="button" class="ov-link" onclick="switchTab('findings')">→ View in Findings</button></div>`;
}

function scopeCellHtml(item) {
  const r = SCOPE.result?.byKey.get(scopeKey(item));
  if (!r) return '<span class="empty-note">—</span>';
  if (r.status === 'mismatch') {
    const m = r.reasons[0];
    return `<span class="tr-pill tr-pill-red">✕ ${esc(m.short)}</span><div class="sc-cell-sub">${esc(m.shortSub)}</div>`;
  }
  if (r.status === 'correct') return `<span class="tr-pill tr-pill-green">✓ ${esc(r.scopeLabel)}</span>`;
  return `<span class="tr-pill tr-pill-gray" title="${htmlAttr(r.ncReason)}">– Not checkable</span>`;
}
function toggleMatrixMismatch(table) {
  MATRIX[table].mismatchOnly = !MATRIX[table].mismatchOnly;
  renderMatrix(el('content-area'));
}

const SC_CHECKED_TYPES = ['Settings Catalog', 'Endpoint Security', 'Win32 apps', 'WinGet apps', 'Platform scripts', 'Remediations', 'App protection', 'Autopilot profiles'];
function scAboutHtml(collapsed) {
  const body = `<div class="sc-about-cols">
      <div><h3>What is checked</h3><p>Each assignment target (users or devices) against the scope the item is built for: CSP scope for Settings Catalog and Endpoint Security, install context for Win32 and WinGet apps, run-as account for scripts and remediations.</p></div>
      <div><h3>What an issue means</h3><p>Something is wrong: the assignment contradicts the setting's scope or install context, or it references something that doesn't exist. Intune may accept it, but it applies late, not at all, or not as intended.</p></div>
      <div><h3>What review means</h3><p>Configuration that may be unintended, such as unassigned policies or empty groups. Often deliberate – check before you change anything.</p></div>
      <div><h3>What it doesn't do</h3><p>Legacy policy types can't be verified via Graph and are listed as not checkable. Nothing is changed or stored: results are computed in your browser and cleared on refresh.</p></div>
    </div>
    <div class="sc-foot">Findings are guidance, not a verdict. Verify against Microsoft documentation before changing production assignments.</div>`;
  return collapsed
    ? `<details class="card sc-about" style="margin-top:20px;"><summary>About findings</summary>${body}</details>`
    : `<section class="card sc-about"><div class="eyebrow" style="margin-bottom:12px;">About findings</div>${body}</section>`;
}
// Both steps; the running one shows its progress text
const FX_STEPS = ['Scope check', 'Configuration hygiene'];
const scProgressHtml = () => `<ol class="fx-steps" id="sc-progress" role="status">${FX_STEPS.map((t, i) => {
    const n = i + 1, st = SCOPE.phase > n ? 'done' : SCOPE.phase === n ? 'run' : 'wait';
    return `<li class="fx-step fx-step-${st}">${st === 'run' ? '<div class="spin" aria-hidden="true"></div>' : `<span class="fx-step-i" aria-hidden="true">${st === 'done' ? '✓' : n}</span>`}
      <span>Step ${n} of ${FX_STEPS.length} · ${t}${st === 'done' ? ' · done' : st === 'wait' ? ' · waiting' : ''}</span>
      ${st === 'run' ? `<span class="gp-muted" id="sc-progress-text">${esc(SCOPE.step || 'Preparing…')}</span>` : ''}</li>`;
  }).join('')}</ol>`;

function scRowsHtml(rows) {
  return `<div class="sc-grid-wrap"><table class="sc-grid">

// CSP documentation link for a path, where the page is known
function scCspDocUrl(path) {
  const m = /^\.\/(?:(?:Device|User)\/)?Vendor\/MSFT\/([^/]+)\/(.+)$/i.exec(path || '');
  if (!m) return '';
  if (/^policy$/i.test(m[1])) {
    const p = /^Config\/([^/~]+)\/([^/~]+)$/i.exec(m[2]);   // ADMX-backed paths (with ~) have no per-policy page
    return p ? `https://learn.microsoft.com/windows/client-management/mdm/policy-csp-${p[1].toLowerCase()}#${p[2].toLowerCase()}` : '';
  }
  const slug = { defender: 'defender-csp', bitlocker: 'bitlocker-csp', firewall: 'firewall-csp', laps: 'laps-csp', passportforwork: 'passportforwork-csp', applocker: 'applocker-csp', personalization: 'personalization-csp' }[m[1].toLowerCase()];
  return slug ? `https://learn.microsoft.com/windows/client-management/mdm/${slug}` : '';
}

function openScopePanel(key) {

  SCOPE.panelKey = key;

  p.innerHTML = scPanelHtml(r);
  p.classList.add('fd-open');
  el('sc-scrim').classList.add('fd-open');
  if (!wasOpen) {
    SCOPE.prevOverflow = document.documentElement.style.overflow;

function closeScopePanel(restoreFocus = true) {

// Esc closes; Tab / Shift+Tab stay inside the panel
function scKeydown(e) {
  if (!SCOPE.panelKey) return;
  if (e.key === 'Escape') { e.preventDefault(); closeScopePanel(); return; }
  if (e.key !== 'Tab') return;
  const d = el('sc-panel');
  const items = [...d.querySelectorAll('button, a[href], [tabindex]:not([tabindex="-1"])')].filter(x => !x.disabled && x.getClientRects().length);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (!d.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

// ── Groups tab: dynamic groups with rule, assignments and members ──
// Group → what references it, from every assignable item. Separate from the Matrix tab's gMap.
function buildGroupUsage() {
  const usage = {};
  const add = (item, name, kind) => resolveAssignmentsRaw(item).forEach(x => {
    const t = x.raw.target || x.raw;
    // All devices / All users are built-in targets, not groups; they can't be excluded, so always include
    const gid = x.kind === 'allDevices' ? '__allDevices__' : x.kind === 'allUsers' ? '__allUsers__' : t.groupId;
    if (!gid) return;
    const filterId = t.deviceAndAppManagementAssignmentFilterId || null;
    (usage[gid] = usage[gid] || []).push({ name: name || '', kind, mode: x.kind === 'exclude' ? 'exclude' : 'include', intent: x.intent,
      filterId, filterType: filterId ? (t.deviceAndAppManagementAssignmentFilterType || 'include') : null });
  });
  DATA.autopilotProfiles.forEach(p => add(p, p.displayName, 'Autopilot profile'));
  DATA.enrollmentStatusPages.forEach(e => add(e, e.displayName, 'ESP'));
  allPolicies().forEach(p => add(p, p.name || p.displayName, p._t));
  DATA.apps.forEach(a => add(a, a.displayName, 'App'));
  return usage;
}

              <div style="flex:1;"><label class="gp-lbl" for="gp-search">Search</label>
                <input class="inp" id="gp-search" placeholder="Group, rule or assigned item…" value="${htmlAttr(GROUPS.search)}" oninput="setGroupsField('search',this.value,'gp-search')" /></div>
              ${filterCount ? `<button class="btn btn-ghost" onclick="GROUPS.search='';GROUPS.kind='dynamic';GROUPS.type='';GROUPS.usage='';GROUPS.state='';renderGroups(el('content-area'))">Clear (${filterCount})</button>` : ''}
            </div>
            <div class="gp-chiprow"><span class="gp-lbl">Groups</span>${kindChips}<span class="gp-lbl">Type</span>${chips('type', ['Device', 'User'])}<span class="gp-lbl">Usage</span>${chips('usage', ['Assigned', 'Unassigned'])}<span class="gp-lbl">State</span>${chips('state', ['On', 'Paused'])}</div>
          </div>
          <div class="tr-row gp-row gp-headrow">
            <div><button type="button" class="gp-sort${GROUPS.sort === 'name' ? ' on' : ''}" onclick="setGroupsSort('name')" aria-pressed="${GROUPS.sort === 'name'}">Name${GROUPS.sort === 'name' ? ' ▾' : ''}</button></div>
            <div>Type</div>
            <div class="gp-num"><button type="button" class="gp-sort${GROUPS.sort === 'members' ? ' on' : ''}" onclick="setGroupsSort('members')" aria-pressed="${GROUPS.sort === 'members'}">Members${GROUPS.sort === 'members' ? ' ▾' : ''}</button></div>
            <div>Rule</div><div>Assignments</div><div>State</div>
          </div>
          ${listRows || `<div class="tr-empty empty-note">${all.length ? 'No groups match the filters.' : GROUPS.kind === 'static' ? 'No static groups are assigned to anything.' : 'No dynamic groups found.'}</div>`}
        </section>
        <div id="gp-detail">${renderGroupDetailHtml()}</div>
      </div>
    </div>`;

  const g = findGroup(GROUPS.selected);
  if (g) loadGroupMembers(g);
  ensureMemberCounts();
}

function setGroupsSort(sort) {
  GROUPS.sort = sort;
  renderGroups(el('content-area'));
}

// Effective member count: the loaded member list wins when it is at least as large as the $count
function memberCountOf(id) {
  if (id === '__allDevices__') return DATA.managedDevices.length;
  const c = MEMBER_COUNTS[id];
  const cache = MEMBERS_CACHE[id];
  const loaded = cache?.status === 'ok' ? cache.rows.length : null;
  if (typeof c === 'number') return loaded !== null && loaded >= c ? loaded : c;
  return loaded !== null ? loaded : c;   // undefined while pending, or { error }
}
function countCellHtml(id) {
  if (id === '__allDevices__') return `<span title="Intune-managed and Autopilot-registered devices known to Autopilotlens">${DATA.managedDevices.length}</span>`;
  if (id === '__allUsers__' && demoMode) return '<span title="Not available in the demo">—</span>';
  if (id === '__allUsers__' && typeof memberCountOf(id) === 'number') {
    const title = ALL_USERS_LICENSED ? "Licensed users (Intune 'All users')"
      : "All users in the tenant (licensed-user count unavailable). Intune's All users means licensed users only.";
    return `<span title="${htmlAttr(title)}">${memberCountOf(id)}</span>`;
  }
  const c = memberCountOf(id);
  if (typeof c === 'number') return String(c);
  if (c && c.error) return `<span title="${htmlAttr(c.error)}">—</span>`;
  return '<span title="Loading member count">…</span>';
}
// Update just the count cells (no full re-render: keeps search focus and scroll)
function updateCountCells(id) {
  document.querySelectorAll(`[data-count-for="${CSS.escape(id)}"]`).forEach(c => { c.innerHTML = countCellHtml(id); });
  if (BUILTIN_TARGETS[id] && GROUPS.selected === id) refreshMembers(id);   // count lives in the built-in detail too
}
const parseCount = body => {
  const n = typeof body === 'number' ? body : parseInt(String(body ?? '').trim(), 10);
  return Number.isFinite(n) && n >= 0 ? n : null;
};

// Request $count for every listed group (dynamic + static in use) that has none yet; results fill in cell by cell
function ensureMemberCounts() {
  if (!DATA.loaded || DATA.loading) return;
  ensureAllUsersCount();
  const dyn = DATA.groups.filter(g => isListedGroup(g, GROUP_USAGE));
  if (demoMode) {   // demo: counts from the sample members, no Graph calls
    dyn.forEach(g => { if (!(g.id in MEMBER_COUNTS)) { MEMBER_COUNTS[g.id] = (DEMO_MEMBERS[g.id] || []).length; updateCountCells(g.id); } });
    return;
  }
  if (!isAuthed) return;
  const todo = dyn.filter(g => !(g.id in MEMBER_COUNTS) && !COUNTS_PENDING.has(g.id));
  if (!todo.length) return;
  todo.forEach(g => COUNTS_PENDING.add(g.id));
  const gen = COUNTS_GEN;
  const signal = COUNTS_ABORT.signal;
  const finish = (gid, value) => {
    if (gen !== COUNTS_GEN || !COUNTS_PENDING.has(gid)) return;
    if (signal.aborted) { COUNTS_PENDING.delete(gid); return; }   // cancelled: no value, no error shown
    COUNTS_PENDING.delete(gid);
    MEMBER_COUNTS[gid] = value;
    updateCountCells(gid);
  };
  const requests = todo.map((g, i) => ({ id: String(i), url: `/groups/${encodeURIComponent(g.id)}/members/$count`, headers: { ConsistencyLevel: 'eventual' } }));
  graphBatch(requests, (id, r) => {
    const gid = todo[Number(id)]?.id;
    if (!gid) return;
    const n = r.status === 200 ? parseCount(r.body) : null;
    finish(gid, n !== null ? n : { error: r.status === 200 ? 'Unexpected $count response' : `${r.status || 'No response'} ${r.body?.error?.message || ''}`.trim() });
  }, signal)
    .catch(e => todo.forEach(g => finish(g.id, { error: e.message })))
    .finally(() => todo.forEach(g => finish(g.id, { error: 'No response' })));
}

// All users: Intune's "All users" means licensed users, so count those. Not a group, so not part of the
// $batch; abortable like the batch counts. If the licence filter is rejected (400), count every user instead.
let ALL_USERS_LICENSED = true;   // false when the count fell back to every user in the tenant
function ensureAllUsersCount() {
  const id = '__allUsers__';
  if (demoMode || !isAuthed || !(GROUP_USAGE[id] || []).length || id in MEMBER_COUNTS || COUNTS_PENDING.has(id)) return;
  COUNTS_PENDING.add(id);
  const gen = COUNTS_GEN, signal = COUNTS_ABORT.signal;
  const usersCount = filter => graphGet(`https://graph.microsoft.com/v1.0/users/$count${filter ? '?$filter=' + encodeURIComponent(filter) : ''}`,
    { headers: { ConsistencyLevel: 'eventual' }, signal });
  let licensed = true;
  usersCount('assignedLicenses/$count ne 0')
    .catch(e => {
      if (signal.aborted || !/^400\b/.test(e.message)) throw e;
      licensed = false;
      return usersCount(null);
    })
    .then(body => { const n = parseCount(body); return n !== null ? n : { error: 'Unexpected $count response' }; }, e => ({ error: e.message }))
    .then(value => {
      if (gen !== COUNTS_GEN || !COUNTS_PENDING.has(id)) return;
      COUNTS_PENDING.delete(id);
      if (signal.aborted) return;   // cancelled: no value, no error shown
      MEMBER_COUNTS[id] = value;
      ALL_USERS_LICENSED = licensed;
      updateCountCells(id);
    });
}

// ── Group tags in rules ([OrderID]) ──
const ORDER_TAG_RE = /\[OrderID\]:([^"'\s)]+)/gi;
// Tags a rule tests with -contains "[OrderID]:X" (a substring match)
const orderContainsTags = rule => [...(rule || '').matchAll(/-contains\s+"\[OrderID\]:([^"]+)"/gi)].map(m => m[1]);

const SIM_DEFAULTS = { deviceName: '', enrollmentProfileName: '', groupTag: '', serial: '', mfg: '', model: '', osVer: '10.0.26100', platform: 'Windows', upn: '', dept: '', jobTitle: '' };

// ── Findings: configuration hygiene (step 2 of "Run checks") ──
// Computed from loaded data; member counts come from the checks' group step. One record per entity and check:
// { key, type, name, kind, link, sev: 'issue' | 'review', minor, title, detail }. Reads DATA and MEMBER_COUNTS; no DOM.
// Keys match the scope check's (`${_t}|${id}`), so both kinds of finding for an item land on the same row.
const FX_TYPES = ['Profiles', 'ESP', 'Policies', 'Apps', 'Scripts', 'Groups', 'Filters', 'Devices'];
const FX_POLICY_KIND = { 'Device Config': 'Device configuration', 'Settings Cat': 'Settings Catalog', 'Compliance': 'Compliance', 'EP Security': 'Endpoint Security (legacy)',
  'App Protection': 'App protection', 'Script': 'Platform script', 'Remediation': 'Remediation', 'Feature Update': 'Feature update', 'Quality Update': 'Quality update',
  'Driver Update': 'Driver update', 'App Config': 'App configuration' };

function buildHygiene() {
  const failed = new Set(DATA.errors.map(e => String(e).split(':')[0].trim()));   // refreshData source labels
  const loaded = deps => deps.every(d => !failed.has(d));
  const usage = buildGroupUsage();
  const groupIds = new Set(DATA.groups.map(g => g.id));
  const groupName = id => BUILTIN_TARGETS[id]?.displayName || DATA.groups.find(g => g.id === id)?.displayName || id;
  const plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;
  const list = (names, max = 5) => names.slice(0, max).join(', ') + (names.length > max ? `, and ${names.length - max} more` : '');
  const out = [];
  const add = (e, sev, title, detail, minor = false) => out.push({ key: e.key, type: e.type, name: e.name, kind: e.kind, link: e.link || null, sev, minor, title, detail });

  // Everything that can be assigned, with a link to where it can be looked at
  const assignable = [
    ...DATA.autopilotProfiles.map(p => ({ item: p, key: `AP Profile|${p.id}`, type: 'Profiles', name: p.displayName || '', kind: 'Autopilot profile', link: null })),
    ...DATA.enrollmentStatusPages.map(e => ({ item: e, key: `ESP|${e.id}`, type: 'ESP', name: e.displayName || '', kind: 'Enrollment Status Page', link: null })),
    ...allPolicies().map(p => ({ item: p, key: `${p._t}|${p.id}`, type: p._t === 'Script' || p._t === 'Remediation' ? 'Scripts' : 'Policies', name: p.name || p.displayName || '',
      kind: p._t === 'Settings Cat' && scIsEndpointSecurity(p) ? 'Endpoint Security' : FX_POLICY_KIND[p._t] || p._t,
      link: { tab: 'matrix', table: 'policies', search: p.name || p.displayName || '' } })),
    ...DATA.apps.map(a => ({ item: a, key: `App|${a.id}`, type: 'Apps', name: a.displayName || '', kind: 'App', link: { tab: 'matrix', table: 'apps', search: a.displayName || '' } })),
  ];

  // ── Profiles: Autopilot, per group tag (evaluated per tag, not per device) ──
  if (loaded(['AP Profiles', 'Groups', 'Devices', 'APDevices'])) {
    const tags = new Map();   // lowercase → { tag, devices }
    DATA.managedDevices.forEach(d => {
      if (!d.groupTag) return;
      const k = d.groupTag.toLowerCase();
      if (!tags.has(k)) tags.set(k, { tag: d.groupTag, devices: 0 });
      tags.get(k).devices++;
    });
    const dynGroups = DATA.groups.filter(g => isDyn(g) && g.membershipRule);
    const uncertain = DATA.autopilotProfiles.some(p => resolveAssignmentsRaw(p).some(x => x.kind === 'include' && x.group && !isDyn(x.group)));
    const staticNote = uncertain ? ' Some profiles target static groups, which can\'t be evaluated per tag.' : '';
    [...tags.values()].sort((a, b) => ciCmp(a.tag, b.tag)).forEach(t => {
      const props = buildSimProps({ ...SIM_DEFAULTS, groupTag: t.tag });
      const matched = new Set(dynGroups.filter(g => evalRule(g.membershipRule, props)).map(g => g.id));
      const profiles = DATA.autopilotProfiles.filter(p => {
        const asn = resolveAssignmentsRaw(p);
        const hit = asn.some(x => x.kind === 'allDevices' || (x.kind === 'include' && x.group && matched.has(x.group.id)));
        const excluded = asn.some(x => x.kind === 'exclude' && x.group && matched.has(x.group.id));
        return hit && !excluded;
      }).map(p => p.displayName).sort(ciCmp);
      const e = { key: 'Tag|' + t.tag.toLowerCase(), type: 'Profiles', name: t.tag, kind: 'Group tag', link: { tab: 'simulate', sim: { groupTag: t.tag } } };
      if (!profiles.length) add(e, 'issue', 'No Autopilot profile', `${plural(t.devices, 'device')} with this group tag would get no deployment profile.${staticNote}`);
      else if (profiles.length > 1) add(e, 'review', `Matches ${profiles.length} Autopilot profiles`,
        `${profiles.join(', ')}. Intune uses the oldest assignment. Verify which profile these devices get. (Evaluated per group tag, not per device.)`);
    });
  }
  // deploymentProfileAssignmentStatus may only be returned by the beta endpoint; skip silently when absent
  if (loaded(['APDevices']) && DATA.autopilotIdentities.some(a => a.deploymentProfileAssignmentStatus !== undefined)) {
    DATA.autopilotIdentities.filter(a => /^(notAssigned|failed)/i.test(a.deploymentProfileAssignmentStatus || ''))
      .sort((a, b) => ciCmp(a.serialNumber, b.serialNumber)).forEach(a => add(
        { key: 'APDevice|' + a.id, type: 'Profiles', name: a.serialNumber || a.id, kind: 'Autopilot device',
          link: a.groupTag ? { tab: 'simulate', sim: { groupTag: a.groupTag, serial: a.serialNumber || '' } } : null },
        'review', 'No profile assigned', `Profile assignment status is ${a.deploymentProfileAssignmentStatus}${a.groupTag ? ` (group tag ${a.groupTag})` : ''}.`));
  }

  // ── ESP: blocking apps ──
  if (loaded(['ESP', 'Apps'])) {
    const apps = new Map(DATA.apps.map(a => [a.id, a]));
    [...DATA.enrollmentStatusPages].sort((a, b) => ciCmp(a.displayName, b.displayName)).forEach(esp => {
      const e = { key: `ESP|${esp.id}`, type: 'ESP', name: esp.displayName || '', kind: 'Enrollment Status Page' };
      const espTargets = resolveAssignmentsRaw(esp).filter(x => x.kind !== 'exclude')
        .map(x => x.kind === 'allDevices' ? '__allDevices__' : x.kind === 'allUsers' ? '__allUsers__' : (x.raw.target || x.raw).groupId).filter(Boolean);
      const missing = [], notRequired = [], uncovered = [];
      (esp.selectedMobileAppIds || []).forEach(appId => {
        const app = apps.get(appId);
        if (!app) { missing.push(appId); return; }
        const req = resolveAssignmentsRaw(app).filter(x => x.kind !== 'exclude' && x.intent === 'required');
        if (!req.length) { notRequired.push(app.displayName || app.id); return; }
        if (req.some(x => x.kind === 'allDevices' || x.kind === 'allUsers')) return;
        const reqIds = new Set(req.map(x => (x.raw.target || x.raw).groupId));
        const gaps = espTargets.filter(t => !reqIds.has(t));
        if (gaps.length) uncovered.push(`${app.displayName}: not ${gaps.map(groupName).join(', ')}`);
      });
      if (missing.length) add(e, 'issue', missing.length === 1 ? 'Blocks on an app that doesn\'t exist' : `Blocks on ${missing.length} apps that don't exist`,
        `App id ${missing.join(', ')} ${missing.length === 1 ? 'is' : 'are'} not in Intune. The ESP may wait until it times out.`);
      if (notRequired.length) add(e, 'review', `${plural(notRequired.length, 'blocking app')} not assigned as Required`,
        `${list(notRequired)}. ESP only tracks apps that are assigned as Required, so ${notRequired.length === 1 ? 'it doesn\'t' : 'they don\'t'} actually block setup.`);
      if (uncovered.length) add(e, 'review', 'Required doesn\'t cover all ESP targets', `${uncovered.join('; ')}.`);
    });
  }

  // ── Assignments, per item ──
  const filterRefs = new Set();   // filter ids used by any assignment
  assignable.forEach(x => {
    const asn = resolveAssignmentsRaw(x.item);
    const inc = new Set(asn.filter(a => a.kind === 'include' && a.group).map(a => a.group.id));
    const clash = [...new Set(asn.filter(a => a.kind === 'exclude' && a.group && inc.has(a.group.id)).map(a => a.group.id))];
    if (clash.length) add(x, 'issue', 'Includes and excludes the same group', `${clash.map(groupName).join(', ')}: exclusion wins, so the group gets nothing.`);
    if (loaded(['Groups'])) {   // without the group list every group would look deleted
      const gone = [...new Set(asn.map(a => (a.raw.target || a.raw).groupId).filter(id => id && !groupIds.has(id)))].sort();
      if (gone.length) add(x, 'issue', 'Assigned to a group that no longer exists', `Group id ${gone.join(', ')}. ${gone.length === 1 ? 'This assignment does' : 'These assignments do'} nothing.`);
    }
    const fids = [...new Set(asn.map(a => a.raw.target || a.raw)
      .filter(t => t.deviceAndAppManagementAssignmentFilterId && t.deviceAndAppManagementAssignmentFilterType !== 'none').map(t => t.deviceAndAppManagementAssignmentFilterId))];
    fids.forEach(id => filterRefs.add(id));
    const missingF = loaded(['Filters']) ? fids.filter(id => !filterById(id)).sort() : [];
    if (missingF.length) add(x, 'issue', 'Uses a filter that doesn\'t exist', `Filter id ${missingF.join(', ')}. Pick an existing filter or remove it.`);
    if (!(x.item.assignments || []).length) add(x, 'review', 'Not assigned', 'Not assigned to any group, All devices or All users.');
  });

  // ── Filters (minor) ──
  if (loaded(['Filters'])) {
    [...DATA.assignmentFilters].sort((a, b) => ciCmp(a.displayName, b.displayName)).forEach(f => {
      const e = { key: 'Filter|' + f.id, type: 'Filters', name: f.displayName || f.id, kind: 'Assignment filter' };
      const ev = evalFilter(f.rule, buildFilterProps(SIM_DEFAULTS));
      if (!filterRefs.has(f.id)) add(e, 'review', 'Not used by any assignment', 'Not referenced by any profile, policy or app assignment.', true);
      if (ev.ambiguous) add(e, 'review', 'Mixes and/or without parentheses', `Intune's precedence isn't verified here. Add parentheses to make the intent explicit. Rule: ${f.rule}`, true);
      if (f.assignmentFilterManagementType !== 'apps' && ev.unsupported.length) add(e, 'review', 'Can\'t be evaluated in the simulation',
        `Uses ${ev.unsupported.map(u => u.reason === 'property' ? (u.leaf.match(/^[\w.]+/) || [u.leaf])[0] + ' (property)' : `${u.reason} in ${u.leaf}`).join(', ')}, which the simulation doesn't have, so items behind it show as "Depends on filter".`, true);
    });
  }

  // ── Groups. No group list → only the broad-scope part runs ──
  const devices = loaded(['Devices', 'APDevices']) ? DATA.managedDevices : [];
  const deviceTags = new Set(devices.map(d => (d.groupTag || '').toLowerCase()).filter(Boolean));
  const deviceTagList = [...new Map(devices.filter(d => d.groupTag).map(d => [d.groupTag.toLowerCase(), d.groupTag])).values()].sort(ciCmp);
  (loaded(['Groups']) ? DATA.groups : []).filter(g => isListedGroup(g, usage)).sort((a, b) => ciCmp(a.displayName, b.displayName)).forEach(g => {
    const e = { key: 'Group|' + g.id, type: 'Groups', name: g.displayName || g.id, kind: isDyn(g) ? 'Dynamic group' : 'Static group', link: { tab: 'groups', group: g.id } };
    const u = usage[g.id] || [];
    const incl = u.filter(x => x.mode === 'include');
    if (incl.length && memberCountOf(g.id) === 0) add(e, 'review', 'Assigned, but the group is empty', `${plural(incl.length, 'item')} assigned: ${list(incl.map(x => x.name).sort(ciCmp))}.`);
    if (!isDyn(g)) return;   // the checks below are about rules; unassigned static groups are normal
    if (groupState(g) === 'Paused') add(e, 'review', 'Rule processing paused', 'Membership is not updated while rule processing is paused.');
    if (deviceTags.size) {   // without any device data every tag would look unused
      const unused = [...new Set([...(g.membershipRule || '').matchAll(ORDER_TAG_RE)].map(m => m[1]))].filter(t => !deviceTags.has(t.toLowerCase()));
      if (unused.length) add(e, 'review', unused.length === 1 ? `No device has group tag "${unused[0]}"` : `No device has group tags ${unused.map(t => `"${t}"`).join(', ')}`,
        `The rule matches ${unused.map(t => `[OrderID]:${t}`).join(', ')}, but no device in Intune or Autopilot has ${unused.length === 1 ? 'that tag' : 'those tags'}.`);
    }
    // -contains "[OrderID]:X" is a substring match: tag X also catches X2, XLAB, …
    const containsTags = orderContainsTags(g.membershipRule);
    if (containsTags.length && deviceTagList.length) {
      const own = new Set(containsTags.map(t => t.toLowerCase()));
      const extra = deviceTagList.filter(t => !own.has(t.toLowerCase()) && evalRule(g.membershipRule, buildSimProps({ ...SIM_DEFAULTS, groupTag: t })));
      if (extra.length) add(e, 'review', 'Rule matches more group tags than intended',
        `Rule uses -contains, so '${containsTags.join("', '")}' also matches: ${extra.join(', ')}. Use -eq or -any (_ -eq "[OrderID]:${containsTags[0]}") for an exact match.`);
    }
    if (!u.length) add(e, 'review', 'Not assigned', 'No profile, policy or app targets this dynamic group.');
    if (!ruleSupport(g.membershipRule).supported) add(e, 'review', 'Rule can\'t be fully simulated', 'The rule uses properties or operators the simulation doesn\'t evaluate.', true);
  });
  // All devices / All users without a filter
  Object.values(BUILTIN_TARGETS).forEach(b => {
    // A reference to a filter that no longer exists counts as no filter (when the filter list is available)
    const filtered = x => x.filterId && (!DATA.assignmentFilters.length || filterById(x.filterId));
    const names = (usage[b.id] || []).filter(x => x.mode === 'include' && !filtered(x)).map(x => x.name).sort(ciCmp);
    if (names.length) add({ key: 'Group|' + b.id, type: 'Groups', name: b.displayName, kind: 'Built-in target', link: { tab: 'groups', group: b.id } },
      'review', `${plural(names.length, 'item')} without a filter`, `${list(names)}.`);
  });

  // ── Devices (minor) ──
  if (loaded(['Devices', 'APDevices'])) {
    DATA.managedDevices.filter(d => d._source !== 'enrolled' && !d.groupTag).sort((a, b) => ciCmp(a.deviceName, b.deviceName)).forEach(d => add(
      { key: 'Device|' + d.id, type: 'Devices', name: d.serialNumber || d.deviceName || d.id, kind: 'Autopilot device', link: { tab: 'devices', device: d.id } },   // serial: Autopilot-only devices have no real name
      'review', 'No group tag', 'Rules on [OrderID] won\'t match this device.', true));
  }
  return out;
}

// Navigate to where a finding can be looked at
function openFindingLink(link) {
  if (!link) return;
  track('finding-open', 'Finding link opened');
  if (link.group) {
    GROUPS.selected = link.group;
    GROUPS.memberSearch = '';
    GROUPS.showAll = false;
    switchTab('groups');
  } else if (link.search !== undefined) {
    MATRIX.policies.search = ''; MATRIX.apps.search = '';   // a search left over from an earlier link would hide rows
    switchTab('matrix');
    setMatrixField(link.table || 'policies', 'search', link.search);
  } else if (link.sim) {
    // A fresh device for the tag; user fields stay as they are. Not run automatically.
    Object.assign(SIM, { deviceName: '', enrollmentProfileName: '', serial: '', mfg: '', model: '', platform: 'Windows', deviceId: '', azureDeviceId: '' }, link.sim);   // group tags are Autopilot, so Windows
    switchTab('simulate');
  } else if (link.tab === 'devices') {
    const f = link.filters || {};
    DEVICES = { ...DEVICES_DEFAULT(), tag: f.tag || '', stale: !!f.stale, comp: new Set(f.comp || []), plat: new Set(f.plat || []), src: new Set(f.src || []), q: f.q || '', selected: link.device || '' };
    switchTab('devices');
  } else if (link.tab) {
    switchTab(link.tab);
  }
}

function renderGroupDetailHtml() {
  const g = findGroup(GROUPS.selected);
  if (!g) return `<div class="card gp-placeholder empty-note">${GROUPS.selected ? 'That group was not found in this tenant.' : 'Select a group to see its rule, assignments and members.'}</div>`;
  const type = groupRuleType(g), state = groupState(g);
  const support = ruleSupport(g.membershipRule);

  // Assignments, grouped by kind in a fixed order
  const usage = GROUP_USAGE[g.id] || [];
  const byKind = {};
  usage.forEach(u => { (byKind[u.kind] = byKind[u.kind] || []).push(u); });
  const kinds = Object.keys(byKind).sort(ciCmp);

async function loadGroupMembers(g) {
  if (g.builtin === 'user') return;   // All users: count only, never listed
  if (g.builtin === 'device' && !MEMBERS_CACHE[g.id]) {   // All devices: the devices we already have, no Graph call
    MEMBERS_CACHE[g.id] = { status: 'ok', rows: DATA.managedDevices.map(d => ({ id: 'md:' + d.id, deviceId: d.azureADDeviceId || '', displayName: d.deviceName,
      operatingSystemVersion: d.osVersion || '', '@odata.type': '#microsoft.graph.device', _managed: d })) };
    refreshMembers(g.id);
    return;
  }
  if (MEMBERS_CACHE[g.id]) return;   // cached, or a fetch is already in flight
  if (demoMode) { MEMBERS_CACHE[g.id] = { status: 'ok', rows: DEMO_MEMBERS[g.id] || [] }; refreshMembers(g.id); updateCountCells(g.id); return; }
  MEMBERS_CACHE[g.id] = { status: 'loading' };
  refreshMembers(g.id);
  const G = 'https://graph.microsoft.com/v1.0/groups/' + encodeURIComponent(g.id);
  const type = groupRuleType(g);
  const url = type === 'User' ? `${G}/members/microsoft.graph.user?$select=id,displayName,userPrincipalName,department&$top=999`
            : type === 'Device' ? `${G}/members/microsoft.graph.device?$select=id,deviceId,displayName,operatingSystem,operatingSystemVersion&$top=999`
            : `${G}/members?$select=id,displayName,deviceId,userPrincipalName&$top=999`;   // unknown: classify per row
  try {
    MEMBERS_CACHE[g.id] = { status: 'ok', rows: (await graphGet(url)) || [] };
  } catch (e) {
    MEMBERS_CACHE[g.id] = { status: 'error', error: e.message, forbidden: /\b403\b/.test(e.message) };
  }
  refreshMembers(g.id);
  updateCountCells(g.id);
}

const DEVICE_PLATFORMS = ['Windows', 'iOS', 'Android', 'macOS', 'Other'];
const DEVICE_SOURCES = { enrolled: 'Enrolled', 'autopilot-only': 'Autopilot only', 'enrolled+autopilot': 'Enrolled + Autopilot', demo: 'Enrolled' };
const DEVICE_COMPLIANCE = [['compliant', 'Compliant'], ['noncompliant', 'Noncompliant'], ['inGracePeriod', 'In grace period'], ['other', 'Unknown']];
const STALE_MS = 30 * 864e5;

// Simulated device platform: the Platform select's values, normalized to the keys itemPlatform() uses
const SIM_PLATFORMS = ['Windows', 'macOS', 'iOS', 'Android'];
function simPlatformKey(v) {
  const s = String(v || '').toLowerCase();
  if (s.startsWith('mac')) return 'macos';
  if (s === 'ios' || s === 'ipados') return 'ios';
  if (s.startsWith('android')) return 'android';
  return 'windows';   // Windows, and the default for anything else
}
const simPlatformLabel = v => ({ windows: 'Windows', macos: 'macOS', ios: 'iOS', android: 'Android' })[simPlatformKey(v)];
// Device record → simulator platform; Autopilot-only and unknown OS → Windows
const deviceSimPlatform = d => d._source === 'autopilot-only' ? 'Windows' : simPlatformLabel(devicePlatform(d));

function devicePlatform(d) {
  if (d.platform) return d.platform;
  const os = (d.operatingSystem || '').toLowerCase();
  if (os.includes('windows')) return 'Windows';
  if (os.includes('ios') || os.includes('ipados')) return 'iOS';
  if (os.includes('android')) return 'Android';
  if (os.includes('mac')) return 'macOS';
  return d._source === 'autopilot-only' || !os ? 'Windows' : 'Other';
}
// Last sync (enrolled) or last contact (Autopilot); '' for missing or placeholder dates like 0001-01-01
function deviceLastSync(d) {
  const iso = d.lastSyncDateTime || d.lastContactedDateTime || '';
  const t = Date.parse(iso);
  return Number.isFinite(t) && new Date(t).getUTCFullYear() > 2000 ? iso : '';
}
const deviceIsStale = d => { const iso = deviceLastSync(d); return !!iso && Date.now() - Date.parse(iso) > STALE_MS; };
const deviceComplianceKey = d => d._source === 'autopilot-only' ? 'none'
  : ['compliant', 'noncompliant', 'inGracePeriod'].includes(d.complianceState) ? d.complianceState : 'other';
function fmtAgo(iso) {
  const ms = Date.now() - Date.parse(iso);
  if (ms < 36e5) return `${Math.max(1, Math.round(ms / 6e4))} min ago`;
  if (ms < 864e5) return `${Math.round(ms / 36e5)} h ago`;
  return `${Math.round(ms / 864e5)} d ago`;
}

function devicesToParams(params) {

  if (D.stale) params.set('dstale', '1');

  if (D.page > 1) params.set('dpage', String(D.page));
  if (D.selected) params.set('device', D.selected);
}
function devicesFromParams(params) {

// Rows with everything the list sorts/filters/exports on
function deviceRows() {
  return DATA.managedDevices.map(d => ({
    d, id: d.id, name: d.deviceName || '', serial: d.serialNumber || '', tag: d.groupTag || '', model: d.model || '', mfg: d.manufacturer || '',
    os: [d.operatingSystem || (d._source === 'autopilot-only' ? '' : ''), d.osVersion].filter(Boolean).join(' '), platform: devicePlatform(d),
    upn: d.userPrincipalName || '', comp: deviceComplianceKey(d), compState: d.complianceState || '', lastSync: deviceLastSync(d), stale: deviceIsStale(d),
    source: DEVICE_SOURCES[d._source] || 'Enrolled', srcKey: d._source === 'demo' ? 'enrolled' : d._source,
  }));
}
function filteredDevices(rows = deviceRows()) {
  const D = DEVICES, q = D.q.trim().toLowerCase();
  const list = rows.filter(r => {
    if (q && ![r.name, r.serial, r.upn, r.model, r.mfg, r.tag].join(' ').toLowerCase().includes(q)) return false;
    if (D.plat.size && !D.plat.has(r.platform)) return false;
    if (D.src.size && !D.src.has(r.srcKey)) return false;
    if (D.comp.size && !D.comp.has(r.comp)) return false;
    if (D.tag === '__none__' ? r.tag : D.tag && r.tag.toLowerCase() !== D.tag.toLowerCase()) return false;
    if (D.stale && !r.stale) return false;
    return true;
  });
  const key = { name: r => r.name, tag: r => r.tag, model: r => r.model, os: r => r.os, upn: r => r.upn, comp: r => r.comp, lastSync: r => r.lastSync, source: r => r.source }[D.sort] || (r => r.name);
  const dir = D.dir === 'desc' ? -1 : 1;
  return list.sort((a, b) => (ciCmp(key(a), key(b)) || ciCmp(a.name, b.name) || ciCmp(a.id, b.id)) * dir);
}

// Group membership for one device: actual (Entra memberOf, live) or predicted (demo / not in Entra yet)
function deviceGroupsState(d) {
  if (!demoMode && d.azureADDeviceId) return DEVICE_GROUPS_CACHE[d.id] || { status: 'loading' };
  const props = buildSimProps(simFromDevice(d));
  const found = new Map();
  if (demoMode && d.azureADDeviceId) {   // demo: reverse lookup in the sample members
    Object.entries(DEMO_MEMBERS).forEach(([gid, ms]) => {
      if (ms.some(m => (m.deviceId || '').toLowerCase() === d.azureADDeviceId.toLowerCase())) { const g = DATA.groups.find(x => x.id === gid); if (g) found.set(g.id, { ...g, how: 'Member' }); }
    });
  }
  DATA.groups.filter(g => isDyn(g) && g.membershipRule && evalRule(g.membershipRule, props))
    .forEach(g => { if (!found.has(g.id)) found.set(g.id, { ...g, how: 'Rule match' }); });
  return { status: 'ok', predicted: !d.azureADDeviceId, groups: [...found.values()] };
}
async function loadDeviceGroups(d) {
  if (demoMode || !d.azureADDeviceId || DEVICE_GROUPS_CACHE[d.id] || !isAuthed) return;
  const gen = COUNTS_GEN, signal = COUNTS_ABORT.signal;   // same abort/generation guards as the member counts
  DEVICE_GROUPS_CACHE[d.id] = { status: 'loading' };
  let next;
  try {
    const rows = await graphGet(`https://graph.microsoft.com/v1.0/devices(deviceId='${encodeURIComponent(d.azureADDeviceId)}')/memberOf?$select=id,displayName,groupTypes,membershipRule`, { signal });
    next = { status: 'ok', groups: (rows || []).filter(g => !g['@odata.type'] || g['@odata.type'] === '#microsoft.graph.group').map(g => ({ ...g, how: 'Member' })) };
  } catch (e) {
    if (signal.aborted) { if (gen === COUNTS_GEN) delete DEVICE_GROUPS_CACHE[d.id]; return; }
    next = { status: 'error', error: e.message };
  }
  if (gen !== COUNTS_GEN || signal.aborted) return;
  DEVICE_GROUPS_CACHE[d.id] = next;
  if (currentTab === 'devices' && DEVICES.selected === d.id && el('dv-detail')) el('dv-detail').innerHTML = deviceDetailHtml();
  if (el('gt-dialog')?.style.display === 'flex') renderTagDialogBody();   // tag preview waits on this for its profile result
}
// Autopilot profile(s) this device would get, from its groups + All devices (exclusions and filters respected)
function deviceProfiles(d, groupIds) {
  const fp = buildFilterProps(simFromDevice(d));
  return DATA.autopilotProfiles.filter(p => {
    const asn = resolveAssignmentsRaw(p);
    if (asn.some(x => x.kind === 'exclude' && x.group && groupIds.has(x.group.id))) return false;
    return asn.some(x => (x.kind === 'allDevices' || (x.kind === 'include' && x.group && groupIds.has(x.group.id)))
      && filterVerdict(x.raw.target || x.raw, fp).allowed !== false);
  });
}

          <div class="tr-pill-col"><span class="tr-pill tr-pill-gray">${isDyn(g) ? 'Dynamic' : 'Static'}</span></div>

// ── GroupTagger: the change runs in Graph Explorer with the user's own access; AutopilotLens only reads ──
const DEVICE_SEL = new Set();   // selected device ids (Devices list), kept across pages and filters
function toggleDeviceSel(id, on) { if (on) DEVICE_SEL.add(id); else DEVICE_SEL.delete(id); rerenderDevices(); }
function clearDeviceSel() { DEVICE_SEL.clear(); rerenderDevices(); }
function selectDevicePage(on) {
  const list = filteredDevices(), start = (DEVICES.page - 1) * 100;
  list.slice(start, start + 100).filter(r => r.d.autopilotId).forEach(r => on ? DEVICE_SEL.add(r.id) : DEVICE_SEL.delete(r.id));
  rerenderDevices();
}
function selectAllMatching() { filteredDevices().filter(r => r.d.autopilotId).forEach(r => DEVICE_SEL.add(r.id)); rerenderDevices(); }

const GE_BASE = 'https://developer.microsoft.com/graph/graph-explorer';
const GE_MAX_URL = 7500, GE_MAX_BATCH = 20;
const TAG_JOB_KEY = 'apl-tag-job';   // sessionStorage only: survives a reload, gone when the tab closes
let TAG_UI = { tag: '', shown: new Set(), ackAt: '', showNotice: false };   // shown: batch numbers with "Show request" open; ackAt: notice acknowledged before the job exists
let TAG_VERIFYING = false;

// requestBody is base64 of the raw JSON body. Graph Explorer puts atob()'s result in its editor and JSON.parses it on Run, so
// the body must decode to an object: a JSON string literal (what its own Share produces) is sent as a string and Graph answers
// 400 "Invalid batch payload format". The body text is ASCII (non-ASCII escaped as \uXXXX) so atob() gets it back exactly.
// Hypothesis (unverified): the empty editor seen in earlier manual tests came from the /en-us/ redirect, not from the raw body.
const jsonAscii = obj => JSON.stringify(obj).replace(/[\u007f-\uffff]/g, c => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0'));
// '+' and '/' are percent-encoded, nothing else: a raw '+' would become a space in URLSearchParams
const geRequestBody = bodyText => btoa(bodyText).replace(/[+/]/g, c => encodeURIComponent(c));
function tagBatchBody(items, tag) {
  return { requests: items.map((it, i) => ({ id: String(i + 1), method: 'POST',
    url: `/deviceManagement/windowsAutopilotDeviceIdentities/${encodeURIComponent(it.autopilotId)}/updateDeviceProperties`,
    headers: { 'Content-Type': 'application/json' }, body: { groupTag: tag } })) };
}
function geBatchLink(items, tag) {
  return `${GE_BASE}?request=${encodeURIComponent('$batch')}&method=POST&version=v1.0&GraphUrl=https://graph.microsoft.com`
    + `&requestBody=${geRequestBody(jsonAscii(tagBatchBody(items, tag)))}`;
}
// Up to 20 per batch; smaller when the link would pass GE_MAX_URL characters
function planTagBatches(items, tag) {
  const batches = [];
  for (let i = 0; i < items.length;) {
    let size = Math.min(GE_MAX_BATCH, items.length - i), url = geBatchLink(items.slice(i, i + size), tag);
    while (url.length > GE_MAX_URL && size > 1) { size--; url = geBatchLink(items.slice(i, i + size), tag); }
    if (url.length > GE_MAX_URL) return null;   // even one device doesn't fit: the tag is too long
    batches.push({ n: batches.length + 1, size, url, status: 'pending' });
    items.slice(i, i + size).forEach(it => { it.batch = batches.length; });
    i += size;
  }
  return batches;
}

function loadTagJob() { try { return JSON.parse(sessionStorage.getItem(TAG_JOB_KEY) || 'null'); } catch { return null; } }
function saveTagJob(job) { try { sessionStorage.setItem(TAG_JOB_KEY, JSON.stringify(job)); } catch { /* the job just won't survive a reload */ } }
function clearTagJob() { TAG_UI.ackAt = ''; TAG_UI.showNotice = false; try { sessionStorage.removeItem(TAG_JOB_KEY); } catch { /* nothing stored */ } }
const tagJobScope = () => demoMode ? 'demo' : (currentAccount?.tenantId || '');
// The stored job, only when it belongs to this tenant (or to the demo)
function activeTagJob() { const j = loadTagJob(); return j && j.scope === tagJobScope() ? j : null; }

// What the selection would do with this tag
function tagDraft(tag) {
  const devs = [...DEVICE_SEL].map(id => DATA.managedDevices.find(d => d.id === id));
  const notAp = devs.filter(d => !d?.autopilotId).length;
  const ap = devs.filter(d => d?.autopilotId);
  const same = ap.filter(d => (d.groupTag || '') === tag);
  const change = ap.filter(d => (d.groupTag || '') !== tag)
    .map(d => ({ autopilotId: d.autopilotId, deviceId: d.id, serial: d.serialNumber || '', deviceName: d.deviceName || '', oldTag: d.groupTag || '', batch: 0, status: 'pending', verifiedAt: '', attempts: 0, lastOpenedAt: '' }));
  return { change, same: same.length, notAp };
}
// Groups a device would be in with a given tag: dynamic rule matches + known static memberships
function tagGroupIds(d, tag) {
  const props = buildSimProps(simFromDevice({ ...d, groupTag: tag }));
  const ids = new Set(DATA.groups.filter(g => isDyn(g) && g.membershipRule && evalRule(g.membershipRule, props)).map(g => g.id));
  const known = deviceGroupsState(d);
  if (known.status === 'ok') known.groups.filter(g => !isDyn(g)).forEach(g => ids.add(g.id));
  return ids;
}
function tagPreviewHtml(items, newTag) {
  const byOld = new Map();
  items.forEach(it => { const l = byOld.get(it.oldTag) || []; l.push(it); byOld.set(it.oldTag, l); });
  const gName = id => DATA.groups.find(g => g.id === id)?.displayName || id;
  const profLabel = ps => !ps.length ? '<span class="tr-pill tr-pill-red">No profile</span>'
    : ps.length > 1 ? `<span class="tr-pill tr-pill-amber" title="${htmlAttr(ps.map(p => p.displayName).join(', '))}">Multiple profiles</span>`
    : `<span class="tr-pill tr-pill-gray">${esc(ps[0].displayName)}</span>`;
  const counted = (map, n) => [...map.entries()].sort((a, b) => ciCmp(gName(a[0]), gName(b[0])))
    .map(([id, c]) => `${esc(gName(id))}${c < n ? ` <span class="gp-muted">(${c} of ${n})</span>` : ''}`).join(', ');
  const newL = newTag.toLowerCase();
  const collisions = DATA.groups.filter(g => isDyn(g) && g.membershipRule) .filter(g => {
    const tags = orderContainsTags(g.membershipRule);
    return tags.length && !tags.some(t => t.toLowerCase() === newL) && evalRule(g.membershipRule, buildSimProps({ ...SIM_DEFAULTS, groupTag: newTag }));
  });
  const blocks = [...byOld.entries()].sort((a, b) => ciCmp(a[0], b[0])).map(([oldTag, list]) => {
    const transitions = new Map(), joined = new Map(), left = new Map();
    const devOf = it => DATA.managedDevices.find(x => x.id === it.deviceId) || { deviceName: it.deviceName, serialNumber: it.serial, groupTag: oldTag };
    // One representative live device per group: its actual memberOf (static groups) backs the profile result
    const rep = demoMode ? null : list.map(devOf).find(d => d.azureADDeviceId);
    if (rep) loadDeviceGroups(rep);
    const repState = rep ? (DEVICE_GROUPS_CACHE[rep.id]?.status || 'loading') : 'none';
    const rulesOnly = repState !== 'ok' && repState !== 'loading';   // autopilot-only, error or demo
    const label = ps => rulesOnly && !ps.length ? '<span class="tr-pill tr-pill-amber">No profile</span>' : profLabel(ps);
    list.forEach(it => {
      const d = devOf(it);
      const before = tagGroupIds(d, oldTag), after = tagGroupIds(d, newTag);
      const key = label(deviceProfiles({ ...d, groupTag: oldTag }, before)) + ' → ' + label(deviceProfiles({ ...d, groupTag: newTag }, after));
      transitions.set(key, (transitions.get(key) || 0) + 1);
      after.forEach(id => { if (!before.has(id)) joined.set(id, (joined.get(id) || 0) + 1); });
      before.forEach(id => { if (!after.has(id)) left.set(id, (left.get(id) || 0) + 1); });
    });
    const n = list.length;
    return `<div class="gt-block">
      <div class="gt-btitle">${oldTag ? `<span class="tr-pill tr-pill-accent">${esc(oldTag)}</span>` : '<span class="gp-muted">No tag</span>'} → <span class="tr-pill tr-pill-accent">${esc(newTag)}</span> <span class="gp-muted">${n} ${n === 1 ? 'device' : 'devices'}</span></div>
      <dl class="dv-props">
        <dt>Autopilot profile</dt><dd>${repState === 'loading' ? '<span class="gp-muted">Checking…</span>'
          : [...transitions.entries()].map(([k, c]) => `<div>${k}${c < n ? ` <span class="gp-muted">(${c})</span>` : ''}</div>`).join('')
            + (rulesOnly ? '<div class="gp-muted">(based on rules; static group memberships not included)</div>' : '')
            + (repState === 'ok' ? `<div class="gp-muted">Based on ${esc(rep.deviceName || rep.serialNumber)} as sample. Devices with different static group memberships may differ.</div>` : '')}</dd>
        <dt>Joins</dt><dd>${joined.size ? counted(joined, n) : '<span class="gp-muted">—</span>'}</dd>
        <dt>Leaves</dt><dd>${left.size ? counted(left, n) : '<span class="gp-muted">—</span>'}</dd>
      </dl></div>`;
  }).join('');
  return blocks + collisions.map(g => `<div class="gp-warn">⚠ Also matches ${esc(g.displayName)} (rule uses -contains)</div>`).join('');
}

const tagRetryable = it => it.status === 'not changed' || it.status === 'error';   // 'not found' can't succeed
// Risk acknowledgment: on the job once it exists, before that on the draft
const tagAckAt = () => activeTagJob()?.acknowledgedAt || TAG_UI.ackAt || '';
function acknowledgeTagRisk() {
  const now = new Date().toISOString(), job = activeTagJob();
  if (job) { job.acknowledgedAt = now; saveTagJob(job); } else TAG_UI.ackAt = now;
  TAG_UI.showNotice = false;
  renderTagDialogBody();
}
function toggleTagNotice() { TAG_UI.showNotice = !TAG_UI.showNotice; renderTagDialogBody(); }
function tagNoticeHtml() {
  const text = `<div class="gt-notice-title">You make these changes, with your own account.</div>
    <p>Autopilotlens doesn't change anything in your tenant. It only prepares the requests you run in Graph Explorer.</p>
    <p>Requirements: your account needs the Graph permission <code class="tr-mono">DeviceManagementServiceConfig.ReadWrite.All</code> (consented for Graph Explorer) and an Intune role that allows changing Autopilot devices. Without them, Graph returns 403 and nothing is changed.</p>
    <p>Group tags control Autopilot profiles and dynamic groups, so a wrong tag can give devices the wrong setup. Use at your own risk. The tool is provided as is, with no warranty.</p>`;
  if (!tagAckAt()) return `<div class="gt-notice" role="note">${text}<div><button type="button" class="btn btn-ghost" onclick="acknowledgeTagRisk()">OK, I understand the risk</button></div></div>`;
  return TAG_UI.showNotice
    ? `<div class="gt-notice" role="note">${text}<div><button type="button" class="ov-link" aria-expanded="true" onclick="toggleTagNotice()">Hide notice</button></div></div>`
    : `<div class="gp-muted">Risk acknowledged · your own account and permissions · <button type="button" class="ov-link" aria-expanded="false" onclick="toggleTagNotice()">Show notice</button></div>`;
}
function batchStatusHtml(job, b) {
  const items = job.items.filter(it => it.batch === b.n);
  const demo = job.scope === 'demo';
  const lock = tagAckAt() ? '' : ' disabled title="Read the notice above first"';   // every link button waits for the acknowledgment
  const ok = items.filter(it => it.status === 'verified').length, checked = items.filter(it => it.status !== 'pending').length;
  if (b.status !== 'opened' && !checked) return demo
    ? `<button type="button" class="btn btn-ghost" onclick="openTagBatch(${b.n})"${lock}>Demo: simulate run</button>`
    : `<button type="button" class="btn btn-ghost" onclick="openTagBatch(${b.n})"${lock}>Open in Graph Explorer ↗</button>`;
  if (ok === items.length) return `<span class="tr-pill tr-pill-green">✓ ${ok} verified</span>`;
  let status;
  if (checked) {
    const parts = [['not changed', 'not changed', 'not changed'], ['not found', 'not found', 'not found'], ['error', 'error', 'errors'], ['retry opened', 'retry opened', 'retry opened']]
      .map(([st, one, many]) => { const c = items.filter(it => it.status === st).length; return c ? `${c} ${c === 1 ? one : many}` : ''; }).filter(Boolean);
    status = `<span class="tr-pill tr-pill-amber">${ok} of ${items.length}${parts.length ? ' · ' + parts.join(' · ') : ''}</span>`;
  } else {
    status = `<span class="gp-muted">${demo ? 'Simulated run · press Verify' : 'Opened · press Run query in Graph Explorer'}</span>`;
  }
  const retry = items.filter(tagRetryable), notFound = items.filter(it => it.status === 'not found');
  const nc = retry.filter(it => it.status === 'not changed').length, errs = retry.length - nc;
  const retryTip = [`Includes ${nc} not changed${errs ? ` and ${errs} ${errs === 1 ? 'error' : 'errors'}` : ''}.`,
    notFound.length ? `Not found (excluded): ${notFound.map(it => it.serial || it.autopilotId).join(', ')}` : ''].filter(Boolean).join(' ');
